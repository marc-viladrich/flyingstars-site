  - type: textMedia
    id: choreografie
    kicker: Individuelle Choreografie
    headline: So einzigartig wie eure Lovestory
    body: Ein Schwarm strahlender Lichtshow-Drohnen zeichnet eure Initialen, Liebesschwüre und Insider ans Firmament. Passend zur Musik und maßgeschneidert auf eure Wünsche.
    _key: k_52056666f5076b5e0423

  - type: textMedia
    id: familienfreundlich
    kicker: Familienfreundlich
    headline: Kinder und Hunde willkommen
    body: Im Gegensatz zum Feuerwerk gibt es beim Drohnenballett keinen lauten Knall, störenden Rauch oder Abfall mit Brandgefahr. Nur ein leises Surren – und das Staunen der Gäste.
    _key: k_59a09168d2946ce16e34

  - type: steps
    id: vorteile
    kicker: Vorteile
    headline: Unsere Versprechen
    ownNumbers: true
    steps:
      - { title: Umfassend, text: "Design, Musik, Show, Genehmigungen: Wir nehmen euch alles aus einer Hand ab.", "_key": "k_856e2a0f8b72501f0a1b" }
      - { title: International, text: "Egal, wo ihr feiert – wir sind dabei: In Deutschland, Österreich, der Schweiz oder weltweit.", "_key": "k_f070569c03c9b4b11034" }
      - { title: Sicher, text: Wir sind LBA- und EASA-zertifiziert und stellen einen Sicherheitsbereich von 100 x 100 Metern., "_key": "k_85e68777aa937b3e85b1" }
    _key: k_9d2cf9c04b90b456039c

  - type: landingRefs
    id: referenzen
    kicker: Referenzen
    headline: Nächte, die wir nie vergessen
    projects:
      - heiratsantrag-hugenpoet
      - hochzeit-recklinghausen
    cards:
      - { ref: heiratsantrag-hugenpoet, title: Heiratsantrag in Essen, kicker: Sie hat Ja gesagt!, text: "Mit 220 Drohnen durften wir unserem Klienten Armin dabei helfen, seine Berina zu gewinnen. Begleitet von einer Violinistin hüllten wir den Himmel über dem Schloss Hugenpoet in zartes Weiß.", "_key": "k_1cd45074068daabdd5a2" }
      - { ref: hochzeit-recklinghausen, title: Hochzeit in Recklinghausen, kicker: Überraschung für das Brautpaar, text: "Veronika und Felix staunten, als plötzlich ihre Liebesgeschichte über ihnen aufflammte. Auf Wunsch der Familie durften wir die Choreografie im Geheimen vorbereiten.", "_key": "k_0df1ee61f7ea5938057b" }
    _key: k_6500b76af74b7dd741ca

  - type: landingTeaser
    id: preise
    kicker: Kosten
    headline: Stellt eure Show zusammen
    text: Unsere Drohnenshows starten bei 7900 Euro (netto) zuzüglich Anfahrt. Mit mehr Drohnen, Individualisierung und Zusätzen wie Fotos oder Videos der Aufführung könnt ihr euer Paket anpassen.
    href: "/drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator"
    cta: Pakete ansehen
    loop: hochzeit
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    _key: k_3f8f37b2eb211e01710f

  - type: steps
    id: ablauf
    kicker: Ablauf
    headline: Wir planen, ihr lehnt euch zurück
    ownNumbers: true
    steps:
      - { title: "#1 Anfrage", text: "Wann und wo heiratet ihr? In 48 Stunden melden wir uns zurück, um uns kennenzulernen und euch ein festes Angebot zu unterbreiten. Eine Begehung eurer Location ist selten nötig.", "_key": "k_6b92c66eeb04fdf588fc" }
      - { title: "#2 Vorbereitung", text: "Ihr erzählt uns von eurer Liebesgeschichte. Wir bauen daraus eine Choreografie. Und weil die Hochzeitsplanung schon stressig genug ist, kümmern wir uns auch um Genehmigungen und Co.", "_key": "k_54439060443f507bff93" }
      - { title: "#3 Hochzeit", text: "Ab dreieinhalb Stunden vor dem Drohnentanz bereiten wir vor. Die Show selbst dauert bis zu 25 Minuten. Ihr dürft zuschauen und staunen – Auf- und Abbau sowie Sicherheit organisieren wir.", "_key": "k_77816c393a12e22dfcb5" }
    _key: k_bd1dd6072c1145a15939

  - type: team
    id: ueber
    kicker: Über FlyingStars
    headline: Es ist uns eine Ehre, eure Gäste sein zu dürfen
    text: "Normalerweise fliegen wir für Städte, Festivals und Weltkonzerne wie L’Oréal, Prada oder Spotify. Einen besonderen Platz in unserem Fotoalbum nehmen aber die Brautpaare ein, deren Hochzeit wir unvergesslich machen durften. Deshalb sind wir einer der wenigen Anbieter, die auch für private Feiern fliegen. Auf eurem Fest sorgen wir mit kleiner Mannschaft im Hintergrund dafür, dass alles reibungslos abläuft."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    cta: { label: Über uns, href: /ueber-uns/ }
    todo: FlyingStars muss ein Teamfoto liefern.
    _key: k_3ed49f154258b655d578

