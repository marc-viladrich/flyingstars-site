title: Vraag een show aan
description: Vertel FlyingStars jullie datum, locatie en gelegenheid. We reageren binnen 48 uur per e-mail, telefoon, WhatsApp of videogesprek.
sections:
  - type: contactForm
    kicker: Aanvraag
    headline: Vertel ons over jullie datum.
    text: Datum, locatie en gelegenheid zijn genoeg voor een eerste inschatting. Laat open wat jullie nog niet weten. Versturen is nog geen boeking.
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.
    _key: k_f0a092b80d21327d2779
  - type: steps
    id: danach
    kicker: Verloop
    headline: In vier stappen naar jullie show.
    steps:
      - title: Antwoord
        text: We antwoorden binnen 48 uur per e-mail, met vragen of een eerste inschatting.
        duration: 48 h
        _key: k_72829c00aebbc8f431d5
      - title: Eerste gesprek
        text: In een kort telefoon- of videogesprek bespreken we locatie, beelden en omvang.
        _key: k_a160e9ad6c320d2f6921
      - title: Offerte
        text: Jullie ontvangen een schriftelijke offerte. Bij de boeking betalen jullie 40% aan.
        _key: k_f089638c8eafa18d9f2a
      - title: Planning
        text: We controleren de locatie, regelen de vergunning en ontwerpen de show samen met jullie.
        _key: k_f79e63f76325e9bc1fb5
    _key: k_fda489b526df488c90a3
  - type: contactDetails
    kicker: Contact
    headline: Liever direct praten?
    text: "Achter elk contactkanaal staat hetzelfde team: Ronja, Florian en Erwin."
    visitNote: Meld jullie vooraf even aan.
    todo: Teamfoto fehlt, bis dahin stehen hier die Porträts der Geschäftsführer:innen. FlyingStars muss den Terminbuchungs-Link und die Kontaktwege vor dem Relaunch bestätigen; Moritz muss die Kontakttexte und EN/NL prüfen.
    _key: k_b12e1279f01fbae7cfb2
