title: Drone shows for advertising
navLabel: Brands & advertising
description: "Drone shows for brands and agencies: your logo in the night sky, with every motif approved in advance. For launches, anniversaries and campaigns."
image: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
sections:
  - type: landingHero
    kicker: Brands & advertising
    headline: Your brand in the *night sky*.
    text: We turn your logo and message into drones, matched to your music and campaign. You approve every motif before the show.
    cta:
      label: Enquire about a brand show
      href: "#anfrage"
    secondary:
      label: For agencies
      href: "#agenturen"
    video: ford
    videoLabel: Ford Explorer · Cologne
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
      alt: Volkswagen logo made of drones above Lake Wolfgangsee, guests filming from a terrace
      width: 1920
      height: 1281
    facts:
      - value: { fact: showsTotal }
        label: shows since 2022
      - value: { fact: responseHours, display: hours }
        label: until our reply
      - value: 1–2 weeks
        label: with express service
    todo: Moritz muss die deutsche Endfassung und die maschinell übersetzten EN-/NL-Texte redaktionell prüfen.
  - type: logoBar
    id: marken
    headline: Brands we've flown for
    logos:
      - name: Ford
        file: /brand/logos/kunde-ford-weiss.svg
      - name: Volkswagen
        file: /brand/logos/kunde-volkswagen-weiss.svg
      - name: PUMA
        image:
          src: https://flyingstars.art/wp-content/uploads/2023/04/Puma_Logo_weiss.png
          alt: PUMA
          width: 300
