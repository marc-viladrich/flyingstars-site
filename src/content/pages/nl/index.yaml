    items:
      - icon: timer
        title: Snel
        text: We maken shows ook binnen één tot twee weken mogelijk. Als geautoriseerde operator mogen we veel vergunningsprocedures overslaan.
        _key: k_e8d0aa1d372af5e42c97
      - icon: globe
        title: Internationaal
        text: We vliegen in Duitsland, Oostenrijk en Zwitserland – en dankzij uitgebreide vergunningen ook snel in de EU en wereldwijd.
