  - type: textMedia
    id: marketing
    kicker: Advertising and marketing with drones
    headline: Your company on the world's biggest stage
    body: "The new product whose launch everyone should hear about. The ad film with a wow factor. The brand campaign that burns your logo back into people's minds.\n\nTogether we build a bespoke choreography that tells your brand's story. More than just your logo, a claim or your company name – emotional storytelling that enchants.\n\nOur drone shows are an alternative to fireworks that hardly anyone knows yet. Attention guaranteed, even from miles away."
    mediaSide: right
    cta:
      label: Request a show
      href: "#anfrage"
    _key: k_7abf894f6f4dfb7d5b8c
  - type: textMedia
    id: komplettpaket
    kicker: Complete package
    headline: Everything your marketing needs
    body: "From idea to applause, we support you throughout the entire planning and execution.\n\n- Technology: we provide the hardware, software and light drones.\n- Music: let the drones dance to your playlist.\n- Promotional material: on request, we create photos and film footage.\n- Permits: we take care of all the red tape.\n- Safety: LBA and EASA certified, liability insurance up to €1.3 million.\n- Speed: planning in under two weeks is possible.\n- International: in Germany, Europe and worldwide"
    mediaSide: right
    cta:
      label: Request a show
      href: "#anfrage"
    _key: k_5fce2f823d9e547c9f3a
  - type: steps
    id: agenturen
    kicker: Advantages
    headline: Our experience from 150+ B2B shows
    steps:
      - title: "We fly, you shine"
        text: We are happy to sign NDAs for your advertising or marketing agency.
        _key: k_8949ebf1a13706740934
      - title: Brand-safe
        text: You approve every motif so you stay in control of your brand.
        _key: k_fbb4c3639f44f4ea8804
      - title: KPI-driven
        text: "Results count: we work with you to measure success."
        _key: k_cee3e178d47544d71e22
    ownNumbers: true
    _key: k_35809e7974828f33e234
  - type: landingRefs
    id: referenzen
    kicker: References
    todo: Für E.ON fehlen Showbild, genaues Datum und Fallstudie.
    headline: Seen by hundreds of thousands
    cta:
      label: All references
      href: /referenzen/
    projects:
      - spotify-luciano-apache
      - loreal-prada-rheinturm
      - eon-hamburg
    cards:
      - ref: spotify-luciano-apache
        title: Spotify
        kicker: Visual album release
        text: "When Luciano and Apache 207 collaborate, something big happens. For the release of their new EP, we staged it visually with 350 drones above Prenzlauer Berg."
        _key: k_78b56031fa52bc4e444c
      - ref: loreal-prada-rheinturm
        title: L’Oréal x Prada
        kicker: A product launch nobody could miss
        text: "A perfume that shines brighter than the Rhine Tower: with 350 drones in the heart of Düsseldorf, we staged a performance that was shared hundreds of times."
        _key: k_da7261ca4e5d1bd54a6d
      - ref: eon-hamburg
        title: E.ON
        kicker: The Future is Now
        text: "With 500 drones, we turned the Port of Hamburg into the biggest stage of the E.ON New Energy Experience 2026. The tribute to the Hanseatic city thrilled thousands of spectators."
        _key: k_c4bbae2e1586193f7306
    _key: k_1f617bd698f4f907e713
  - type: steps
    id: ablauf
    kicker: Process
    headline: Three steps to your show
    steps:
      - title: "#1 Enquiry"
        text: "Tell us the date, place and occasion. We get back to you within 48 hours to arrange an initial call. A site visit is rarely needed."
        _key: k_e01bd8edb2e65fef3485
      - title: "#2 Planning"
        text: "We develop the choreography, including motifs and music. You are as involved as you want to be. With the landowners' consent, we obtain all permits."
        _key: k_b22b05daa48eb35fd92c
      - title: "#3 Show day"
        text: "We take care of everything: set-up three and a half hours before the performance, safety, dismantling. The drone advertising itself runs for up to 25 minutes."
        _key: k_9ebfd8a7c65e0d2211e6
    ownNumbers: true
    _key: k_a7152263e0461f67ead9
  - type: landingTeaser
    id: preise
    kicker: Prices
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    headline: Put your show together
    text: "Start with our base packages and add more drones, more customisation, more spectacle. Always as a fixed package with no surprises."
