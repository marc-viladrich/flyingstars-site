  - type: textMedia
    id: unterschied
    kicker: Alternative zur Lichtshow
    headline: Faszinierend wie Feuerwerk, sicher wie Laser
    body: |-
      Wir holen das Funkeln, den Glanz und die staunenden Gäste des Feuerwerks unter euer Dach. Ohne Abfall, Rauch und nur mit einem leisen Surren.

      Eure Indoor-Drohnenshow ist eine fünf- bis achtminütige Choreografie, die die Aufmerksamkeit aller Besucher:innen fesselt. Denn kaum ein Gast hat bereits einen der magischen Tänze gesehen – geschweige denn im Innenraum.

      Deshalb gestalten wir faszinierende Motive unterlegt mit Musik, die eure Geschichte erzählen. Ab 50 Drohnen auch mit individuellen Figuren wie eurem Logo oder euren Initialen.
    cta: { label: Show anfragen, href: "#anfrage" }
    _key: k_c030e32b9a3f99dac46e

  - type: textMedia
    id: komplettpaket
    kicker: Komplettpaket
    headline: Seid Gast auf eurem eigenen Event
    body: |-
      Wir kümmern uns um die komplette Planung, Durchführung und den Abbau. Ihr genießt die Aufführung.

      - Ab 20 Drohnen, aufwärts unbegrenzt.
      - Synchronisiert mit Musik.
      - Auf Wunsch mit Foto- und Videoaufnahmen.
      - Wir übernehmen alle Genehmigungen.
      - Strenge Sicherheitsstandards.
      - Vorbereitung in unter zwei Wochen möglich.
      - In Deutschland, Europa und weltweit.
    cta: { label: Show anfragen, href: "#anfrage" }
    _key: k_261100f50aa3e8f06fcd

  - type: textMedia
    id: sicherheit
    kicker: Sicherheit
    headline: Für eine sorglose Darbietung
    body: |-
      Wir erfüllen die strengen Sicherheitsauflagen, die für Indoor-Drohnenshows gelten. Deshalb benötigen wir eine Freifläche von etwa 10 x 10 Metern und eine Deckenhöhe von mindestens drei Metern. Ein Vorteil im Inneren: Wind und Wetter stellen kein (Absage-)Risiko dar.

      Zusätzlich setzen wir auf redundante Sicherheitsmechanismen. Die Rotoren sind physikalisch geschützt, alle Komponenten CE-zertifizert. Die Drohnen fliegen langsam und wiegen unter 200 Gramm.

      Wir sind zertifiziert nach Luftfahrt-Bundesamt und EU Aviation Safety. Der TÜV NORD bescheinigt unserer Flotte zudem die Einhaltung des Schallschutzes. Im Fall der Fälle sichert euch unsere Haftpflicht bis 1,3 Mio. Euro ab.
    todo: "Moritz: Tippfehler „CE-zertifizert“ wortgetreu übernommen. FlyingStars muss Indoor-Flugfläche, Sicherheitsfunktionen und die für Indoor geltende Haftpflichtdeckung bestätigen."
    _key: k_1060f8471da9620b9d94

