    cards:
      - ref: spotify-luciano-apache
        title: Spotify
        kicker: Visuele albumrelease
        text: Als Luciano en Apache 207 samenwerken, ontstaat er iets groots. Hun nieuwe EP mochten we bij de release met 350 drones boven Prenzlauer Berg visueel in scène zetten.
        _key: k_78b56031fa52bc4e444c
      - ref: loreal-prada-rheinturm
        title: L’Oréal x Prada
        kicker: Een productlancering die niemand kon missen
        text: "Een parfum dat feller straalt dan de Rheinturm: met 350 drones midden in Düsseldorf verzorgden we een voorstelling die honderden keren werd gedeeld."
        _key: k_da7261ca4e5d1bd54a6d
      - ref: exploring-reinvented-der-neue-ford-explorer
        title: Ford
        kicker: Autolancering
        text: Bij de lancering van de nieuwe Ford Explorer schreven 350 drones de naam boven het Electric Vehicle Center in Keulen.
        _key: k_d03a5549db87ffe48729
      - ref: nfl-berlin-game
        title: NFL
        kicker: Sportevenement
        text: Voor de NFL Berlin Game 2025 vlogen 300 drones het hoefijzer van de Indianapolis Colts boven het Olympiastadion.
        _key: k_de73f7479d245b809aec
      - ref: puma-bundesliga
        title: PUMA
        kicker: Op korte termijn
        text: "De aanvraag kwam 14 dagen voor de derby: 100 drones toonden het PUMA-logo precies op tijd voor de aftrap in het Borussia-Park."
        _key: k_87ccd298edb04bc4e9f7
      - ref: eon-hamburg
        title: E.ON
        kicker: The Future is Now
        text: Met 500 drones maakten we van de haven van Hamburg het grootste podium van de E.ON New Energy Experience 2026. De hommage aan de Hanzestad maakte duizenden toeschouwers enthousiast.
        _key: k_c4bbae2e1586193f7306
    _key: k_1f617bd698f4f907e713
  - type: landingFlow
    id: ablauf
    kicker: Verloop
    headline: In drie stappen naar jullie *show*
    steps:
      - title: "#1 Aanvraag"
        text: Jullie vertellen ons datum, locatie en gelegenheid. We nemen binnen 48 uur contact op om een eerste gesprek in te plannen. Een bezichtiging is zelden nodig.
        duration: 48 u
        gate: false
        _key: k_e01bd8edb2e65fef3485
      - title: "#2 Planning"
        text: Wij ontwikkelen de choreografie met motieven en muziek. Jullie zijn zo betrokken als jullie willen. Met toestemming van de grondeigenaren regelen wij alle vergunningen.
        duration: mogelijk in minder dan 2 weken
        gate: false
        _key: k_b22b05daa48eb35fd92c
      - title: "#3 Showdag"
        text: "Wij regelen alles: opbouw drieënhalf uur voor de voorstelling, veiligheid, afbouw. De dronereclame zelf duurt tot 25 minuten."
        duration: 3,5 u opbouw · show tot 25 min
        gate: false
        _key: k_9ebfd8a7c65e0d2211e6
    _key: k_a7152263e0461f67ead9
  - type: landingSite
    id: standort
    kicker: Locatie
    todo: "FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Schriftliche Nutzungsfreigaben für LBA-, EASA- und naturstrom-Logos fehlen."
    headline: Is jullie locatie geschikt?
    text: Stuur ons het adres en de geplande positie van jullie publiek. Voordat we een offerte maken, beoordelen we of en hoe een show daar mogelijk is.
    variant: outdoor
    safetyRef: safety-concept
    _key: k_c4fd3256a7a568abb827
