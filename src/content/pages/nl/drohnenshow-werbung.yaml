  - type: textMedia
    todo: "Moritz: im letzten Absatz fehlt ein Verb („Unsere Drohnenshows [sind] eine Alternative …“), bewusst wortgetreu übernommen."
    id: marketing
    kicker: Werbung und Marketing mit Drohnen
    headline: Euer Unternehmen auf der größten Bühne der Welt
    body: |-
      Das neue Produkt, von dessen Launch jede:r etwas mitbekommen soll. Das Werbevideo mit Wow-Effekt. Die Brand-Kampagne, die euer Logo wieder in den Köpfen einbrennt.
  
      Gemeinsam bauen wir eine individuelle Choreografie, die die Geschichte eurer Marke erzählt. Mehr als nur euer Logo, ein Claim oder euer Firmenname – sondern emotionales Storytelling, das verzaubert.
  
      Unsere Drohnenshows eine Alternative zum Feuerwerk, die noch kaum jemand kennt. Aufmerksamkeit garantiert, selbst aus Kilometern Entfernung.
    mediaSide: right
    cta:
      label: Show anfragen
      href: "#anfrage"
    _key: k_7abf894f6f4dfb7d5b8c
  - type: textMedia
    id: komplettpaket
    kicker: Komplettpaket
    headline: Alles drin für euer Marketing
    body: |-
      Von der Idee bis zum Applaus begleiten wir euch in der gesamten Planung und Durchführung.
  
      - Technik: Wir stellen Hardware, Software und Lichtdrohnen.
      - Musik: Lasst die Drohnen zu eurer Playlist tanzen.
      - Werbematerial: Auf Wunsch kreieren wir Fotos und Filmaufnahmen.
      - Genehmigungen: Wir übernehmen die komplette Bürokratie.
      - Sicherheit: LBA- und EASA-zertifiziert, Haftpflicht bis 1,3 Mio. Euro.
      - Schnelligkeit: Planung in unter zwei Wochen möglich.
      - International: In Deutschland, Europa und weltweit
    mediaSide: right
    cta:
      label: Show anfragen
      href: "#anfrage"
    _key: k_5fce2f823d9e547c9f3a
  - type: steps
    id: agenturen
    kicker: Bureaus
    headline: Jullie blijven het gezicht, wij leveren de show.
    steps:
      - title: Wir fliegen, ihr glänzt
        text: Gerne unterschreiben wir NDAs für eure Werbe- oder Marketing-Agentur.
        _key: k_8949ebf1a13706740934
      - title: Markensicher
        text: Ihr gebt alle Motive frei, um die Kontrolle über eure Brand zu behalten.
        _key: k_fbb4c3639f44f4ea8804
      - title: KPI-orientiert
        text: "Die Ergebnisse zählen: Wir arbeiten mit euch zusammen, um Erfolge zu messen."
        _key: k_cee3e178d47544d71e22
    ownNumbers: true
    _key: k_35809e7974828f33e234
  - type: landingRefs
    id: referenzen
    kicker: Onze shows
    todo: Für E.ON fehlen Showbild, genaues Datum und Fallstudie.
    headline: Grote merken, grote podia.
    cta:
      label: Al onze shows
      href: /referenzen/
    projects:
      - spotify-luciano-apache
      - loreal-prada-rheinturm
      - eon-hamburg
    cards:
      - ref: spotify-luciano-apache
        title: Spotify
        kicker: Visueller Album-Release
        text: Wenn Luciano und Apache 207 kollaborieren, entsteht Großes. Ihre neue EP durften wir zur Veröffentlichung mit 350 Drohnen über dem Prenzlauer Berg visuell inszenieren.
        _key: k_78b56031fa52bc4e444c
      - ref: loreal-prada-rheinturm
        title: L’Oréal x Prada
        kicker: Unübersehbarer Produktlaunch
        text: "Ein Parfüm, das heller leuchtet als der Rheinturm: Mit 350 Drohnen mitten in Düsseldorf veranstalteten wir eine Aufführung, die hundertfach geteilt wurde."
        _key: k_da7261ca4e5d1bd54a6d
      - ref: eon-hamburg
        title: E.ON
        kicker: The Future is Now
        text: Mit 500 Drohnen machten wir den Hamburger Hafen zur größten Bühne der E.ON New Energy Experience 2026. Die Hommage an die Hansestadt begeisterte tausende Zuschauer:innen.
        _key: k_c4bbae2e1586193f7306
    _key: k_1f617bd698f4f907e713
  - type: steps
    id: ablauf
    kicker: Verloop
    headline: Van logo tot complete show.
    steps:
      - title: "#1 Anfrage"
        text: Ihr erzählt uns von Datum, Ort und Anlass. Wir melden uns innerhalb von 48 Stunden zurück, um ein Erstgespräch zu vereinbaren. Eine Begehung ist selten nötig.
        _key: k_e01bd8edb2e65fef3485
      - title: "#2 Planung"
        text: Wir entwickeln die Choreo samt Motiven und Musik. Ihr seid so viel involviert, wie ihr möchtet. Mit Zustimmung der Grundstückseigentümer:innen holen wir alle Genehmigungen ein.
        _key: k_b22b05daa48eb35fd92c
      - title: "#3 Showtag"
        text: "Wir kümmern uns um alles: Aufbau dreieinhalb Stunden vor der Aufführung, Sicherheit, Abbau. Die Drohnen-Werbung selbst läuft für bis zu 25 Minuten."
        _key: k_9ebfd8a7c65e0d2211e6
    ownNumbers: true
    _key: k_a7152263e0461f67ead9
  - type: landingTeaser
    id: preise
    kicker: Showconfigurator
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    headline: Hoe ziet jullie *logo* er aan de hemel uit?
    text: Upload jullie logo in de configurator en bekijk het als droneformatie, met beelden van SPARK tot ODYSSEY.
    href: /drohnenshow-preise/?anlass=launch#konfigurator
    cta: Probeer jullie logo in de configurator
    loop: marke
    _key: k_1f4f4d01bf5354a2a7ba
