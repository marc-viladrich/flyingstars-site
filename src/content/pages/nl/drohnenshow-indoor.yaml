  - type: textMedia
    id: unterschied
    kicker: Alternatief voor de lichtshow
    headline: "Fascinerend als vuurwerk, veilig als laser"
    body: "We halen de fonkeling, de glans en de verwonderde gasten van vuurwerk onder jullie dak. Zonder afval en rook, en met alleen een zacht gezoem.\n\nJullie indoor-droneshow is een choreografie van vijf tot acht minuten die de aandacht van alle bezoekers vasthoudt. Want bijna geen gast heeft al eens zo'n magische dans gezien – laat staan binnen.\n\nDaarom ontwerpen we fascinerende motieven op muziek die jullie verhaal vertellen. Vanaf 50 drones ook met eigen figuren, zoals jullie logo of jullie initialen."
    mediaSide: right
    cta:
      label: Show aanvragen
      href: "#anfrage"
    _key: k_c030e32b9a3f99dac46e
  - type: textMedia
    id: komplettpaket
    kicker: Totaalpakket
    headline: Wees gast op jullie eigen event
    body: "Wij zorgen voor de complete planning, uitvoering en afbouw. Jullie genieten van de voorstelling.\n\n- Vanaf 20 drones, naar boven onbeperkt.\n- Gesynchroniseerd met muziek.\n- Op verzoek met foto- en video-opnamen.\n- Wij regelen alle vergunningen.\n- Strenge veiligheidsnormen.\n- Voorbereiding in minder dan twee weken mogelijk.\n- In Duitsland, Europa en wereldwijd."
    mediaSide: right
    cta:
      label: Show aanvragen
      href: "#anfrage"
    _key: k_261100f50aa3e8f06fcd
  - type: textMedia
    todo: "FlyingStars muss Indoor-Flugfläche, Sicherheitsfunktionen und die für Indoor geltende Haftpflichtdeckung bestätigen."
    id: sicherheit
    kicker: Veiligheid
    headline: Voor een zorgeloze voorstelling
    body: "We voldoen aan de strenge veiligheidseisen die voor indoor-droneshows gelden. Daarom hebben we een vrije ruimte van ongeveer 10 x 10 meter en een plafondhoogte van minstens drie meter nodig. Een voordeel binnen: wind en weer vormen geen (annulerings)risico.\n\nDaarnaast zetten we in op redundante veiligheidsmechanismen. De rotoren zijn fysiek afgeschermd, alle onderdelen zijn CE-gecertificeerd. De drones vliegen langzaam en wegen minder dan 200 gram.\n\nWe zijn gecertificeerd door het Duitse Luftfahrt-Bundesamt en EU Aviation Safety. TÜV NORD bevestigt bovendien dat onze vloot aan de geluidsnormen voldoet. Mocht het toch misgaan, dan dekt onze aansprakelijkheidsverzekering jullie tot € 1,3 mln."
    mediaSide: right
    _key: k_1060f8471da9620b9d94
  - type: textMedia
    id: preise
    kicker: Prijzen
    headline: Volledige controle over jullie show
    body: "Onze indoor-droneshows beginnen bij € 15.000 (excl. btw) plus reiskosten. We stellen graag een pakket op maat voor jullie samen, en daar blijft het bij – geen verrassingen."
    mediaSide: right
    cta:
      label: Show aanvragen
      href: "#anfrage"
    _key: k_2957e41a82a467bac50c
  - type: steps
    id: ablauf
    kicker: Verloop
    headline: Een beproefd proces
    steps:
      - title: "#1 Aanvraag"
        text: "Als jullie ons datum, locatie en gelegenheid doorgeven, komen we binnen 48 uur terug met ideeën. Een eerste gesprek is de volgende stap, een afspraak ter plaatse is zelden nodig."
        _key: k_bcd783da285c16316e38
      - title: "#2 Planning"
        text: "Wij bouwen verhaallijn en motieven. Jullie wensen zijn van harte welkom. We regelen bovendien alle vergunningen, jullie leveren alleen de toestemming van de grondeigenaren."
        _key: k_1a7a9d6124366c37cbbf
      - title: "#3 Showdag"
        text: "Terwijl jullie je om de gasten bekommeren, bouwen wij op (drieënhalf uur), voeren de show uit (vijf tot acht minuten) en breken geruisloos weer af."
        _key: k_2a47818390caa6ae1614
    ownNumbers: true
    _key: k_cca8a7702a948ca38dce
  - type: landingSpotlight
    id: referenzen
    kicker: Referenties
    todo: "Für Siemens Hannover Messe und Triple Z fehlen Fallstudien und eindeutig zugeordnete Showbilder. Triple Z: Moritz nennt Juni 2026, der Fragebogen September 2026."
    headline: Enkele van onze favoriete voorstellingen
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
      alt: Lichtgevende drones in formatie voor het podium van een volle zaal
      width: 1200
      height: 764
    tags: []
    entries:
      - kicker: Een beursstand eens anders
        title: Siemens
        text: Op de Hannover Messe 2025 konden we de digitale innovaties van Siemens visualiseren.
        _key: k_7c6c021cc1a855fcde60
      - kicker: Een blik in de toekomst
        title: Triple Z
        text: In juni 2026 mochten we in het startcentrum op Zeche Zollverein de start-upscene van Noordrijn-Westfalen enthousiast maken.
        _key: k_81843471e629d870eaa4
