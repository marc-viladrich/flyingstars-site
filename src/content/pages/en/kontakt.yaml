title: Contact
description: "Plan a show, request a quote, ask questions ✓ Reachable by email, phone and WhatsApp ☎︎ +49 209 88306562"
sections:
  - type: contactForm
    kicker: Contact
    headline: We look forward to *meeting you*
    text: Plan your show with us, ask your question (maybe our FAQ helps?) or reserve a date for 2027 and 2028. We'll reply within 48 hours at the latest.
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.
    _key: k_f0a092b80d21327d2779
  - type: contactDetails
    kicker: Call or write
    headline: Rather talk directly?
    text: "Behind every channel is the same team: Ronja, Florian and Erwin."
    visitNote: Please let us know in advance.
    todo: Teamfoto fehlt, bis dahin stehen hier die Porträts der Geschäftsführer:innen. FlyingStars muss den Terminbuchungs-Link und die Kontaktwege vor dem Relaunch bestätigen; Moritz muss die Kontakttexte und EN/NL prüfen.
