    headline: Goed om te weten
    lead:
      title: Compleet
      text: "Van ontwerp en vergunning tot vloot en veiligheid: bij ons krijgen jullie alles uit één hand, van een goed op elkaar ingespeeld team."
      image:
        src: https://flyingstars.art/wp-content/uploads/2025/05/drohnenprogrammierung-1.jpg
