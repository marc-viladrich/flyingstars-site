# Landingpage Marken und Werbung. Konzept WB-01 bis WB-09, Fakten: Fragebogen 21.10.2026.
# Agenturen: NDA, Projektleitung auf Wunsch, anonym fliegen möglich. Provision bewusst nicht auf der Website.
# Inhalte aus Elevate (30.10.); Presse nur mit den Sendern, die laut Moritz' Notizen konkret über FlyingStars berichtet haben.
# Runde 8 (31.10.2026, Marc: „deutlich mehr in dieses Interaktive … mehr Variation in den Layouts“): Hero mit Ford-Clip
# im Rahmen, nur Markenreferenzen, Wirkung als Kacheln, Freigabe als Strahl mit Schranke, Logo-Neugier im
# Konfigurator-Teaser, Agenturen mit Gesichtern, Orte auf einem Bild. Bausteine: src/components/landing/.
# Runde 9: Agentur-Abschluss als .promise, Pakete vor dem Teaser wie auf der Startseite, Orte ohne doppelte Einträge, Icons.
# Alle Texte sind Entwürfe für Moritz; neu formulierte Stellen tragen den Kommentar „Entwurf für Moritz“.
title: Drohnenshow als Werbung
navLabel: "Marken & Werbung"
description: "Drohnenshows für Marken und Agenturen: euer Logo am Nachthimmel, jedes Motiv vorab freigegeben. Für Launches, Jubiläen und Kampagnen."
image: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
sections:
  # Clip: Ford Explorer (Köln, 2024), registriert in src/lib/videos.ts. Poster bleibt das VW-Bild.
  - type: landingHero
    kicker: Marken & Werbung
    headline: Eure Marke am *Nachthimmel*.
    text: Wir setzen euer Logo und eure Botschaft aus Drohnen um, abgestimmt auf Musik und Kampagne. Jedes Motiv gebt ihr vor der Show frei.
    cta: { label: Markenshow anfragen, href: "#anfrage" }
    secondary: { label: Für Agenturen, href: "#agenturen" }
    video: ford
    videoLabel: Ford Explorer · Köln
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
      alt: Volkswagen-Logo aus Drohnen über dem Wolfgangsee, Gäste filmen von einer Terrasse
      width: 1920
      height: 1281
    # Entwurf für Moritz: Eckdaten (Startseite und Fragebogen)
    facts:
      - { value: "178", label: Shows seit 2022 }
      - { value: 48 h, label: bis zur Antwort }
      - { value: 1–2 Wochen, label: im Express }
    todo: Moritz muss die deutsche Endfassung und die maschinell übersetzten EN-/NL-Texte redaktionell prüfen.

  - type: logoBar
    id: marken
    headline: Marken, für die wir geflogen sind
    logos:
      - { name: Ford, file: /brand/logos/kunde-ford-weiss.svg }
      - { name: Volkswagen, file: /brand/logos/kunde-volkswagen-weiss.svg }
      - name: PUMA
        image: { src: https://flyingstars.art/wp-content/uploads/2023/04/Puma_Logo_weiss.png, alt: PUMA, width: 300, height: 161 }
      - { name: Prada, file: /brand/logos/kunde-prada-weiss.svg }
      - { name: L’Oréal, file: /brand/logos/kunde-loreal-weiss.svg }
      - { name: Spotify, file: /brand/logos/kunde-spotify-weiss.svg }
      - { name: Siemens, file: /brand/logos/kunde-siemens-weiss.svg }
      - { name: E.ON, file: /brand/logos/kunde-eon-weiss.svg }
      - { name: REWE, file: /brand/logos/kunde-rewe-weiss.svg }
      - { name: Bosch, file: /brand/logos/kunde-bosch-weiss.svg }
      - { name: Amazon, file: /brand/logos/kunde-amazon-weiss.svg }
      - { name: McKinsey, file: /brand/logos/kunde-mckinsey-weiss.svg }
      - { name: Bulgari, file: /brand/logos/kunde-bulgari-weiss.svg }
      - name: NFL
        image: { src: https://flyingstars.art/wp-content/uploads/2023/04/National_Football_League_2008_weiss.png, alt: NFL, width: 300, height: 409 }

  # Nur Markenshows (vorher: die ersten vier Referenzen, darunter das Musical Bokkenrijders). Ford steht schon im Hero.
  - type: landingRefs
    id: referenzen
    kicker: Referenzen
    headline: Große Marken, große Bühnen.
    projects:
      - nfl-berlin-game
      - puma-bundesliga
      - exploring-reinvented-der-neue-ford-explorer
      - loreal-prada-rheinturm
    cta: { label: Alle Referenzen, href: /referenzen/ }

  # Entwurf für Moritz: Wirkung als Kacheln, Inhalte wie bisher
  - type: landingBento
    id: wirkung
    kicker: Wirkung
    headline: Was eine Markenshow leisten kann.
    lead:
      label: Ford · Volkswagen · PUMA
      title: Ein Logo, das man *erkennt*.
      text: Wir übersetzen euer Logo in Lichtpunkte, Drohne für Drohne.
      image:
        src: https://flyingstars.art/wp-content/uploads/2024/12/FORD_comp.png
        alt: Ford-Schriftzug aus blauen Drohnen über dem Werksgelände in Köln
        width: 1929
        height: 1133
    items:
      - { icon: camera, title: Bilder für eure Kanäle, text: "Gäste filmen und teilen die Show. Rohaufnahmen mit unserer Kameradrohne kosten 900 €, bei ODYSSEY sind sie enthalten." }
      - { icon: newspaper, title: Ein Anlass für Berichte, text: "Über uns und unsere Shows haben unter anderem ZDF, WDR, ntv und die WAZ berichtet." }
    todo: FlyingStars muss die genannten ZDF-/WDR-Berichte konkret belegen; für Reichweiten- oder Wirkungsaussagen fehlen messbare Projektergebnisse.

  # Entwurf für Moritz: Freigabe als Strahl mit Schranke, Inhalte wie bisher
  - type: landingFlow
    id: freigabe
    kicker: Ablauf
    headline: Vom Logo bis zur fertigen Show.
    text: Nichts fliegt, was ihr nicht freigegeben habt.
    steps:
      - title: Anfrage und Angebot
        text: Ihr nennt uns Termin, Ort und Ziel. Wir antworten innerhalb von 48 Stunden und schicken nach einem kurzen Gespräch ein Angebot.
        duration: 48 h Antwort
      - title: Entwurf
        text: Ihr schickt uns euer Logo. Zuerst seht ihr einen 2D-Entwurf der Motive.
      - title: Animation
        text: Danach eine Rohanimation mit Musik. Ab HORIZON bekommt ihr eine Videovorschau der Show.
      - title: Freigabe
        text: Erst wenn ihr jedes Motiv freigegeben habt, programmieren wir Farben und Lichteffekte auf die Musik.
        gate: true
      - title: Showtag
        text: Unser Team ist etwa drei Stunden vorher vor Ort, sperrt die Startfläche und fliegt die Show.
        duration: ca. 3 h Aufbau

  - type: packages
    id: pakete
    kicker: Pakete
    headline: Wie aufwendig soll eure Show sein?
    text: Ein Logo in 2D reicht für viele Firmenfeiern. Für Launches mit 3D-Objekten und einer Geschichte eignen sich HORIZON oder ODYSSEY.
    compact: true
    items:
      - { name: SPARK, label: Klassisch in 2D }
      - { name: HORIZON, label: 3D in Bewegung, badge: Bestseller, highlight: true }
      - { name: ODYSSEY, label: Erzählte 3D-Show }
    note: Alle Preise netto zzgl. Anfahrt
    cta: { label: Alle Leistungen und Preise, href: "/drohnenshow-preise/" }
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.

  # Neugier aus dem Fragebogen („Wie sieht mein Unternehmen als Drohnenshow aus?“). Entwurf für Moritz.
  - type: landingTeaser
    id: logo
    kicker: Show-Konfigurator
    headline: Wie sieht euer *Logo* am Himmel aus?
    text: Im Konfigurator ladet ihr euer Logo hoch und seht es als Drohnenformation, mit Motiven von SPARK bis ODYSSEY.
    href: "/drohnenshow-preise/?anlass=launch#konfigurator"
    cta: Logo im Konfigurator ausprobieren
    loop: marke
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.

  # Icon-Kacheln (Marc, 01.11.2026): großes Icon und kleine Überschrift, „White Label“ statt „Im Hintergrund“.
  # Entwurf für Moritz: Agenturen mit Aussage-Kachel („Wir fliegen, ihr glänzt“ von der Startseite) und Gesichtern
  - type: landingBento
    id: agenturen
    kicker: Agenturen
    headline: Ihr bleibt das Gesicht, wir liefern die Show.
    lead:
      icon: sparkles
      title: Wir fliegen, *ihr glänzt*.
      text: Ihr bleibt bei euren Kund:innen vorn. Wie viel ihr selbst organisiert und wie viel wir übernehmen, entscheidet ihr.
    items:
      - { icon: hat-glasses, title: White Label, text: "Auf Wunsch fliegen wir anonym. Euer Name steht vorn, wir liefern die Show." }
      - { icon: file-lock, title: Vertraulich, text: Wir unterschreiben eine Vertraulichkeitsvereinbarung. }
      - { icon: thumbs-up, title: Freigabe, text: "Für die Abstimmung mit euren Kund:innen visualisieren wir die Motive mit deren Logo." }
      - { icon: clipboard-list, title: Projektleitung, text: "Auf Wunsch übernehmen wir die Projektleitung, mit Genehmigung, Behörden und Technik vor Ort." }
    closing:
      headline: Ein Projekt für eure Kund:innen?
      text: Erzählt uns davon. Wir melden uns innerhalb von 48 Stunden und stimmen alles Weitere vertraulich mit euch ab.
      button: { label: Als Agentur anfragen, href: "/kontakt/?anlass=agentur" }

  # Entwurf für Moritz: Orte als Markierungen auf dem Bild, Zeiten als Kennzahlen; Inhalte wie bisher
  - type: landingSpotlight
    id: orte
    kicker: Orte
    headline: Wir fliegen dort, wo euer Publikum ist.
    text: Dank unserer generischen Betriebsgenehmigung geben wir die meisten Flugorte selbst frei. Für Kontrollzonen, Flughafennähe und Bundeswasserstraßen holen wir die nötigen Sondergenehmigungen ein. Das braucht mehr Vorlauf.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
      alt: Drohnenformation über der Skyline von Düsseldorf mit Rheinturm
      width: 1920
      height: 985
    tags: [Borussia-Park · Mönchengladbach, Olympiastadion · Berlin, Rheinturm · Düsseldorf, Innenhafen · Duisburg]
    facts:
      - { value: 4–8 Wochen, label: Bestätigung je EU-Land, vorab }
      - { value: ca. 3 Monate, label: in Italien }
    todo: FlyingStars muss aktuelle Cross-border-Fristen und mögliche Sondergebühren je Land bestätigen. Die Ortsbeispiele belegen keine pauschale Genehmigung oder garantierte Frist.

  # Entwurf für Moritz (Marc, 03.11.2026: „was übernehmen wir, was übernehmt ihr“ ist für Marken genauso relevant).
  # Zonen und Maße wie auf der Hochzeitsseite, Quellen: docs/sicherheitskonzept-quellen.md. Aufgaben nach dem Ablauf oben
  # (Logo schicken, jedes Motiv freigeben) und dem Technik-Datenblatt.
  - type: landingSite
    id: standort
    kicker: Standort
    headline: Passt euer Standort?
    text: Schickt uns die Adresse und die geplante Position eures Publikums. Vor dem Angebot prüfen wir, ob und wie die Show dort möglich ist.
    variant: outdoor
    diagram:
      description: "Draufsicht mit äußerem und innerem Sicherheitsbereich, Flugbereich, Start- und Landebereich sowie Publikum außerhalb. Die Drohnenlinie liegt quer zur Blickrichtung."
      horizontalLabel: ca. 100 m
      verticalLabel: ca. 100 m
      detailLabel: ca. 60 m
      flightLabel: In der Regel bis 120 m Flughöhe
      caption: "Beispiel nach dem Technik-Datenblatt, nicht maßstäblich. Alle Zonen und Abstände berechnen wir für euren Standort. Die 60 m beziehen sich auf die Drohnenlinie in diesem Beispiel."
    items:
      - title: Äußerer Sicherheitsbereich
        value: ca. 100 × 100 m
        text: "Er umfasst auch die inneren Bereiche. Während der Show bleibt er frei von Unbeteiligten, für etwa 15 Minuten. Die Größe hängt von Drohnenzahl, Motiven und Flughöhe ab."
        zone: safety
      - title: Innerer Sicherheitsbereich
        text: "Der operative Sicherheitsbereich umgibt den Flugbereich. Seine Grenzen legen wir mit der Flugplanung fest."
        zone: operative
      - title: Flugbereich
        value: bis 120 m hoch
        text: "Hier fliegen die Drohnen die Motive. Von oben bilden sie eine Linie quer zur Blickrichtung, damit euer Publikum die Motive frontal sieht."
        zone: drones
      - title: Start- und Landebereich
        value: ca. 3 h vor der Show gesperrt
        text: "Ab unserer Ankunft bauen wir auf einer freien, ebenen Fläche das Drohnenraster, Antennenstative und die Kontrollstation auf. Die benötigte Fläche hängt von der Drohnenzahl ab."
        zone: start
      - title: Publikumsbereich
        text: "Euer Publikum steht außerhalb des äußeren Sicherheitsbereichs und braucht freie Sicht auf die Show. Die Position planen wir mit euch, mit Abstand zu Hauswänden und Bäumen."
        zone: guests
    responsibilities:
      - { task: "Logo schicken und jedes Motiv freigeben", us: none, you: full }
      - { task: "Motive entwerfen und animieren", us: full, you: none }
      - { task: "Standort prüfen, Sicherheitskonzept und Flugplanung", us: full, you: none }
      - { task: "Luftrechtliche Genehmigungen (LBA, DFS, Wasserstraßen, EU-Länder)", us: full, you: none }
      - { task: "Zustimmung der Grundstückseigentümer:innen einholen", us: part, you: full, hint: "Vorlage von uns" }
      - { task: "Flächen für Start, Sicherheitsbereich und Publikum bereitstellen", us: none, you: full }
      - { task: "Sicherheitsbereich absichern (Flatterband, ggf. Ordner:innen)", us: part, you: full, hint: "nach Absprache" }
      - { task: "Pilot:innen, Technik, Auf- und Abbau", us: full, you: none }
      - { task: "Musikschnitt passend zur Show", us: full, you: none }
      - { task: "Beschallung vor Ort organisieren", us: part, you: full, hint: "Box für kleine Gruppen" }
      - { task: "Ansprechperson für den Showtag benennen", us: none, you: full }
      - { task: "Haftpflicht bis 1,3 Mio. €", us: full, you: none }
    download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Moritz muss die Aufgabenliste für Markenshows freigeben.

  - type: faq
    id: fragen
    kicker: FAQ
    headline: Fragen von Marken und Agenturen.
    cta: { label: Alle Fragen, href: /faq/ }
    tags: [werbung]

  - type: contactForm
    kicker: Anfrage
    headline: Erzählt uns von eurer Kampagne.
    text: Termin, Ort und Ziel reichen. Euer Logo könnt ihr uns später per E-Mail schicken.
