  - type: textMedia
    id: marketing
    kicker: Werbung und Marketing mit Drohnen
    headline: Euer Unternehmen auf der größten Bühne der Welt
    body: |-
      Das neue Produkt, von dessen Launch jede:r etwas mitbekommen soll. Das Werbevideo mit Wow-Effekt. Die Brand-Kampagne, die euer Logo wieder in den Köpfen einbrennt.

      Gemeinsam bauen wir eine individuelle Choreografie, die die Geschichte eurer Marke erzählt. Mehr als nur euer Logo, ein Claim oder euer Firmenname – sondern emotionales Storytelling, das verzaubert.

      Unsere Drohnenshows eine Alternative zum Feuerwerk, die noch kaum jemand kennt. Aufmerksamkeit garantiert, selbst aus Kilometern Entfernung.
    cta: { label: Show anfragen, href: "#anfrage" }
    todo: "Moritz: im letzten Absatz fehlt ein Verb („Unsere Drohnenshows [sind] eine Alternative …“), bewusst wortgetreu übernommen."
    _key: k_7abf894f6f4dfb7d5b8c

  - type: textMedia
    id: komplettpaket
    kicker: Komplettpaket
    headline: Alles drin für euer Marketing
    body: |-
      Von der Idee bis zum Applaus begleiten wir euch in der gesamten Planung und Durchführung.

      - Technik: Wir stellen Hardware, Software und Lichtdrohnen.
      - Musik: Lasst die Drohnen zu eurer Playlist tanzen.
      - Werbematerial: Auf Wunsch kreieren wir Fotos und Filmaufnahmen.
      - Genehmigungen: Wir übernehmen die komplette Bürokratie.
      - Sicherheit: LBA- und EASA-zertifiziert, Haftpflicht bis 1,3 Mio. Euro.
      - Schnelligkeit: Planung in unter zwei Wochen möglich.
      - International: In Deutschland, Europa und weltweit
    cta: { label: Show anfragen, href: "#anfrage" }
    _key: k_5fce2f823d9e547c9f3a

