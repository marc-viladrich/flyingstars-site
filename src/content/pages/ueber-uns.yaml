# Über uns (30.10.2026). Reihenfolge nach Marc: zuerst die persönliche Vorstellung mit frühem CTA, danach die
# Meilensteine als ruhige Timeline. Inhalte aus Elevate, Fakten aus Fragebogen (21.10.) und Moritz' Notizen (30.10.).
# Thomas (freier Designer) wird laut Notizen nicht genannt; Bürohund Chopper darf vorkommen.
# Offen: VW Golf 350 (Fragebogen) oder 400 Drohnen (Notizen), deshalb ohne Zahl; E.ON 15.09. oder 15./16.09., deshalb „im September“.
title: Über uns
description: "FlyingStars aus dem Ruhrgebiet: Team, Geschichte und Meilensteine. 178 Shows seit 2022, eigenes Design-Team, eigene Flotte, Büro auf Zollverein."
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: hero
    kicker: Über uns
    headline: Ein Team aus dem Ruhrgebiet, das den *Nachthimmel* bespielt.
    text: Ronja, Florian und Erwin führen FlyingStars gemeinsam, mit einem kleinen Team aus dem Ruhrgebiet. Unser Büro ist im Triple Z auf Zeche Zollverein in Essen. Dort könnt ihr uns auch besuchen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: Weltkugel aus Drohnen über dem Rhein bei der Extraschicht in Duisburg
      width: 2544
      height: 1493
    cta: { label: Show anfragen, href: /kontakt/ }
    secondary: { label: Unsere Meilensteine, href: "#meilensteine" }
    todo: FlyingStars muss ein freigegebenes Team- oder Arbeitsfoto für den persönlichen Einstieg liefern; derzeit steht hier ein Showbild. Moritz muss die deutsche Endfassung und die maschinell übersetzten EN-/NL-Texte redaktionell prüfen.

  - type: team
    id: team
    kicker: Team
    headline: Die Menschen hinter den Shows.
    text: Ihr erreicht uns als Team, und am Showabend stehen wir selbst mit auf dem Feld.
    members:
      - name: Ronja Donsbach
        role: Geschäftsführerin
        bio: Beantwortet die meisten Anfragen und stimmt Design und Musik mit Partner:innen ab. Auch auf Englisch.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Ronja_Teamfoto.jpg", alt: Ronja Donsbach mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Florian Becker
        role: Geschäftsführer
        bio: Verwaltung, Personal und Kund:innen in Deutschland. Schreibt unseren Blog.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Florian_Teamfoto.jpg", alt: Florian Becker mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Erwin Wilms
        role: Geschäftsführer
        bio: Anträge, Behörden und Luftfahrtrecht. Sorgt dafür, dass eure Show fliegen darf. Auch auf Englisch.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Erwin_Teamfoto.jpg", alt: Erwin Wilms mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Patrick
        role: Head of Technik
        bio: Flotte, Verfügbarkeit, Einkauf und das technische Setup jeder Show.
      - name: Alejandro
        role: Head of Design
        bio: Entwirft unsere Shows und ihre Choreografien.
      - name: Chopper
        role: Bürohund
        bio: Neu im Team.
    note: Dazu kommen rund zehn Aushilfen, die mit uns aufbauen, absichern und wieder abbauen.
    cta: { label: Lernt uns kennen, href: /kontakt/ }
    todo: FlyingStars muss hochauflösende Porträts von Ronja, Florian und Erwin sowie Fotos von Patrick und Alejandro liefern; die vorhandenen Porträts messen nur 199 × 199 Pixel. Zusätzlich fehlen Choppers Foto und eine abgestimmte Kurzvorstellung.

  - type: textMedia
    kicker: Geschichte
    headline: Wie FlyingStars angefangen hat.
    body: |
      FlyingStars begann als Corona-Projekt. In Asien gab es damals schon viele große Drohnenshows, in Europa noch nicht. Wir wollten wissen, warum, und haben angefangen zu tüfteln. Am 1. Dezember 2021 haben wir das Gewerbe angemeldet.

      Unsere erste Show flogen wir am 13. August 2022, zu einem privaten Geburtstag mit 50 Drohnen. Im selben Jahr kamen sieben weitere dazu.

      Unser Firmensitz und unsere Postadresse sind in Gelsenkirchen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: Kreis aus bunten Drohnen über Berlin, Zuschauer:innen filmen die Show mit dem Handy
      width: 1920
      height: 987
    mediaSide: right
    todo: FlyingStars muss ein passendes Gründungs- oder Arbeitsfoto liefern; das aktuelle Bild zeigt die spätere Böllerciao-Show, nicht die Gründung.

  - type: timeline
    id: meilensteine
    kicker: Meilensteine
    # Vertikaler Zeitstrahl mit derselben Animation wie der Ablauf auf der Startseite (Runde 8, 31.10.2026)
    headline: Von 50 auf *600* Drohnen.
    text: Vom ersten Geburtstag 2022 bis zum Musical in Maastricht.
    items:
      - { when: "2021", title: Gründung, text: Am 1. Dezember melden wir FlyingStars als Gewerbe an. }
      - { when: "2022", title: Die erste Show, text: Am 13. August fliegen 50 Drohnen zu einem privaten Geburtstag. }
      - { when: "2022", title: PUMA im Borussia-Park, text: "Am 11. November, unsere sechste Show. 100 Drohnen vor dem Derby Gladbach gegen Dortmund, die Anfrage kam etwa 14 Tage vorher." }
      - { when: "2023", title: Die erste generische Betriebsgenehmigung in Deutschland, text: Im Juli erteilt uns das Luftfahrt-Bundesamt die Genehmigung. }
      - { when: "2023", title: L’Oréal × Prada Paradoxe, text: Am 11. Oktober 350 Drohnen am Rheinturm in Düsseldorf. }
      - { when: "2023", title: "#Böllerciao mit der Deutschen Umwelthilfe", text: "Am 27. November 150 Drohnen im Berliner Cantianstadion, vor Presse, Politik und Öffentlichkeit." }
      - { when: "2023", title: Einzug ins Triple Z, text: Im Dezember beziehen wir unser Büro im Gründungszentrum auf Zeche Zollverein. }
      - { when: "2024", title: 50 Jahre VW Golf, text: Am 22. Mai an der Scalaria am Wolfgangsee. Lange unsere größte Show. }
      - { when: "2025", title: Die erste Indoor-Show, text: Am 28. März für Siemens auf der Hannover Messe. }
      - { when: "2025", title: Kein Bock auf Nazis, text: "Am 8. August. Seitdem fliegen wir regelmäßig Shows für Demokratie, Vielfalt und Zusammenhalt." }
      - { when: "2026", title: Bokkenrijders in Maastricht, text: Im Juni 20 Shows mit je 600 Drohnen in einem Musical. }
      - { when: "2026", title: E.ON in Hamburg, text: Im September eine Doppelshow mit 500 Drohnen über der Elbe an den Landungsbrücken. }
      - { when: "2026", title: Indoor im Triple Z, text: "Im September eine Indoor-Show im Gründungszentrum, in dem auch unser Büro ist." }
    todo: FlyingStars muss den historischen LBA-Erstanspruch belegen und VW Golf mit 350/400 Drohnen sowie das E.ON-Datum 15./16.09. klären. Für E.ON und „Kein Bock auf Nazis“ fehlen zugeordnete Showbilder.

  # USP-Entwurf für Moritz. Quellen, Auswahl und Faktenabgleich: docs/ueber-uns-usps.md.
  # Ersetzt die bisherige Sammelliste durch Zusammenarbeit/Produktion.
  - type: landingBento
    id: zusammenarbeit
    kicker: Aus einer Hand
    headline: Eure Idee wird zur *Choreografie*.
    lead:
      icon: users
      title: Mit euch entwickelt.
      text: Wir entwickeln mit euch Storyline, Motive und Musik für euren Anlass.
    items:
      - icon: pencil-ruler
        title: Eigenes Design-Team
        text: Alejandro entwirft die Motive und Choreografien. Eure Ideen, euer Logo oder euer Stadtwappen werden zu Drohnenformationen.
      - icon: thumbs-up
        title: Motive vorab freigeben
        text: Ihr seht die Entwürfe vor der Show und gebt jedes Motiv frei.
      - icon: music
        title: Musik und Licht abstimmen
        text: Wir schneiden die Musik zur Animation. Danach programmieren wir Farben und Lichteffekte auf die musikalischen Akzente. Der Musikschnitt ist in jedem Paket enthalten.
      - icon: drone
        title: Eigene Flotte
        text: Wir fliegen mit unseren eigenen Drohnen. Patrick plant ihren Einsatz und kümmert sich um die Technik für eure Show.
    todo: Moritz muss den USP-Entwurf zur Zusammenarbeit redaktionell freigeben; die sachliche Grundlage ist in docs/ueber-uns-usps.md dokumentiert.

  # Genehmigungen (Codex-Entwurf 02.11.) stehen nicht als eigene Section hier: Das Sicherheitskonzept direkt darunter nennt
  # LBA-Genehmigung, DFS, Cross-border und Grundstückszustimmung ausführlicher („Das übernehmen wir / Das braucht ihr“).

  # Textentwurf für Moritz. Quellen und Konflikte: docs/sicherheitskonzept-quellen.md.
  - type: landingSite
    id: sicherheit
    kicker: Sicherheit
    headline: Sicherheit, um die ihr euch nicht kümmern müsst.
    text: Sicherheitszonen, Flugplanung und Zuständigkeiten stimmen wir für jeden Standort ab.
    variant: outdoor
    diagram:
      description: "Draufsicht mit äußerem und innerem Sicherheitsbereich, Flugbereich, Start- und Landebereich sowie Publikum außerhalb. Die Drohnenlinie liegt quer zur Blickrichtung."
      horizontalLabel: ca. 100 m
      verticalLabel: ca. 100 m
      detailLabel: ca. 60 m
      flightLabel: In der Regel bis 120 m Flughöhe
      caption: "Beispiel nach dem Technik-Datenblatt, nicht maßstäblich. Alle Zonen und Abstände berechnen wir für euren Standort. Die 60 m beziehen sich auf die Drohnenlinie in diesem Beispiel."
    items:
      - title: Äußerer Sicherheitsbereich
        value: ca. 100 × 100 m
        text: "Er umfasst auch die inneren Bereiche. Während der Show bleibt er frei von Unbeteiligten, für etwa 15 Minuten. Die Größe hängt von Drohnenzahl, Motiven und Flughöhe ab."
        zone: safety
      - title: Innerer Sicherheitsbereich
        text: "Der operative Sicherheitsbereich umgibt den Flugbereich. Seine Grenzen legen wir mit der Flugplanung fest."
        zone: operative
      - title: Flugbereich
        value: bis 120 m hoch
        text: "Hier fliegen die Drohnen die Motive. Von oben bilden sie eine Linie quer zur Blickrichtung, damit eure Gäste die Motive frontal sehen."
        zone: drones
      - title: Start- und Landebereich
        value: ca. 3 h vor der Show gesperrt
        text: "Ab unserer Ankunft bauen wir auf einer freien, ebenen Fläche das Drohnenraster, Antennenstative und die Kontrollstation auf. Die benötigte Fläche hängt von der Drohnenzahl ab."
        zone: start
      - title: Publikumsbereich
        text: "Eure Gäste stehen außerhalb des äußeren Sicherheitsbereichs und brauchen freie Sicht auf die Show. Ihre Position planen wir mit euch, mit Abstand zu Hauswänden und Bäumen."
        zone: guests
    safeguards:
      - icon: scan-line
        title: Digital begrenzter Flugbereich
        text: "Ein Geofence begrenzt den Showbereich. Verlässt eine Drohne diesen Bereich, startet automatisch ein Sicherheitsprotokoll."
      - icon: shield-check
        title: Mehrfach abgesichert
        text: "Automatische und manuelle Sicherheitssysteme überwachen jeden Flug. Bei einem Ausfall kehrt die Drohne meist zurück oder landet im Sicherheitsbereich. Die Outdoor-Drohnen wiegen rund 300 g und haben keine Kameras."
      - icon: users-round
        title: Team vor Ort
        text: "Drei bis vier Personen, Pilot:innen und Techniker:innen, bauen die Technik auf und überwachen die Show."
      - icon: wind
        title: Wetter im Blick
        text: "Wir fliegen formstabil bis Windstärke 5 und bei leichtem Nieselregen. Die Wetterlage stimmen wir idealerweise ein bis zwei Tage vorher mit euch ab."
    responsibilities:
      - { task: "Standort prüfen, Sicherheitskonzept und Flugplanung", us: full, you: none }
      - { task: "Luftrechtliche Genehmigungen (LBA, DFS, Wasserstraßen, EU-Länder)", us: full, you: none }
      - { task: "Zustimmung der Grundstückseigentümer:innen einholen", us: part, you: full, hint: "Vorlage von uns" }
      - { task: "Flächen für Start, Sicherheitsbereich und Publikum bereitstellen", us: none, you: full }
      - { task: "Sicherheitsbereich absichern (Flatterband, ggf. Ordner:innen)", us: part, you: full, hint: "nach Absprache" }
      - { task: "Pilot:innen, Technik, Auf- und Abbau", us: full, you: none }
      - { task: "Musikschnitt passend zur Show", us: full, you: none }
      - { task: "Beschallung vor Ort organisieren", us: part, you: full, hint: "Box für kleine Gruppen" }
      - { task: "Ansprechperson für den Showtag benennen", us: none, you: full }
      - { task: "Haftpflicht bis 1,3 Mio. €", us: full, you: none }
    download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel; Betriebsgenehmigung und aktuelle Versicherungsbestätigung fehlen im Quellenpaket.

  # Nachhaltigkeit (Marc, 31.10.2026, Runde 8): dieselbe Scrollstory wie auf der Startseite, mit denselben Fakten, statt
  # einer schwächeren Kopie. docs/DESIGN.md sieht genau eine Scrollstory auf Über uns vor. Der Unterschied zur Startseite
  # liegt im Satz unter der Headline (Gründungsmotiv) und im Hersteller als Beleg für „Gebaut in der EU“.
  # Nur Aussagen über die Show vor Ort (EmpCo).
  - type: sustainability
    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Kein Knall. Kein Rauch. Kein Müll.
    text: Nachhaltigkeit ist der Grund, aus dem wir FlyingStars gegründet haben. Wir denken sie bei jeder Entscheidung mit.
    facts:
      - { label: Kein Knall, value: leise, text: "Die Drohnen summen, laut ist nur eure Musik. Den Schallschutz hat der TÜV Nord in einem Gutachten untersucht." }
      - { label: Kein Rauch, value: "0", unit: g, text: "Keine Pyrotechnik, also kein Rauch und keine Schwermetalle über dem Publikum." }
      - { label: Kein Müll, value: "0", unit: kg, text: "Keine Hülsen, keine Reste. Dieselben Drohnen fliegen Show für Show." }
      - { label: Ökostrom, value: { fact: renewablePercent }, unit: "%", text: Ökostrom von naturstrom für unsere Akkus. }
    # Icon-Raster wie auf der Startseite (pillars), hier mit dem Hersteller als Beleg
    pillars:
      - { icon: eu, title: Gebaut in der EU, text: "Unsere Drohnen wiegen rund 300 Gramm und werden bei Drotek SAS in Frankreich gebaut." }
      - { icon: repair, title: Reparieren statt ersetzen, text: "Akkus, Motoren und Rotoren tauschen wir einzeln, die Drohne fliegt weiter." }
      - { icon: ev, title: Elektrisch zur Show, text: Zu den Shows fahren wir mit einem elektrischen Ford E-Transit. }
      - { icon: campaign, title: "#Böllerciao", text: "Mit der Deutschen Umwelthilfe im November 2023 über Berlin, als Alternative zum Silvesterfeuerwerk." }
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom, Herstellung und das TÜV-Nord-Schallschutzgutachten bereithalten.

  - type: metrics
