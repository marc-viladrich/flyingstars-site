  - type: packages
    id: pakete
    compact: true
    headline: Drei Pakete mit festen Einstiegspreisen.
    text: Der Preis hängt davon ab, wie aufwendig die Bilder am Himmel sind und wie
      viele Drohnen fliegen. Alle Preise netto zzgl. Anfahrt.
    cta:
      label: Unterschiede in der Vorschau ansehen
      href: /drohnenshow-preise/#vorschau
  - type: steps
    id: ablauf
    headline: Von der Anfrage bis zum Showabend.
    steps:
      - title: Anfrage
        text: Ihr schickt uns Datum, Ort und Anlass. Wir antworten innerhalb von 48
          Stunden.
      - title: Standortprüfung und Angebot
        text: Wir prüfen, ob am Ort ein Showbereich von ca. 100 × 100 Metern möglich
          ist, und schicken euch ein Angebot.
      - title: Genehmigung
        text: Wir beantragen die Fluggenehmigung beim Luftfahrt-Bundesamt. Von euch
          brauchen wir nur die Zustimmung der Grundstückseigentümer*innen.
      - title: Motive mit Freigabe
        text: Erst seht ihr eine Rohanimation, dann kommt die Musik dazu, zuletzt
          Farben und Licht. Jeden Schritt gebt ihr frei.
      - title: Showtag
        text: Ab ca. drei Stunden vor der Show ist die Startfläche gesperrt. Unser Team
          aus Pilot*innen und Techniker*innen ist vor Ort.
  - type: projectGrid
    id: referenzen
    headline: Shows, die wir schon geflogen sind.
    text: Produktlaunches, Stadtfeste und Hochzeiten. Zu jeder Show gibt es Video,
      Ort und Drohnenzahl.
    limit: 4
    cta:
      label: Alle Referenzen
      href: /projekte/
  - type: metrics
    id: sicherheit
    headline: Genehmigung und Sicherheit übernehmen wir.
    text: Wir beantragen die Fluggenehmigung selbst und planen jeden Showbereich mit
      Sicherheitsabstand. Von euch brauchen wir nur die Zustimmung der
      Grundstückseigentümer*innen.
    items:
      - label: Betriebsgenehmigung
        text: Unsere Betriebsgenehmigung des Luftfahrt-Bundesamts gilt in der ganzen
          EU. Für andere EU-Länder beantragen wir zusätzlich eine
          Cross-border-Bestätigung.
      - label: Sicherheitsbereich
        text: Rund 100 × 100 Meter, in denen sich während der Show niemand aufhält.
      - label: Technik
        text: Geofence und mehrfach abgesicherte Systeme. Die Drohnen wiegen rund 300 g
          und tragen keine Kameras.
      - label: Haftpflicht
        text: Versichert bis 1,3 Mio. €, in jedem Paket enthalten.
    cta:
      label: Mehr über uns
      href: /ueber-uns/
  - type: sustainability
    id: nachhaltigkeit
    headline: Leise und ohne Rückstände.
    text: Eine Drohnenshow macht keinen Knall, keinen Feinstaub und keinen Müll.
    points:
      - Unsere Drohnen laden mit 100 % Ökostrom von naturstrom.
      - Die Drohnen kommen aus EU-Fertigung. Akkus und Teile tauschen wir einzeln.
      - Zu den Shows fahren wir mit E-Transportern.
    campaign: "Für die Kampagne #Böllerciao der Deutschen Umwelthilfe sind wir im
      November 2023 mit 150 Drohnen über dem Cantianstadion in Berlin geflogen."
    proofImage:
      src: https://flyingstars.art/wp-content/uploads/2024/10/NATURSTROM-Logo_weiss.png
      alt: naturstrom
      width: 300
      height: 71
  - type: comparison
    id: vergleich
    headline: Drohne, Feuerwerk oder Laser?
    text: Jede Technik hat ihre Stärken. So unterscheiden sich die drei bei den
      Fragen, die am häufigsten kommen.
    rowHeader: Kriterium
    columns:
      - Drohnenshow
      - Feuerwerk
      - Lasershow
    rows:
      - label: Logos und Schriftzüge am Himmel
        values:
          - Ja, auch in 3D
          - Nein
          - Teilweise, nur auf Flächen oder Dunst
      - label: Lautstärke
        values:
          - Leise, Musik nach Wahl
          - Sehr laut
          - Leise
      - label: Rauch, Feinstaub, Müll
        values:
          - Keine
          - Viel
          - Dunst für sichtbare Strahlen nötig
      - label: Brandgefahr
        values:
          - Keine
          - Ja, Verbote bei Trockenheit
          - Keine
      - label: Wind und Wetter
        values:
          - Bis Windstärke 5, kein Starkregen
          - Bei Sturm abgesagt
          - Robust, auch drinnen
      - label: Sichtbar aus der Ferne
        values:
          - Kilometerweit
          - Kilometerweit
          - Begrenzt, wirkt am besten aus der Nähe
  - type: faq
    id: faq
    headline: Was ihr vor der Anfrage wissen solltet.
    cta:
      label: Alle Fragen
      href: /faq/
    openFirst: true
    limit: 4
    tags:
      - startseite
  - type: contactForm
    headline: Erzählt uns von eurem Termin.
    text: Datum, Ort und Anlass reichen für eine erste Einschätzung. Was ihr noch
      nicht wisst, lasst ihr offen.
