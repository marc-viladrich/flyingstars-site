title: FlyingStars in the press (ZDF, WDR, ntv and more)
navLabel: Press
description: "You might know us from here: we often talk about sustainability & innovation in drone shows ☎︎ {{contact.phone.international}}"
sections:
  - type: press
    id: presse
    kicker: FlyingStars in the press
    headline: Maybe you know us *already*?
    text: As a young start-up from North Rhine-Westphalia, we're often the media's point of contact. It's usually about our drone shows, their sustainability compared with fireworks, or technical innovation. You may well have seen us before …
    cta: { label: Get in touch, href: "#anfrage" }
    items:
      - { id: heise, name: heise online, logo: /brand/logos/presse-heise.svg, cleared: true, title: Technical innovation, date: "2026-01", text: "In January 2026 we welcomed heise online to talk about the current state and future development of drone technology.", "_key": "k_7afe9802c73cf1eaac21", "knock": false, "featured": false }
      - { id: ndr, name: NDR, logo: /brand/logos/presse-ndr.svg, cleared: true, title: "#BÖLLERCIAO", date: "2025-12-17", text: "On 17 December 2025, Hallo Niedersachsen reported on our drone show for Deutsche Umwelthilfe in Lüneburg.", "_key": "k_6b732df4e174a565ed1f", "knock": false, "featured": false }
      - { id: waz, name: WAZ, logo: /brand/logos/presse-waz.svg, cleared: true, title: Ruhrort harbour festival, date: "2025-08-13", text: "We're bringing a drone spectacle to Duisburg. On 13 August 2025 the WAZ presented the concept and interviewed our co-founder Erwin.", href: "https://www.waz.de/lokales/duisburg/article409722481/ruhrorter-hafenfest-die-geheimnisse-hinter-dem-neuen-highlight.html", linkLabel: Read the article, "_key": "k_9fca4e32123469ec0311", "knock": false, "featured": false }
      - { id: ntv, name: ntv, logo: /brand/logos/presse-ntv.svg, cleared: true, knock: true, featured: true, title: FlyingStars as a start-up, date: "2025-06-21", text: "In the ntv Startup Magazin we introduced our team and our mission. It was broadcast on 21 June 2025.", href: "https://www.n-tv.de/mediathek/magazine/startup_news/Drohnen-verwandeln-Nachthimmel-in-Showbuehne-article25835436.html", linkLabel: Watch the feature, "_key": "k_3f9037c3b9c946fc7bdb" }
      - { id: tagesspiegel, name: Tagesspiegel, logo: /brand/logos/presse-tagesspiegel.svg, cleared: true, title: An alternative to fireworks, date: "2023-11-27", text: "Back on 27 November 2023, the Tagesspiegel reported on our drone show for Deutsche Umwelthilfe's #BÖLLERCIAO campaign.", href: "https://www.tagesspiegel.de/berlin/drohnen-statt-boller-deutsche-umwelthilfe-zeigt-alternative-zum-berliner-silvester-feuerwerk-10846906.html", linkLabel: Read the article, "_key": "k_248dbccc35d6581abd74", "knock": false, "featured": false }
      - { id: zdf, name: ZDF, logo: /brand/logos/presse-zdf.svg, cleared: true, knock: true, title: Spectacular swarms, date: "2023-05-21", text: "On the KiKA quiz show “1, 2 oder 3” we got children excited about drone shows. The episode aired on 21 May 2023. Unfortunately it's currently not available online.", "_key": "k_1724569aec737d2bba0d", "featured": false }
    _key: k_3203e6063dedf526e6f1
