title: Leistungen – FlyingStars
description: Drei Pakete, feste Preise und ein Team für Design, Genehmigung und
  Flug. Erfahre, wie FlyingStars deine Drohnenshow von der Idee bis zur Landung
  umsetzt.
sections:
  - type: hero
    headline: Drohnenshows aus einer Hand
    text: Von der ersten Skizze über die Genehmigung bis zur Landung. Entdecke
      unsere Pakete, unseren Ablauf und die Menschen hinter der Show.
    cta: { label: Show anfragen, href: /kontakt/ }
    secondary: { label: Preisrechner öffnen, href: /drohnenshow-preise/ }
