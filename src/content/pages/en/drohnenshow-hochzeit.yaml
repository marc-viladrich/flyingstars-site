  - type: textMedia
    id: choreografie
    kicker: Bespoke choreography
    headline: As unique as your love story
    body: "A swarm of shining light-show drones draws your initials, vows of love and in-jokes across the sky. Set to music and tailored to your wishes."
    mediaSide: right
    _key: k_52056666f5076b5e0423
  - type: textMedia
    id: familienfreundlich
    kicker: Family-friendly
    headline: Children and dogs welcome
    body: "Unlike fireworks, a drone ballet has no loud bang, no bothersome smoke and no fire-risk debris. Just a soft hum – and your guests' amazement."
    mediaSide: right
    _key: k_59a09168d2946ce16e34
  - type: steps
    id: vorteile
    kicker: Advantages
    headline: Our promises
    steps:
      - title: All-inclusive
        text: "Design, music, show, permits: we take everything off your hands, all from a single source."
        _key: k_856e2a0f8b72501f0a1b
      - title: International
        text: "Wherever you celebrate, we'll be there: in Germany, Austria, Switzerland or anywhere in the world."
        _key: k_f070569c03c9b4b11034
      - title: Safe
        text: We are LBA and EASA certified and provide a 100 x 100 metre safety zone.
        _key: k_85e68777aa937b3e85b1
    ownNumbers: true
    _key: k_9d2cf9c04b90b456039c
  - type: landingRefs
    id: referenzen
    kicker: References
    headline: Nights we will never forget
    projects:
      - heiratsantrag-hugenpoet
      - hochzeit-recklinghausen
    cards:
      - ref: heiratsantrag-hugenpoet
        title: Proposal in Essen
        kicker: She said yes!
        text: "With 220 drones, we helped our client Armin win over his Berina. Accompanied by a violinist, we wrapped the sky above Schloss Hugenpoet in delicate white."
        _key: k_1cd45074068daabdd5a2
      - ref: hochzeit-recklinghausen
        title: Wedding in Recklinghausen
        kicker: A surprise for the bride and groom
        text: "Veronika and Felix were amazed when their love story suddenly lit up above them. At the family's request, we prepared the choreography in secret."
        _key: k_0df1ee61f7ea5938057b
    _key: k_6500b76af74b7dd741ca
  - type: landingTeaser
    id: preise
    kicker: Costs
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    headline: Put your show together
    text: "Our drone shows start at €7,900 (net) plus travel. You can tailor your package with more drones, customisation and extras such as photos or videos of the performance."
    href: /drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator
    cta: View packages
    loop: hochzeit
    _key: k_3f8f37b2eb211e01710f
  - type: steps
    id: ablauf
    kicker: Process
    headline: "We plan, you sit back"
    steps:
      - title: "#1 Enquiry"
        text: When and where are you getting married? We get back to you within 48 hours to get to know you and make you a firm offer. A visit to your venue is rarely needed.
        _key: k_6b92c66eeb04fdf588fc
      - title: "#2 Preparation"
        text: "You tell us your love story. We turn it into a choreography. And because planning a wedding is stressful enough, we also take care of permits and the like."
        _key: k_54439060443f507bff93
      - title: "#3 Wedding"
        text: "We start preparing three and a half hours before the drone dance. The show itself lasts up to 25 minutes. You get to watch and marvel – we organise set-up, dismantling and safety."
        _key: k_77816c393a12e22dfcb5
    ownNumbers: true
    _key: k_bd1dd6072c1145a15939
  - type: team
    id: ueber
    kicker: About FlyingStars
    todo: FlyingStars muss ein Teamfoto liefern.
    cta:
      label: About us
      href: /ueber-uns/
    headline: It is an honour to be your guests
    text: "We usually fly for cities, festivals and global corporations such as L’Oréal, Prada or Spotify. But the couples whose weddings we have helped make unforgettable hold a special place in our photo album. That is why we are one of the few operators who also fly for private celebrations. At your party, a small crew works behind the scenes to make sure everything runs smoothly."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    _key: k_3ed49f154258b655d578
  - type: contactForm
    kicker: Book a wedding drone show
    headline: Let's plan your choreography
    text: "Reserve your wedding date in good time, ask us your questions or tell us about your show idea. We reply within 48 hours."
    _key: k_f7f1d08aab8e84a827cd
