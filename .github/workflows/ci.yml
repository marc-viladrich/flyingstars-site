name: CI
# Volle Qualitäts-Gates für Code-Änderungen per PR (Branch-Schutz verlangt `gates`) und auf Abruf
# (Actions → CI → Run workflow). Inhalte aus dem Editor gehen ohne diesen Lauf online (deploy-cloudflare.yml).
# Alles hier ist host-unabhängig.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    # Gemeinsame Unit-/Build-Gates; Browser und Audits prüfen danach denselben Output.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        # Editor-Tests lesen ältere Stände (Migrationen, Revisionsnachweise) aus der Git-Geschichte.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm, registry-url: 'https://npm.pkg.github.com', scope: '@marc-viladrich' }
      - run: npm ci
        # Private editor package (GitHub Packages): classic token with read:packages only.
        env: { NODE_AUTH_TOKEN: '${{ secrets.PACKAGES_READ_TOKEN }}' }
      - name: Gemeinsame lokale und CI-Prüfung
        run: npm run ci
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST || 'media.example.invalid' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      - name: Produktions-Build (Bilder selbst gehostet, wie deployt)
        # npm run ci baut offline mit dem noop-Bilddienst; Browser-Gates prüfen den echten Output.
        run: npx astro build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST || 'media.example.invalid' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      # Vor dem Consent-Testbuild sichern: alle Browser prüfen denselben Produktionsoutput.
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 1

  audits:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm, registry-url: 'https://npm.pkg.github.com', scope: '@marc-viladrich' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.PACKAGES_READ_TOKEN }}' }
      - uses: actions/download-artifact@v4
        with: { name: production-build, path: dist }
      - name: Playwright-Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright-Browser
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium webkit
          else npx playwright install --with-deps chromium webkit; fi
      - name: Interne Links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir "${{ github.workspace }}/dist" --include-fragments --index-files index.html --exclude "/api/" "dist/**/*.html"
          fail: true
      - name: Lighthouse-Budgets
        run: |
          npm i -g @lhci/cli@0.15.x
          lhci autorun
          node scripts/check-lighthouse-payload.mjs
      - name: Aktive Consent-Integration mit abgefangenen Test-Tags
        # Auch im aktivierten Build bleibt die Netzwerk-Allowlist ohne Zustimmung strikt.
        run: |
          npm run build
          npx playwright test tests/consent.spec.ts tests/network-allowlist.spec.ts --workers=1
        env:
          CI: 'true'
          CONSENT_TEST_ENABLED: '1'
          PUBLIC_GA_ID: G-CONSENTTEST
          PUBLIC_GOOGLE_ADS_ID: AW-123456789
          PUBLIC_GOOGLE_ADS_LABEL: TEST_LABEL
          SITE_URL: ${{ vars.SITE_URL || 'https://example.invalid' }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST || 'media.example.invalid' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-checks
          include-hidden-files: true
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7

  browsers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [desktop, mobile, webkit, mobile-webkit, physics]
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm, registry-url: 'https://npm.pkg.github.com', scope: '@marc-viladrich' }
      - run: npm ci
        env: { NODE_AUTH_TOKEN: '${{ secrets.PACKAGES_READ_TOKEN }}' }
      - uses: actions/download-artifact@v4
        with: { name: production-build, path: dist }
      - name: Playwright-Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright-Browser
        timeout-minutes: 6
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium webkit
          else npx playwright install --with-deps chromium webkit; fi
      - name: Playwright (axe, Request-Allowlist, HTML-Hygiene und Physik)
        # Physik isoliert und seriell: keine anderen Browser belasten diesen Runner.
        # Die übrigen Projekte behalten alle Tests, außer den hier separat geprüften Physikfällen.
        run: |
          physics='Physikalisch fliegbar:|Logo, Text-Durchlauf, Anlasswechsel und Rücksprung bleiben fliegbar'
          if [ "$LANE" = physics ]; then
            npx playwright test --project=desktop --grep "$physics" --workers=1
          else
            # WebKit's software rendering must not compete with another active show.
            workers=2
            case "$LANE" in *webkit*) workers=1 ;; esac
            npx playwright test --project="$LANE" --grep-invert "$physics" --workers="$workers"
          fi
        env:
          CI: 'true'
          LANE: ${{ matrix.lane }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.lane }}
          path: playwright-report/
          retention-days: 7

  # Branch-Schutz verlangt weiterhin genau diesen Check. Kein Gate darf übersprungen sein.
  gates:
    if: always()
    needs: [checks, browsers, audits]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Qualitäts-Gates erfolgreich
        run: test "$CHECKS" = success && test "$BROWSERS" = success && test "$AUDITS" = success
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSERS: ${{ needs.browsers.result }}
          AUDITS: ${{ needs.audits.result }}
