  - type: textMedia
    id: marketing
    kicker: Advertising and marketing with drones
    headline: Your company on the world's *biggest stage*
    body: |-
      The new product whose launch everyone should hear about. The ad film with a wow factor. The brand campaign that burns your logo back into people's minds.

      Together we build a bespoke choreography that tells your brand's story. More than just your logo, a claim or your company name – emotional storytelling that enchants.

      Our drone shows are an alternative to fireworks that hardly anyone knows yet. Attention guaranteed, even from miles away.
    gallery: logos
    mediaSide: right
    headAbove: true
    cta:
      label: Request a show
      href: "#anfrage"
    _key: k_7abf894f6f4dfb7d5b8c
  - type: steps
    id: komplettpaket
    kicker: Complete package
    headline: Everything your marketing needs
    text: From idea to applause, we support you throughout the entire planning and execution.
    steps:
      - title: Technology
        text: We provide the hardware, software and light drones.
        icon: cpu
        _key: k_af05b8945c8be9debc06
      - title: Music
        text: Let the drones dance to your playlist.
        icon: music
        _key: k_6fde2934223b459a104b
      - title: Promotional material
        text: On request, we create photos and film footage.
        icon: camera
        _key: k_b70646235e480f243d27
      - title: Permits
        text: We take care of all the red tape.
        icon: file-badge
        _key: k_a6468dcb0adc9a4e3750
      - title: Safety
        text: LBA and EASA certified, liability insurance up to €1.3 million.
        icon: shield-check
        _key: k_9730a94aee3b6c9a4cd7
      - title: Speed
        text: Planning in under two weeks is possible.
        icon: timer
        _key: k_d8f5a13e0b38775b6e79
      - title: International
        text: In Germany, Europe and worldwide
        icon: globe
        _key: k_763f57501b2e5cc8475e
    cta:
      label: Request a show
      href: "#anfrage"
    surface: alt
    ownNumbers: false
    _key: k_5fce2f823d9e547c9f3a
