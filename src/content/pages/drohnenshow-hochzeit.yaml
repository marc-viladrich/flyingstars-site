    cta: Motive im Konfigurator ansehen
    loop: hochzeit
    _key: k_52056666f5076b5e0423

  # Kurzfassung der Nachhaltigkeits-Section: große Aussage, daneben Icon und Punktmuster statt des Stockfotos (Marc,
  # 17.11.2026: kein Stockbild, solange es kein echtes FlyingStars-Showfoto mit Kindern und Hunden gibt)
