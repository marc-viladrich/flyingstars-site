  - type: textMedia
    id: warum-drohnen
    kicker: Bespoke drone shows
    headline: Fireworks? So last year
    cta:
      label: Plan a drone show
      href: /drohnenshow-preise/
    _key: k_55390b5c7d73f75ab4f2
    body: "Welcome to the future of entertainment. Drone light shows are the alternative for guests who have seen enough pyrotechnics.\n\nThey are more spectacular: 3D instead of 2D, visible for miles, still hardly known – attention guaranteed. More emotional: firecrackers bang. Drone shows tell stories that thrill and move. And more unique: with 100 to 1000+ points of light we can build almost any motif.\n\nWhat does your story look like drawn across the sky? Let's find out!"
    mediaSide: right
  - type: landingRefs
    id: projekte
    kicker: References
    headline: Nights we will never forget
    text: "Since 2021 we have flown more than 30 shows a year, over 150 in total."
    todo: "Für E.ON (Hamburg, 2026) fehlen Showbild, genaues Datum und eine Fallstudie."
    _key: k_c25f10c971a03e70f6ba
