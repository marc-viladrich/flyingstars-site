      - { label: Größte Einzelshow, value: 600 Drohnen, text: "Im Musical Bokkenrijders in Maastricht, 2025 als Teaser und 2026 an 20 Abenden." }
      - { label: Ein Monat, value: 12.000 Drohnen, text: "Im Juni 2026, 20 Shows mit je 600 Drohnen." }

