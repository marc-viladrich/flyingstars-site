title: "Nachhaltigkeit: Drohnenshows von FlyingStars (vs. Feuerwerk)"
description: "Kein Knall. Kein Müll. Kein Rauch. ✓ Drohnenshows für soziales und ökologisches Engagement. ☎︎ +49 209 88306562"
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  # „Kein Müll.“ im Logoverlauf wie auf der Startseite (DESIGN); Weltkugel aus Drohnen bei der Extraschicht als Bild.
  - type: hero
    kicker: Nachhaltigkeit
    headline: Kein Knall. *Kein Müll.* Kein Rauch.
    text: Unsere Drohnenshows zeigen, dass großes Spektakel auch leise, lokal emissionsfrei und aufgeräumt geht. Und heißt so alle Gäste herzlich willkommen – auch Hunde, Kinder und die Natur vor Ort.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: Weltkugel aus Drohnen über dem Rhein bei der Extraschicht in Duisburg, Publikum am Ufer
      width: 2544
      height: 1493
    _key: k_ef572ac0e4ba13d454af

  # Scrollstory aus dem Prototyp: Moritz' drei Punkte als große Werte (leise, 0 kg, 0 g aus dem Prototyp), seine Sätze daneben.
  - type: sustainability
    id: alternative
    kicker: Drohnenshows
    headline: Die *Alternative* zum Feuerwerk
    text: Unsere Drohnenshows dürfen oft dort fliegen, wo Feuerwerke wegen Lärmschutz, Feinstaub oder Brandgefahr verboten oder unerwünscht sind.
    facts:
      - { label: Kein Knall, value: leise, text: "Unsere Drohnen surren nur leise. Der TÜV NORD bestätigt unseren Schallschutz. So können auch sensible Gäste teilnehmen.", "_key": "k_5dfd76d168b4a97a8cff" }
      - { label: Kein Müll, value: "0", unit: kg, text: "Unsere Drohnen sind wiederverwendbar. Wir laden sie mit 100 % Ökostrom von naturstrom immer wieder auf.", "_key": "k_2a3281e1e1ce468cb8ed" }
      - { label: Kein Rauch, value: "0", unit: g, text: "Unsere Drohnen produzieren vor Ort weder Feinstaub noch Stickoxide oder Schwermetall. Es kommen keine offenen Flammen zum Einsatz.", "_key": "k_85941100bf952a64e766" }
    # Belege als Karte unter den Werten (wie im Prototyp): naturstrom-Logo, TÜV NORD ohne Zeichen (DESIGN). Die zwei Zeilen
    # sind Kurzfassungen aus Moritz' Sätzen.
    proofImage: { src: "https://flyingstars.art/wp-content/uploads/2024/10/NATURSTROM-Logo_weiss.png", alt: naturstrom, width: 301, height: 71 }
    points:
      - { value: Schallschutz vom TÜV NORD bestätigt, "_key": "k_4ecbfd8bacb8dad1a3e9" }
      - { value: 100 % Ökostrom von naturstrom, "_key": "k_8fd4b4570f848e1175a8" }
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen, die Belege für Ökostrom und das TÜV-NORD-Schallschutzgutachten bereithalten und die Nutzung des naturstrom-Logos schriftlich freigeben lassen.
    _key: k_b58e8e802d7c6c5c47eb

