  - type: team
    id: team
    kicker: Team
    headline: Die Menschen hinter dem Himmel.
    text: 2022 gegründet, zu Hause im Triple Z auf Zeche Zollverein in Essen.
      Design, Technik und Genehmigungen machen wir selbst – du hast von der
      ersten Idee bis zur Landung dieselben Ansprechpartner:innen.
    members:
      - name: Ronja Donsbach
        role: Mitgründerin · GF
        bio: "Kundenkontakt und Design: vom ersten Gespräch bis zum fertigen
          Showkonzept."
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/08/Ronja_Teamfoto.jpg
          alt: Ronja Donsbach
          width: 800
          height: 1000
      - name: Erwin Wilms
        role: Mitgründer · GF
        bio: "Recht und Genehmigungen: spricht mit LBA und Flugbehörden, damit deine
          Show abheben darf."
        image:
