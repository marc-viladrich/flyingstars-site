    headline: Geen knal. Geen afval. Geen rook.
    text: "Ook honden en kinderen zijn van harte welkom bij onze drone-evenementen: ze zijn afvalvrij, lokaal emissievrij en zoemen zachter dan vuurwerk. Met shows voor de Deutsche Umwelthilfe en Kein Bock auf Nazis zetten we bovendien regelmatig ecologische en sociale signalen aan de hemel."
