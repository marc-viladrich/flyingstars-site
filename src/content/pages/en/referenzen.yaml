title: Our work
description: "FlyingStars shows for Bokkenrijders, NFL, Ford and PUMA, plus annual show counts: 178 shows since 2022, with 50 to 600 drones."
sections:
  - type: references
    id: referenzen
    kicker: Our work
    headline: Shows we've already flown.
    text: 178 shows since 2022, as of 21 October 2026. Explore a selection including seven detailed case studies.
    filters:
      - occasion
      - year
      - drones
    todo: Für die verbleibenden Kurzreferenzen fehlen Projektgeschichten und teilweise weitere Bilder. FlyingStars muss priorisierte Briefings und Nutzungsfreigaben liefern; freigegebene Kundenzitate liegen laut Fragebogen nicht vor.
    _key: k_6aab7fa758be0d59fffb
  - type: metrics
    id: pro-jahr
    kicker: In numbers
    headline: Shows per *year*.
    items:
      - label: "2022"
        value: "8"
        text: "The first on 13 August: 50 drones for a private birthday. PUMA at Borussia-Park in November."
        _key: k_558285939749d8a5ecdc
      - label: "2023"
        value: "42"
        text: "Including L’Oréal × Prada at Düsseldorf's Rhine Tower and #Böllerciao with Deutsche Umwelthilfe in Berlin."
        _key: k_6bd86bfa991317b66002
      - label: "2024"
        value: "45"
        text: Including 50 years of VW Golf at Lake Wolfgangsee and the new Ford Explorer in Cologne.
        _key: k_971a2ffe477a6c410563
      - label: "2025"
        value: "33"
        text: Including the first indoor show for Siemens at Hannover Messe and the NFL Berlin Game.
        _key: k_6cc90756de99e77daa63
      - label: "2026"
        value: "50"
        text: Up to 21 October. Including 20 Bokkenrijders evenings with 600 drones each and E.ON in Hamburg.
        _key: k_ddcd9f398dfdb07dbe49
      - label: Total
        value: { fact: showsTotal, "display": "number" }
        text: For brands, cities, festivals and couples, in Germany and Europe.
        _key: k_2eb3255fbe18749fd330
    todo: FlyingStars muss die Jahreszahlen einschließlich 2026 aktualisieren oder den Stand 21.10.2026 ausdrücklich beibehalten; 178 ist keine laufende Live-Zählung.
    _key: k_f41a9c016c41af101b3b
