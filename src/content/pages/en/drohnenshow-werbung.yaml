  - type: landingFlow
    id: freigabe
    kicker: The process
    headline: From logo to finished show.
    text: Nothing flies without your approval.
    steps:
      - title: Enquiry and quote
        text: Tell us your date, location and goal. We'll reply within 48 hours and send a quote after a short conversation.
        duration: Reply within 48 h
        _key: k_195bdede45eea38fcdd2
      - title: Draft
        text: Send us your logo. First, you'll see a 2D draft of the motifs.
        _key: k_49e43d30a4cf6e87e6d1
      - title: Animation
        text: Then a draft animation with music. From HORIZON upwards, you receive a video preview of the show.
        _key: k_321f6a3deb2b1ef07eea
      - title: Approval
        text: Once you've approved every motif, we programme the colours and light effects to the music.
        gate: true
        _key: k_737c9a5473db3f88034c
      - title: Show day
        text: Our crew arrives around three hours beforehand, secures the take-off area and flies the show.
        duration: approx. 3 h setup
        _key: k_cdf27dbb327e5fcde319
    _key: k_a7152263e0461f67ead9
  - type: packages
    id: pakete
    kicker: Packages
    headline: How complex should your show be?
