  - type: occasions
    id: anlaesse
    kicker: Occasions
    headline: The right show for every occasion.
    cards:
      - category: Brands & advertising
        title: Your brand on the world's biggest canvas
        text: Logos, products and slogans in the sky, for launches, anniversaries and shoots.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
          alt: Volkswagen logo made of drones above Lake Wolfgangsee, guests on a terrace
          width: 1920
          height: 1281
        facts:
          - You approve every motif in advance
          - For guests, staff and the camera
        cta:
          label: Drone shows for brands
          href: /drohnenshow-werbung/
      - category: Agencies
        title: We fly, you shine
        text: We fly for your clients and can stay behind the scenes if you prefer.
        image:
          src: https://flyingstars-relaunch.vercel.app/media/projekte/ford.jpg
          alt: Ford lettering made of drones above the factory site in Cologne
          width: 1600
          height: 900
        facts:
          - NDA and project management on request
          - Visualisation with your client's logo
        cta:
          label: For agencies
          href: /drohnenshow-werbung/#agenturen
      - category: Cities & municipalities
        title: A highlight that the whole city is talking about
        text: City festivals and anniversaries without pyrotechnics, even in the driest summer.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
          alt: A globe made of drones above the Rhine at Extraschicht in Duisburg
          width: 2544
          height: 1493
        facts:
          - City crests, anniversary numbers, your story
          - 10% discount when booking the year before
        cta:
          label: Enquire about a show for your city
          href: /kontakt/?anlass=stadt
      - category: Wedding & private
        title: Your moment, written in the sky
        text: Initials, hearts and your date above the celebration, or as part of a proposal.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/Hochzeit_cover.jpg
          alt: Two flowers made of drones in the evening sky above a wedding celebration
          width: 1518
          height: 854
        facts:
          - For a surprise or proposal too
          - SPARK from €7,900 excluding VAT
        cta:
          label: Wedding drone show
          href: /drohnenshow-hochzeit/
      - category: Festivals & concerts
        title: A finale that carries your story further
        text: The show connects with the stage, music and lighting, even across many consecutive evenings.
        image:
          src: https://flyingstars-relaunch.vercel.app/media/projekte/bokkenrijders.jpg
          alt: Bokkenrijders lettering made of drones above the open-air theatre in Maastricht, audience in the foreground
          width: 1600
          height: 900
        facts:
          - The same show every evening, even 20 times in a row
          - 10% discount when booking the year before
        cta:
          label: 600 drones in a musical
          href: /musikalischer-teaser-bokkenrijders/
      - category: New Year's Eve & Christmas
        title: New Year's Eve without firecrackers
        text: A countdown in light, without bangs or smoke, for cities, municipalities and event organisers.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
          alt: "A colourful drone firework above Berlin during Deutsche Umwelthilfe's #Böllerciao campaign"
          width: 1920
          height: 987
        facts:
          - Flown above Berlin with Deutsche Umwelthilfe
          - Enquire early, dates fill up quickly
        cta:
          label: Enquire about a New Year's Eve show
          href: /kontakt/?anlass=stadt
        season:
          - 11
          - 12
      - category: Indoor
        title: Drones inside the hall
        text: "For exhibitions, stages and halls with ceiling heights from {{offer.indoor.ceilingWords}} metres."
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
          alt: Glowing drones in formation in front of a stage in a packed hall
          width: 1200
          height: 764
        facts:
          - "{{offer.indoor.drones.min}} to {{offer.indoor.drones.max}} drones, {{duration.indoor.min}} to {{duration.indoor.max}} minutes"
          - Individually priced
        cta:
          label: Indoor drone shows
          href: /drohnenshow-indoor/
    todo: Moritz muss die Anlass-Texte freigeben; FlyingStars muss die Relaunch-Sitemap bestätigen. Eigene Seiten für Städte, Festivals und Silvester sind bislang nicht ausgearbeitet.
  - type: packages
    id: pakete
    kicker: Packages
    compact: true
    headline: Transparent pricing. No surprises.
    text: The price depends on the complexity of the pictures in the sky and how many drones fly.
    items:
      - name: SPARK
        label: Classic 2D
      - name: HORIZON
        label: 3D in motion
        badge: Bestseller
        highlight: true
      - name: ODYSSEY
        label: 3D storytelling show
    note: All prices exclude VAT and travel
    cta:
      label: All services and prices
      href: /drohnenshow-preise/
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.
  - type: configuratorTeaser
    id: konfigurator
    kicker: Show configurator
    headline: Create your show *yourselves*.
    text: From hearts to a moon landing, with 100 to 600 drones. See what suits your occasion in the configurator.
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
  - type: projectGrid
    id: projekte
    kicker: Our work
    headline: A few nights we won't forget.
    text: 30 to 50 shows a year, with 50 to 600 drones. A small selection.
    limit: 4
    cta:
      label: All our work
      href: /referenzen/
  - type: tempo
    id: ablauf
    kicker: The process in numbers
    headline: From enquiry to show night.
    text: One to two months' notice is ideal. If time is short, one to two weeks can work too.
    marks:
      - value: { fact: responseHours, display: hours }
        label: until our reply
        text: Usually sooner, by email, phone or video call.
      - value: 1–2 months
        label: ideal lead time
        text: Enough time for your design approvals and the permit.
      - value: 3 h
        label: Setup on show day
        text: Our crew sets up, flies the show and packs everything away.
    shortcut:
      value: Express in 1–2 weeks
      label: available as an extra
      text: PUMA contacted us 14 days before the derby. The show flew in time for kick-off.
      href: /kontakt/?extras=express
    facts:
      - value: { fact: showsTotal, display: shows }
        label: Experience
        text: Since August 2022, as of October 2026
      - value: 600 drones
        label: Largest show
        text: The musical Bokkenrijders in Maastricht, over 20 evenings
      - value: Design · Permits · Fleet
        label: From one team
        text: Our own design team, operating authorisation and drones
