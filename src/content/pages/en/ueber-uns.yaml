title: "About FlyingStars: team, mission and milestones"
description: Get to know our vision and the people behind it ✓ 150+ drone shows around the world ☎︎ {{contact.phone.international}}
noindex: false
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: landingHero
    todo: "FlyingStars muss ein freigegebenes Teamfoto liefern (Moritz' Platzhalter #Teamfoto); bis dahin läuft hier das Showreel."
    kicker: About FlyingStars
    headline: We *enchant* guests with your story
    text: Entertaining people, stirring emotions and staying in their memories. We want to show that this also works without bangs, litter and smoke. That is why, since 2021, we have flown more than 150 magical drone shows for tens of thousands of spectators.
    cta:
      label: Get to know us
      href: "#team"
    video: showreel
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
      alt: Drone formation above the Düsseldorf skyline with the Rhine Tower
      width: 1600
      height: 900
    facts:
      - value: "2021"
        label: founded
        _key: k_07f319e4f08e855ed3c2
      - value: 150+
        label: drone shows
        _key: k_61cf80d1d9046e824f10
      - value: "600"
        label: drones in our biggest show
        _key: k_1ad8788ba42c8951f048
    _key: k_b7135e5f4ccf1ef0e1c1
  - type: sustainability
    id: nachhaltigkeit
    kicker: Sustainability
    headline: Celebrations where *everyone* is welcome
    text: "Dogs, children, nature: large parts of our society would rather stay away from fireworks. We prefer celebrations that thrill all of us. That is why our drone shows offer an alternative to the bangs, litter and smoke of fireworks. And we regularly send signals for democracy and environmental protection into the sky."
    gallery: willkommen
    cta:
      label: More on sustainability
      href: /nachhaltigkeit/
    _key: k_0fa41045b869c8273b40
  - type: steps
    id: haltung
    kicker: What we stand for
    headline: These values always fly with us
    steps:
      - title: Teamwork
        subtitle: All together for one moment
        text: Our choreographies are not created single-handedly, but through the close interplay of our team and with you. That is why we have kept in close touch with many of our clients for years.
        icon: handshake
        _key: k_f25977eef0b3c3073f86
      - title: Curiosity
        subtitle: How does your story shine?
        text: "We keep finding new ways to enchant people. Sometimes with more spectacle: cutting-edge technology, bigger dances, more oomph. Sometimes with creativity and aesthetics, creating a whole world with just a few pixels in the sky."
        icon: telescope
        _key: k_1705c70732105b287ad3
      - title: Thoroughness
        subtitle: Every detail counts
        text: So that you can soak up the fairytale atmosphere together with your guests, we plan every step carefully. Thanks to the experience of more than 150 events around the world, we are prepared for just about any eventuality.
        icon: list-checks
        _key: k_4cbe7266c56990c2d263
      - title: Sustainability
        subtitle: No bang. No litter. No smoke.
        text: A big spectacle can also be quiet, free of local emissions and tidy. Our drones are reusable, and we recharge them again and again with 100% green electricity from naturstrom.
        icon: leaf
        _key: k_7e2a41c9d05b38f6a1c4
    surface: alt
    ownNumbers: false
    _key: k_5f577f27ee53584bc075
  - type: team
    id: team
    kicker: Our team
    todo: FlyingStars muss Fotos von Patrick, Alejandro und Chopper liefern sowie hochauflösende Porträts der drei Geschäftsführer:innen; Nachnamen von Patrick und Alejandro fehlen in Moritz' Text.
    headline: Everything from a single source
    text: When you book FlyingStars, you get FlyingStars – no external service providers. We cover every task in-house with a well-practised team. On top of that, around ten temporary staff help us set up, dismantle and secure our performances.
    members:
      - personId: florian-becker
      - personId: ronja-donsbach
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
      - personId: chopper
    memberTexts:
      - personId: florian-becker
        role: Managing director
        bio: Flo handles our internal administration. He also writes for our blog.
        _key: k_b465446582054e981d9b
      - personId: ronja-donsbach
        role: Managing director
        bio: Ronja will probably handle your enquiry and coordinates how our team works together.
        _key: k_354002e2469c5de0d5ce
      - personId: erwin-wilms
        role: Managing director
        bio: Erwin takes care of applications and permits and looks after international projects.
        _key: k_5fe478b35edaa77dd0a2
      - personId: patrick
        role: Technology
        bio: Patrick puts our fleet together and makes sure everything runs smoothly on the technical side.
        _key: k_c27f497bc32276117ae9
      - personId: alejandro
        role: Design
        bio: Alejandro turns your story into a unique choreography in 2D and 3D.
        _key: k_9216ad57906a5ee4167a
      - personId: chopper
        role: Happiness
        bio: Chopper brings the woof factor to your show and the good mood to the office.
        _key: k_33354ce5e5195eb00295
    _key: k_c25a7d02d05d2423027c
  - type: timeline
    id: meilensteine
    kicker: Our milestones
    todo: "Moritz' Zahlen weichen vom Bestand ab: VW Golf 350 oder 400 Drohnen (Fragebogen 350), Showzahlen je Jahr (Bestand: 178 Shows bis 21.10.2026). Titel je Jahr sind ein Entwurf."
    headline: From a private birthday to the other side of the *world*
    items:
      - when: "2021"
        title: Founding
        text: Our founders wonder why drone shows can almost only be seen in Asia. So they simply bring them to Germany. On 1 December 2021 they found FlyingStars.
        _key: k_6c6ce3555dadeb7f9c19
      - when: "2022"
        title: The first show
        text: Our first drone show takes place in August at a private birthday party with 50 drones. Exciting! Seven more follow in the same year, including one for PUMA.
        _key: k_7d0e13be5f980d2587f6
      - when: "2023"
        title: 42 performances
        text: "In 2023 we already fly 42 performances, among them for Deutsche Umwelthilfe in support of the #BÖLLERCIAO campaign. We also move into Triple Z in Essen."
        _key: k_53114f06e4c47ca208dc
      - when: "2024"
        title: 400 drones for VW
        text: With 400 drones we set a milestone for VW in Austria. We fly 45 shows in total and refine our processes.
        _key: k_73251c0c3357108c15e8
      - when: "2025"
        title: The first indoor show
        text: In March we fly our first indoor show for Siemens at the Hannover Messe. Since August 2025 we have regularly been able to make a statement with Kein Bock auf Nazis.
        _key: k_41fdee284e0f1ec28380
      - when: "2026"
        title: Record year
        text: "Record year: we fly our biggest show yet, with 600 drones, for a Dutch musical – 20 nights in a row! Our furthest job so far takes us to the Caribbean."
        _key: k_72e4446870d686464b34
    cta:
      label: All references
      href: /referenzen/
    surface: alt
    _key: k_65625cffa99167129c8b
  - type: location
    id: standort
    kicker: Location
    todo: FlyingStars muss ein Foto des Triple Z bzw. des Büros liefern, falls es statt der Karte stehen soll.
    headline: At home in *NRW*
    text: "Fancy dropping by for a coffee? Then we would love to welcome you to our office. Here we are based at Triple Z, the start-up centre at Zeche Zollverein, surrounded by innovative start-up spirit and North Rhine-Westphalia's industrial tradition."
    places:
