  - type: occasions
    id: anlaesse
    kicker: Gelegenheden
    headline: Voor elke gelegenheid de juiste show.
    cards:
      - category: Bedrijven
        title: Jullie merk op het grootste doek ter wereld
        text: Logo's, producten en slogans aan de hemel, voor lanceringen, jubilea en opnamen.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
          alt: Volkswagen-logo van drones boven de Wolfgangsee, gasten op een terras
          width: 1920
          height: 1281
        facts:
          - Jullie keuren elk beeld vooraf goed
          - Voor gasten, medewerkers en de camera
        cta:
          label: Droneshows voor merken
          href: /drohnenshow-werbung/
      - category: Bureaus
        title: Wij vliegen, jullie stralen
        text: We vliegen voor jullie klanten en blijven op verzoek op de achtergrond.
        image:
          src: https://flyingstars-relaunch.vercel.app/media/projekte/ford.jpg
          alt: Ford-tekst van drones boven het fabrieksterrein in Keulen
          width: 1600
          height: 900
        facts:
          - NDA en projectleiding op verzoek
          - Visualisatie met het logo van jullie klant
        cta:
          label: Voor bureaus
          href: /drohnenshow-werbung/#agenturen
      - category: Steden & gemeenten
        title: Een hoogtepunt waarover de hele stad spreekt
        text: Stadsfeesten en jubilea zonder pyrotechniek, ook in de droogste zomer.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
          alt: Een wereldbol van drones boven de Rijn bij de Extraschicht in Duisburg
          width: 2544
          height: 1493
        facts:
          - Stadswapens, jubileumgetallen, jullie verhaal
          - 10% korting bij boeking in het voorgaande jaar
        cta:
          label: Vraag een show voor jullie stad aan
          href: /kontakt/?anlass=stadt
      - category: Bruiloft & privé
        title: Jullie moment, geschreven aan de hemel
        text: Initialen, harten en jullie datum boven het feest, ook voor een huwelijksaanzoek.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/Hochzeit_cover.jpg
          alt: Twee bloemen van drones aan de avondhemel boven een bruiloft
          width: 1518
          height: 854
        facts:
          - Ook als verrassing of aanzoek
          - SPARK vanaf € 7.900 exclusief btw
        cta:
          label: Droneshow voor jullie bruiloft
          href: /drohnenshow-hochzeit/
      - category: Festivals & concerten
        title: Een hoogtepunt dat jullie verhaal verder vertelt
        text: De show sluit aan op podium, muziek en licht, ook op veel avonden achter elkaar.
        image:
          src: https://flyingstars-relaunch.vercel.app/media/projekte/bokkenrijders.jpg
          alt: Bokkenrijders-tekst van drones boven het openluchttheater in Maastricht, publiek op de voorgrond
          width: 1600
          height: 900
        facts:
          - Elke avond dezelfde show, ook 20 keer achter elkaar
          - 10% korting bij boeking in het voorgaande jaar
        cta:
          label: 600 drones in een musical
          href: /musikalischer-teaser-bokkenrijders/
      - category: Oud en nieuw & kerst
        title: Oud en nieuw zonder knalvuurwerk
        text: Een countdown van licht zonder knallen of rook, voor steden, gemeenten en organisatoren.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
          alt: "Een kleurrijke vuurwerkbloem van drones boven Berlijn bij de campagne #Böllerciao van Deutsche
            Umwelthilfe"
          width: 1920
          height: 987
        facts:
          - Met Deutsche Umwelthilfe boven Berlijn gevlogen
          - Vraag vroeg aan, de data zijn snel vol
        cta:
          label: Vraag een oud-en-nieuwshow aan
          href: /kontakt/?anlass=stadt
        season:
          - 11
          - 12
      - category: Indoor
        title: Drones in de zaal
        text: Voor beurzen, podia en hallen vanaf drie meter plafondhoogte.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
          alt: Lichtgevende drones in formatie voor het podium in een volle zaal
          width: 1200
          height: 764
        facts:
          - 20 tot 50 drones, 5 tot 8 minuten
          - Apart berekend
        cta:
          label: Indoor-droneshows
          href: /drohnenshow-indoor/
  - type: packages
    id: pakete
    kicker: Pakketten
    compact: true
    headline: Transparante prijzen. Geen verrassingen.
    text: De prijs hangt af van hoe uitgebreid de beelden aan de hemel zijn en hoeveel drones er vliegen.
    items:
      - name: SPARK
        label: Klassiek in 2D
      - name: HORIZON
        label: 3D in beweging
        badge: Bestseller
        highlight: true
      - name: ODYSSEY
        label: 3D-show met verhaal
    note: Alle prijzen zijn exclusief btw en reiskosten
    cta:
      label: Alle diensten en prijzen
      href: /drohnenshow-preise/
  - type: configuratorTeaser
    id: konfigurator
    kicker: Showconfigurator
    headline: Stel jullie show *zelf* samen.
    text: Van een hart tot een maanlanding, met 100 tot 600 drones. In de configurator zien jullie wat bij de
      gelegenheid past.
  - type: projectGrid
    id: projekte
    kicker: Onze shows
    headline: Een paar avonden die we niet vergeten.
    text: 30 tot 50 shows per jaar, met 50 tot 600 drones. Een kleine selectie.
    limit: 4
    cta:
      label: Al onze shows
      href: /referenzen/
  - type: tempo
    id: ablauf
    kicker: Het verloop in cijfers
    headline: Van aanvraag tot showavond.
    text: Eén tot twee maanden voorbereiding is ideaal. Als het haast heeft, kan het ook binnen één tot twee weken.
    marks:
      - value: 48 h
        label: tot ons antwoord
        text: Meestal sneller, per e-mail, telefoon of videogesprek.
      - value: 1–2 maanden
        label: ideale voorbereidingstijd
        text: Genoeg tijd voor jullie goedkeuring van het ontwerp en voor de vergunning.
      - value: 3 h
        label: Opbouw op de showdag
        text: Ons team bouwt op, vliegt de show en pakt weer in.
    shortcut:
      value: Express binnen 1–2 weken
      label: bij te boeken
      text: PUMA stuurde de aanvraag 14 dagen voor de derby. De show vloog op tijd voor de aftrap.
    facts:
      - value: 178 shows
        label: Ervaring
        text: Sinds augustus 2022, stand oktober 2026
      - value: 600 drones
        label: Grootste show
        text: Musical Bokkenrijders in Maastricht, op 20 avonden
      - value: Ontwerp · Vergunning · Vloot
        label: Vanuit één team
        text: Eigen ontwerpteam, eigen vergunning, eigen drones
