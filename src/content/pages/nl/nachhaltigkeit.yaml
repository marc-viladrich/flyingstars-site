  - type: landingSpotlight
    id: referenzen
    kicker: Referenties
    todo: FlyingStars muss ein Showfoto oder einen kurzen Loop von Kein Bock auf Nazis liefern (z. B. Open Flair 08.08.2025 oder Erfurt 02.07.2026) und die Namensnennung beider Partner freigeben.
    headline: We vliegen met *engagement*
    text: Als partner van ngo's mogen we regelmatig tekens voor democratie en milieubescherming aan de hemel zetten.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: "Kleurrijke vuurwerkbloem van drones boven Berlijn tijdens de campagne #Böllerciao van de Deutsche Umwelthilfe, toeschouwers filmen met hun telefoon"
      width: 1920
      height: 987
    tags:
      - _key: k_189b36fdbb3bf810d7d6
        value: "#BÖLLERCIAO · Berlijn"
    entries:
      - kicker: Kein Bock e.V.
        title: Kein Bock auf Nazis
        text: Onze droneshows mobiliseren voor meer maatschappelijke samenhang.
        _key: k_e6753824ae3f10493a00
      - kicker: Deutsche Umwelthilfe
        title: "#BÖLLERCIAO"
        text: Sinds 2023 mogen we laten zien dat er geen vuurwerk nodig is om het publiek mee te slepen.
        _key: k_f7fcb999361464ffdc9c
