  - type: landingSpotlight
    id: referenzen
    kicker: References
    todo: FlyingStars muss ein Showfoto oder einen kurzen Loop von Kein Bock auf Nazis liefern (z. B. Open Flair 08.08.2025 oder Erfurt 02.07.2026) und die Namensnennung beider Partner freigeben.
    headline: We fly with *commitment*
    text: As a partner of NGOs, we regularly get to send signals for democracy and environmental protection into the sky.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: "Colourful firework blossom made of drones above Berlin during Deutsche Umwelthilfe's #Böllerciao campaign, spectators filming with their phones"
      width: 1920
      height: 987
    tags:
      - _key: k_189b36fdbb3bf810d7d6
        value: "#BÖLLERCIAO · Berlin"
    entries:
      - kicker: Kein Bock e.V.
        title: Kein Bock auf Nazis
        text: Our drone shows mobilise people for greater social cohesion.
        _key: k_e6753824ae3f10493a00
      - kicker: Deutsche Umwelthilfe
        title: "#BÖLLERCIAO"
        text: Since 2023 we have been able to show that it takes no fireworks to sweep the public off its feet.
        _key: k_f7fcb999361464ffdc9c
