          - {"_key":"k_d2f5d5ea7ac4efcc9bab","value":"Pakketten vanaf € 7.900 exclusief btw"}
        _key: k_38d0d514deda94496d79
    todo: FlyingStars muss 188 g, UWB und die technischen Indoor-/Outdoor-Vergleichswerte für die aktuelle Flotte bestätigen.
    _key: k_c030e32b9a3f99dac46e
  - type: landingSite
    id: raum
    kicker: Voorwaarden
    headline: Wat jullie ruimte nodig heeft.
    text: De plattegrond, plafondhoogte en positie van jullie publiek vormen de basis voor ons showconcept.
    variant: indoor
    diagram:
      description: "Doorsnede van een ruimte met minimaal {{offer.indoor.ceilingMin}} m plafondhoogte en het publiek naast het vrije vlieggebied. Daaronder een bovenaanzicht van een voorbeeldopstelling voor 20 drones, met antennes op de hoeken van het vlieggebied."
      horizontalLabel: ca. 5 m
      verticalLabel: "min. {{offer.indoor.ceilingMin}} m"
      detailLabel: 1 m raster
      flightLabel: Vlieghoogte tot 8 m, afgestemd op de ruimte
      caption: "Schema, niet op schaal. Voorbeeldopstelling voor {{offer.indoor.drones.min}} drones op ca. 5 × 5 m. Voor 50 drones vermeldt het gegevensblad ca. 7 × 7 m. We plannen het volledige vlieggebied en de publiekszone voor jullie ruimte."
    items:
      - title: Plafondhoogte
        value: "minimaal {{offer.indoor.ceilingMin}} m"
        text: We passen de vliegroutes aan jullie ruimte aan. Het indoorsysteem vliegt tot 8 m hoog.
        zone: ceiling
        _key: k_b1de79da73ea068f872c
      - title: Vlieggebied
        text: De start- en vliegzone blijft vrij. Indoor gebruiken we een eigen dronesysteem met vooraf berekende vliegroutes.
        zone: drones
        _key: k_0bd5c94f0e07243b0cc8
      - title: Start- en landingszone
        value: 1 m startraster
        text: Als richtlijn hebben 20 drones ca. 5 × 5 m nodig en 50 drones ca. 7 × 7 m. De vloer moet vlak zijn; alle drones starten op dezelfde hoogte.
        zone: floor
        _key: k_b708426fb85bea29d91e
      - title: Positionering in de ruimte
        text: Antennes staan op de hoeken van het vlieggebied. Het UWB-systeem bepaalt de posities in de ruimte; wij nemen de drones en techniek mee.
        zone: kit
        _key: k_4a99c3eed498d8e2ac37
      - title: Publiekszone
        text: We stemmen de positie van jullie gasten en het vrije vlieggebied met jullie af. De afstand tot het publiek leggen we vast in het showconcept voor jullie ruimte.
        zone: guests
        _key: k_e8a36322c9c72cbbe82f
    responsibilities:
      - { task: "Planning van vliegzone, publiek en choreografie", us: full, you: none, "_key": "k_57fdf7ec25d86df06f65" }
      - { task: "Indoor-drones, positioneringstechniek en team", us: full, you: none, "_key": "k_ad5f7a3b6c6ebdc8f165" }
      - { task: "Plattegrond met maten en plafondhoogte sturen", us: none, you: full, "_key": "k_bf45eb6771550598d8e2" }
      - { task: "Vrije, vlakke start- en vliegzone beschikbaar stellen", us: none, you: full, "_key": "k_9ca1677c1a9556085ebf" }
      - { task: "Stroomaansluiting in de buurt beschikbaar stellen", us: part, you: full, hint: "we stemmen af", "_key": "k_90cf1d512c775430202a" }
    download:
      label: Technisch gegevensblad · PDF
      href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf
    todo: FlyingStars muss die gesamte Indoor-Flugfläche, Publikumsabstände, Strombedarf und Zugänglichkeit ergänzen; die Rastermaße allein bestimmen den Raumbedarf nicht.
    _key: k_e6bdd66c6eff6b2abf0c
  - type: landingBento
    id: sicherheit
    kicker: Veiligheid
    headline: Veilig dicht bij het publiek.
    text: Indoor-drones zijn lichter en langzamer dan onze outdoor-vloot en vliegen vooraf berekende routes.
    lead:
      label: Rotoren
      title: Een beschermframe rond elke *rotor*.
      image:
        src: https://flyingstars.art/wp-content/uploads/2025/04/0L9A4365.jpg
        alt: Kleine drones met rotorbeveiliging lichten blauw op op een donkere vloer
        width: 2560
        height: 1708
    items:
      - icon: gauge
        title: Maximaal 1,5 m/s
        text: Sneller vliegen de drones binnen niet.
        _key: k_e5cf73dc265a9c4310fe
      - icon: move-horizontal
        title: 0,5 m afstand
        text: De minimale afstand tussen twee drones.
        _key: k_9190dfff4d61064037d9
      - icon: shield-check
        title: Meervoudig beveiligd
        text: Redundante veiligheidsfuncties, een gecontroleerde landingsfunctie en CE-gecertificeerde onderdelen.
        _key: k_4fa60ee8f4b6a4138755
    todo: FlyingStars muss 1,5 m/s, 0,5 m Drohnenabstand, Sicherheitsfunktionen und CE-Angaben mit aktuellen technischen Unterlagen bestätigen.
    _key: k_1060f8471da9620b9d94
  - type: landingSpotlight
    id: einsatzorte
    kicker: Locaties
    headline: Een hoogtepunt voor beurs, gala en podium.
    text: We stemmen merkkleuren en muziek af op jullie optreden.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
      alt: Lichtgevende drones in formatie voor het podium in een volle zaal
      width: 1200
      height: 764
    tags:
      - {"_key":"k_211d03046da62f7b385d","value":"Beurzen"}
      - {"_key":"k_1bfb3ba56d6c4740c1ea","value":"Concerten"}
      - {"_key":"k_05c6d02863d2256cece8","value":"Sportevenementen"}
      - {"_key":"k_2d886159ff908cca85d8","value":"Bedrijfsfeesten"}
      - {"_key":"k_dfdbdf308f06f4f99578","value":"Bruiloften in zalen"}
    entries:
      - kicker: Hannover Messe · maart 2025
        title: Siemens
        text: Onze eerste indoor-show.
        _key: k_7c6c021cc1a855fcde60
      - kicker: Essen · september 2026
        title: Triple Z
        text: In het bedrijvencentrum op Zeche Zollverein, waar ook ons kantoor zit.
        _key: k_81843471e629d870eaa4
    todo: Für Siemens Hannover Messe und Triple Z fehlen ausgearbeitete Fallstudien. FlyingStars muss Briefing, Ablauf, konkrete Drohnenzahl, freigegebene Showbilder und die eindeutige Zuordnung des vorhandenen Siemens-Films liefern.
    _key: k_47a98888ed554656bbf5
    facts: []
  - type: tempo
    id: ablauf
    kicker: Verloop
    headline: Weinig moeite voor jullie, van aanvraag tot show.
    marks:
      - value: { fact: responseHours, display: hours }
        label: tot ons antwoord
        text: Vertel ons over de ruimte, de gelegenheid en de datum.
        _key: k_5f52880dee9f83ce56cc
      - value: 6–8 weken
        label: ideale voorbereidingstijd
        text: Ontwerp en planning in de ruimte. Vooraf zien jullie de show op video of tijdens een testvlucht.
        _key: k_575c490370bb45474ab4
      - value: 45 min.
        label: van opbouw tot startklaar
        text: We beginnen vanaf twee uur vóór de show.
        _key: k_ce8b466cf22a08df12d8
    todo: FlyingStars muss 6–8 Wochen Vorlauf, 45 Minuten Aufbau und Ankunft zwei Stunden vor der Show für die aktuelle Indoor-Technik bestätigen; diese Werte stammen bisher nur von der alten Website.
    _key: k_cca8a7702a948ca38dce
    facts: []
  - type: landingPrice
    id: preise
    kicker: Prijzen
    headline: Wat een indoor-show kost.
    text: Indoor-shows berekenen we apart. De outdoor-pakketten gelden binnen niet.
    offer: indoor
    unit: "exclusief btw voor {{offer.indoor.drones.min}} drones, als richtprijs"
    groups:
      - title: De prijs hangt af van
        items:
