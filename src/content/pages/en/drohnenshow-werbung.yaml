    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan. Paketgrenzen und Preisstruktur 2027 sind noch offen.
    headline: Put *your show* together
    text: Start with our base packages and add more drones, more customisation, more spectacle. Always as a fixed package with no surprises.
