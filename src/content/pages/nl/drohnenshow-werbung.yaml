    secondary:
      label: In der Presse
      href: "#marken"
    headline: Nach 150+ Shows noch immer wie beim ersten Mal
    text: Die allermeisten Menschen sehen zum ersten Mal eine Drohnenshow. Es ist unsere Aufgabe, sie mitzureißen! Deshalb führen wir seit 2021 Aufführungen durch, die lange im Kopf und tief im Herzen bleiben.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    _key: k_b75368d6c59a6a7e8123
  - type: contactForm
    kicker: Aanvraag
    headline: Vertel ons over jullie campagne.
    text: Datum, locatie en doel zijn genoeg. Jullie logo mogen jullie later per e-mail sturen.
