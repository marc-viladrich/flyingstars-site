  - type: landingBento
    id: wirkung
    kicker: Effect
    headline: Wat een merkshow kan bereiken.
    lead:
      label: Ford · Volkswagen · PUMA
      title: Een logo dat mensen *herkennen*.
      text: We vertalen jullie logo naar lichtpunten, drone voor drone.
      image:
        src: https://flyingstars.art/wp-content/uploads/2024/12/FORD_comp.png
        alt: Ford-tekst van blauwe drones boven het fabrieksterrein in Keulen
        width: 1929
        height: 1133
    items:
      - icon: camera
        title: Beelden voor jullie kanalen
        text: "Gasten filmen en delen de show. Ruwe beelden van onze cameradrone kosten {{offer.film.price}} en zijn bij {{offer.film.included}} inbegrepen."
        _key: k_5252e3279b65a4b9c3d3
      - icon: newspaper
        title: Een aanleiding voor publiciteit
        text: Onder andere ZDF, WDR, ntv en WAZ berichtten over ons en onze shows.
        _key: k_e552a7787fcc44b66b84
    todo: FlyingStars muss die genannten ZDF-/WDR-Berichte konkret belegen; für Reichweiten- oder Wirkungsaussagen fehlen messbare Projektergebnisse.
    _key: k_c6d958d0420f0a9ef33b
  - type: landingFlow
    id: freigabe
    kicker: Verloop
    headline: Van logo tot complete show.
    text: Er vliegt niets zonder jullie goedkeuring.
    steps:
      - title: Aanvraag en offerte
        text: Vertel ons datum, locatie en doel. We reageren binnen 48 uur en sturen na een kort gesprek een offerte.
        duration: Antwoord binnen 48 uur
        _key: k_195bdede45eea38fcdd2
        gate: false
      - title: Ontwerp
        text: Stuur ons jullie logo. Eerst zien jullie een 2D-ontwerp van de beelden.
        _key: k_49e43d30a4cf6e87e6d1
        gate: false
      - title: Animatie
        text: Daarna volgt een ruwe animatie met muziek. Vanaf HORIZON krijgen jullie een videopreview van de show.
        _key: k_321f6a3deb2b1ef07eea
        gate: false
      - title: Goedkeuring
        text: Pas nadat jullie elk beeld hebben goedgekeurd, programmeren we kleuren en lichteffecten op de muziek.
        gate: true
        _key: k_737c9a5473db3f88034c
      - title: Showdag
        text: Ons team is circa drie uur vooraf ter plaatse, zet de startzone af en vliegt de show.
        duration: ca. 3 uur opbouw
        _key: k_cdf27dbb327e5fcde319
        gate: false
    _key: k_a7152263e0461f67ead9
  - type: packages
    id: pakete
    kicker: Pakketten
    headline: Hoe uitgebreid mag jullie show zijn?
    text: Voor veel bedrijfsfeesten is een 2D-logo voldoende. Voor lanceringen met 3D-objecten en een verhaal passen HORIZON of ODYSSEY.
    compact: true
    items:
      - name: SPARK
        label: Klassiek in 2D
        _key: k_17eea920ec0491047a40
        highlight: false
      - name: HORIZON
        label: 3D in beweging
        badge: Bestseller
        highlight: true
        _key: k_b94e0363e3a39e7426c3
      - name: ODYSSEY
        label: 3D-show met verhaal
        _key: k_93070fc050069e397d62
        highlight: false
    note: Alle prijzen zijn exclusief btw en reiskosten
    cta:
      label: Alle diensten en prijzen
      href: /drohnenshow-preise/
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.
    _key: k_d26b138f665a8ac9c34d
  - type: landingTeaser
    id: logo
    kicker: Showconfigurator
    headline: Hoe ziet jullie *logo* er aan de hemel uit?
    text: Upload jullie logo in de configurator en bekijk het als droneformatie, met beelden van SPARK tot ODYSSEY.
    href: /drohnenshow-preise/?anlass=launch#konfigurator
    cta: Probeer jullie logo in de configurator
    loop: marke
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    _key: k_1f4f4d01bf5354a2a7ba
  - type: landingBento
    id: agenturen
    kicker: Bureaus
    headline: Jullie blijven het gezicht, wij leveren de show.
    lead:
      icon: sparkles
      title: Wij vliegen, *jullie stralen*.
      text: Jullie blijven vooraan bij jullie klanten. Jullie bepalen wat jullie zelf organiseren en wat wij overnemen.
    items:
      - icon: hat-glasses
        title: White label
        text: Op verzoek vliegen we anoniem. Jullie naam staat voorop, wij leveren de show.
        _key: k_b1193a740bb23e8ca935
      - icon: file-lock
        title: Vertrouwelijk
        text: We ondertekenen een geheimhoudingsovereenkomst.
        _key: k_0cf823404746a47edcf6
      - icon: thumbs-up
        title: Goedkeuring
        text: Voor de afstemming met jullie klanten visualiseren we de beelden met hun logo.
        _key: k_b4cd40f77c941c13df62
      - icon: clipboard-list
        title: Projectleiding
        text: Op verzoek verzorgen we de projectleiding, met vergunning, instanties en techniek ter plaatse.
        _key: k_3ae3ac2e616a3beabd1b
    closing:
      headline: Een project voor jullie klant?
      text: Vertel ons erover. We reageren binnen 48 uur en stemmen de rest vertrouwelijk met jullie af.
      button:
        label: Aanvragen als bureau
        href: /kontakt/?anlass=agentur
    _key: k_35809e7974828f33e234
  - type: landingSpotlight
    id: orte
    kicker: Locaties
    headline: We vliegen waar jullie publiek is.
    text: Met onze generieke exploitatievergunning kunnen we de meeste vlieglocaties zelf vrijgeven. Voor gecontroleerd luchtruim, locaties bij luchthavens en federale waterwegen regelen we de benodigde bijzondere vergunningen. Dat vraagt meer voorbereidingstijd.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
      alt: Droneformatie boven de skyline van Düsseldorf met de Rheinturm
      width: 1920
      height: 985
    tags:
      - {"_key":"k_eb49b6fefcd25aaa70f2","value":"Borussia-Park · Mönchengladbach"}
      - {"_key":"k_2f6e086ec17ff7347db1","value":"Olympiastadion · Berlijn"}
      - {"_key":"k_6c8c7c31c41910ea3274","value":"Rheinturm · Düsseldorf"}
      - {"_key":"k_051f63270e7a44e41b90","value":"Binnenhaven · Duisburg"}
    facts:
      - value: 4–8 weken
        label: bevestiging per EU-land
        _key: k_6ec398101306e49f60a4
      - value: ca. 3 maanden
        label: in Italië
        _key: k_6816b73b403f3db45756
    todo: FlyingStars muss aktuelle Cross-border-Fristen und mögliche Sondergebühren je Land bestätigen. Die Ortsbeispiele belegen keine pauschale Genehmigung oder garantierte Frist.
    _key: k_671ae5a30eb25ef1930d
    entries: []
  - type: landingSite
    id: standort
    kicker: Locatie
    headline: Is jullie locatie geschikt?
    text: Stuur ons het adres en de geplande positie van jullie publiek. Voordat we een offerte maken, beoordelen we of en hoe een show daar mogelijk is.
    variant: outdoor
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Moritz muss die Aufgabenliste für Markenshows freigeben.
    additionalResponsibilities:
      - task: Logo sturen en elk motief goedkeuren
        us: none
        you: full
        _key: k_f9022e9498a7fad0753a
      - task: Motieven ontwerpen en animeren
        us: full
        you: none
        _key: k_827a4c6b6a7c553bffad
