name: Cloudflare deploy
# Staging bis zum Hetzner-Umzug: jeder Stand auf main geht direkt auf Cloudflare Pages (1–2 min).
# Die volle Prüfung (ci.yml) läuft bei PRs und auf Abruf, nicht vor jeder Inhaltsänderung: Der Editor hat den Stand
# vor dem Hochladen schon lokal gebaut, und scheitert hier der Build, bleibt der bisherige Stand online.
# Ziel-URL: vars.SITE_URL (Produktionsbranch des Pages-Projekts ist main).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cloudflare-Konfiguration prüfen
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CF_PAGES_PROJECT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then echo "::error::Cloudflare-Konfiguration fehlt: $key"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm, registry-url: 'https://npm.pkg.github.com', scope: '@marc-viladrich' }
      - run: npm ci
        # Private editor package (GitHub Packages): classic token with read:packages only.
        env: { NODE_AUTH_TOKEN: '${{ secrets.PACKAGES_READ_TOKEN }}' }
      - run: npx astro build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      # Pages Functions (functions/) werden aus dem Repo-Root mitgebündelt.
      - name: Cloudflare Pages deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
