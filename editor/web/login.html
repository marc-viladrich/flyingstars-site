<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden · FlyingStars Editor</title>
    <link rel="stylesheet" href="/editor/editor.css">
    <style>
      .login-card label[for="remember"] { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; }
      #remember:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 3px; }
      #remember-hint { color: var(--ui-muted); }
    </style>
    <script type="module" src="/editor/login.js"></script>
  </head>
  <body id="login">
    <main id="login-card" class="login-card editor-ui">
      <p class="login-brand">FlyingStars</p>
      <h1>Anmelden</h1>
      <p class="login-lead">Zum Bearbeiten der Website.</p>
      <form id="login-form" action="/editor/api/login" method="post">
        <label for="username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label for="remember"><input id="remember" name="remember" type="checkbox" aria-describedby="remember-hint"> Angemeldet bleiben</label>
        <small id="remember-hint">Für 30 Tage, bei Nutzung automatisch verlängert. Nur auf einem eigenen Gerät aktivieren.</small>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button type="submit">Anmelden</button>
      </form>
      <noscript>Bitte JavaScript aktivieren, um sich anzumelden.</noscript>
    </main>
  </body>
</html>
