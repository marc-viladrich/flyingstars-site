  # Kopf über Text und Galerie, Moritz' Text links, daneben Logo-Shows großer Marken (Galerie „logos“, Runde 4: statt
  # des einzelnen dunklen Ford-Bilds); die schmale Galeriespalte steigt neben die Überschrift.
  - type: textMedia
    id: marketing
    kicker: Werbung und Marketing mit Drohnen
    headline: Euer Unternehmen auf der *größten Bühne* der Welt
    headAbove: true
    body: |-
      Das neue Produkt, von dessen Launch jede:r etwas mitbekommen soll. Das Werbevideo mit Wow-Effekt. Die Brand-Kampagne, die euer Logo wieder in den Köpfen einbrennt.

      Gemeinsam bauen wir eine individuelle Choreografie, die die Geschichte eurer Marke erzählt. Mehr als nur euer Logo, ein Claim oder euer Firmenname – sondern emotionales Storytelling, das verzaubert.

      Unsere Drohnenshows sind eine Alternative zum Feuerwerk, die noch kaum jemand kennt. Aufmerksamkeit garantiert, selbst aus Kilometern Entfernung.
    gallery: logos
    cta: { label: Show anfragen, href: "#anfrage" }
    _key: k_7abf894f6f4dfb7d5b8c

