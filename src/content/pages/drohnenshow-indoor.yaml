  - type: steps
    id: ablauf
    kicker: Ablauf
    headline: Ein etablierter Prozess
    ownNumbers: true
    steps:
      - { title: "#1 Anfrage", text: "Teilt ihr uns das Datum, den Ort und den Anlass mit, melden wir uns innerhalb von 48 Stunden mit Ideen zurück. Ein Erstgespräch ist der nächste Schritt, ein Vor-Ort-Termin selten nötig.", "_key": "k_bcd783da285c16316e38" }
      - { title: "#2 Planung", text: "Wir bauen Storyline und Motive. Gerne könnt ihr Wünsche einbringen. Wir kümmern uns zudem um alle Genehmigungen, ihr liefert nur die Zustimmung der Grundstückseigentümer:innen.", "_key": "k_1a7a9d6124366c37cbbf" }
      - { title: "#3 Showtag", text: "Während ihr eure Gäste betreut, bauen wir auf (dreieinhalb Stunden), führen die Show durch (fünf bis acht Minuten) und bauen geräuschlos wieder ab.", "_key": "k_2a47818390caa6ae1614" }
    _key: k_cca8a7702a948ca38dce

