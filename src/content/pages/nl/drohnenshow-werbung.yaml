  - type: textMedia
    id: marketing
    kicker: Reclame en marketing met drones
    headline: Jullie bedrijf op het *grootste podium* ter wereld
    body: |-
      Het nieuwe product waarvan iedereen de lancering moet meekrijgen. De reclamevideo met wow-effect. De merkcampagne die jullie logo weer in de hoofden brandt.

      Samen bouwen we een choreografie op maat die het verhaal van jullie merk vertelt. Meer dan alleen jullie logo, een claim of jullie bedrijfsnaam – emotionele storytelling die betovert.

      Onze droneshows zijn een alternatief voor vuurwerk dat nog bijna niemand kent. Aandacht gegarandeerd, zelfs van kilometers afstand.
    gallery: logos
    mediaSide: right
    headAbove: true
    cta:
      label: Show aanvragen
      href: "#anfrage"
    _key: k_7abf894f6f4dfb7d5b8c
  - type: steps
    id: komplettpaket
    kicker: Totaalpakket
    headline: Alles erin voor jullie marketing
    text: Van idee tot applaus begeleiden we jullie bij de hele planning en uitvoering.
    steps:
      - title: Techniek
        text: Wij leveren hardware, software en lichtdrones.
        icon: cpu
        _key: k_af05b8945c8be9debc06
      - title: Muziek
        text: Laat de drones dansen op jullie playlist.
        icon: music
        _key: k_6fde2934223b459a104b
      - title: Promotiemateriaal
        text: Op verzoek maken we foto's en filmopnamen.
        icon: camera
        _key: k_b70646235e480f243d27
      - title: Vergunningen
        text: Wij nemen de complete bureaucratie over.
        icon: file-badge
        _key: k_a6468dcb0adc9a4e3750
      - title: Veiligheid
        text: LBA- en EASA-gecertificeerd, aansprakelijkheidsverzekering tot € 1,3 mln.
        icon: shield-check
        _key: k_9730a94aee3b6c9a4cd7
      - title: Snelheid
        text: Planning in minder dan twee weken mogelijk.
        icon: timer
        _key: k_d8f5a13e0b38775b6e79
      - title: Internationaal
        text: In Duitsland, Europa en wereldwijd
        icon: globe
        _key: k_763f57501b2e5cc8475e
    cta:
      label: Show aanvragen
      href: "#anfrage"
    surface: alt
    ownNumbers: false
    _key: k_5fce2f823d9e547c9f3a
  - type: landingBento
    id: agenturen
    kicker: Voordelen
    headline: Onze ervaring uit 150+ B2B-shows
    lead:
      title: Wij vliegen, *jullie schitteren*
      text: We tekenen graag NDA's voor jullie reclame- of marketingbureau.
      icon: sparkles
    items:
      - icon: thumbs-up
        title: Merkveilig
        text: Jullie keuren alle motieven goed en houden zo de controle over jullie merk.
        _key: k_fbb4c3639f44f4ea8804
      - icon: chart-line
        title: KPI-gericht
        text: "De resultaten tellen: we werken met jullie samen om succes te meten."
        _key: k_cee3e178d47544d71e22
    closing:
      headline: Een project voor jullie klant?
      text: Vertel ons erover. We reageren binnen 48 uur en stemmen de rest vertrouwelijk met jullie af.
      button:
        label: Aanvragen als bureau
        href: /kontakt/?anlass=agenturen
    _key: k_35809e7974828f33e234
