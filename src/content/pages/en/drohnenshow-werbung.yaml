    id: ueber
    kicker: About FlyingStars
    todo: FlyingStars muss ein Teamfoto liefern; eine Presseseite für „In der Presse“ fehlt.
    note: "As seen on: ZDF, WDR, NTV, WAZ"
    cta:
      label: About us
      href: /ueber-uns/
    secondary:
      label: In the press
      href: "#marken"
    headline: After 150+ shows, still like the *very first time*
    text: Most people are seeing a drone show for the first time. It is our job to sweep them off their feet! That is why, since 2021, we have been staging performances that stay long in the mind and deep in the heart.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
