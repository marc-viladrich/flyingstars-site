  - type: steps
    id: ablauf
    kicker: Ablauf
    headline: Von der Idee bis zur Landung.
    text: Du bist so viel oder so wenig eingebunden, wie du möchtest. Wir kommen mit
      Lösungen, nicht mit Problemen.
    steps:
      - title: Anfrage
        text: Erzähl uns Datum, Ort und Anlass. Wir melden uns innerhalb von 48 Stunden
          – meist deutlich schneller.
        duration: 48 h Antwortzeit
      - title: Standort & Angebot
        text: Wir prüfen den Showbereich von rund 100 × 100 Metern und schicken dir ein
          Festpreis-Angebot, das du online annimmst.
        duration: Festpreis
      - title: Genehmigung
        text: Wir holen alle luftrechtlichen Genehmigungen ein. Von dir brauchen wir nur
          die Zustimmung der Grundstückseigentümer:innen.
        duration: LBA · EASA
      - title: Design
        text: "Motive, Storyline und Musik entwickeln wir gemeinsam: erst als
          Rohanimation, dann mit Farben und Lichteffekten im Takt."
        duration: Entwürfe & Feedback
      - title: Showtag
        text: Rund drei Stunden Aufbau, ein Team aus Pilot:innen und Techniker:innen vor
          Ort – du genießt mit deinen Gästen.
        duration: ca. 3 h Aufbau
  - type: comparison
    id: vergleich
    kicker: Ehrlicher Vergleich
    headline: Drohne, Feuerwerk oder Laser?
    text: Jede Technik hat ihre Stärken. Hier siehst du, wann eine Drohnenshow die
      beste Wahl ist – und wann nicht.
    rowHeader: Kriterium
    columns:
