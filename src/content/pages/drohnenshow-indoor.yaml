      - { task: "Indoor-Drohnen, Positionierungstechnik und Team", us: full, you: none, "_key": "k_ad5f7a3b6c6ebdc8f165" }
      - { task: "Grundriss mit Maßen und Deckenhöhe schicken", us: none, you: full, "_key": "k_bf45eb6771550598d8e2" }
      - { task: "Freie, ebene Start- und Flugfläche bereitstellen", us: none, you: full, "_key": "k_9ca1677c1a9556085ebf" }
      - { task: "Stromanschluss in der Nähe bereitstellen", us: part, you: full, hint: "wir stimmen ab", "_key": "k_90cf1d512c775430202a" }
    download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }
