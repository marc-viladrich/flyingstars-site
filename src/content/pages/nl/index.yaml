  - type: steps
    id: darum
    kicker: Darum FlyingStars
    headline: Gut zu wissen
    _key: k_92d0a7f1633ea84ff104
    steps:
      - title: Komplett
        text: "Vom Design über die Genehmigung bis zur Flotte und Sicherheit: Bei uns bekommt ihr alles aus einer Hand von einem eingespielten Team."
        _key: k_4161b97d77cfdcb1c686
      - title: Schnell
        text: Wir ermöglichen Shows auch in ein bis zwei Wochen. Als autorisierter Betreiber dürfen wir viele Genehmigungsprozesse überspringen.
        _key: k_e8d0aa1d372af5e42c97
      - title: International
        text: Wir fliegen in Deutschland, Österreich und der Schweiz – und dank umfassender Genehmigungen auch schnell in der EU und weltweit.
        _key: k_c8740dc80d6854f37ae5
    ownNumbers: true
  - type: textMedia
    id: sicherheit
    kicker: Sicherheit
    headline: Damit alles rund fliegt
    _key: k_80f57143a3d7d816104c
    todo: FlyingStars muss die Website-Angabe Windstärke 5 mit den Windgrenzen der AGB abstimmen.
    body: |-
      Damit ihr die Aufführung sorglos genießen könnt, arbeiten wir nach höchsten Sicherheitsstandards. Wir kümmern uns um alle Genehmigungen, sichern den Flugbereich von 100 x 100 Metern und stellen gerne Ordner:innen.
    
      - Zertifiziert nach Luftfahrt-Bundesamt (LBA) und EU Aviation Safety (EASA)
      - Haftpflicht bis 1,3 Mio. € in jedem Paket schützt euch bei Schäden
      - Shows können bis Windstärke 5 und Nieselregen stattfinden
    mediaSide: right
    cta:
      label: Das brauchen wir von euch
      href: /faq/#planung
  - type: textMedia
    id: nachhaltigkeit
    kicker: Duurzaamheid
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom und das TÜV-Nord-Schallschutzgutachten bereithalten.
    _key: k_001c02ae39915e989410
    headline: Geen knallen. Geen rook. Geen afval.
    body: |-
      Bei unseren Drohnen-Veranstaltungen sind auch Hunde und Kinder herzlich willkommen: Sie sind abfallfrei, lokal emissionsfrei und surren leiser als Feuerwerke. Mit Shows für die Deutsche Umwelthilfe und Kein Bock auf Nazis setzen wir zudem regelmäßig ökologische und soziale Zeichen in den Himmel.
    
      - Kein Knall: Der TÜV NORD bestätigt den Schallschutz unserer Technik.
      - Kein Müll: Wiederverwendbare Drohnen, geladen mit 100 % Ökostrom.
      - Kein Rauch: Vor Ort entstehen keine schädlichen Emissionen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: "Bunte Feuerwerksblüte aus Drohnen über Berlin bei der Kampagne #Böllerciao der Deutschen Umwelthilfe"
      width: 1920
      height: 987
    mediaSide: right
    cta:
      label: Über die Nachhaltigkeit
      href: /ueber-uns/#nachhaltigkeit
  - type: steps
    id: ablauf
    kicker: Het verloop in cijfers
    headline: Van aanvraag tot showavond.
    _key: k_22cad4004e6677e22092
    steps:
      - title: "#1 Anfrage"
        text: Sagt uns Datum, Ort und Anlass. In spätestens 48 Stunden geben wir euch eine Einschätzung. Nach dem Erstgespräch erhaltet ihr das Angebot, eine Begehung ist selten notwendig.
        _key: k_07593dae179ab85954fb
      - title: "#2 Planung"
        text: Gemeinsam entwickeln wir Storyline, Motive und Musik. Ihr seid so viel eingebunden, wie ihr möchtet. Mit Zustimmung der Grundstückseigentümer:innen holen wir alle Genehmigungen ein.
        _key: k_8712fd69e4210fc7f3f1
      - title: "#3 Showtag"
        text: Wir organisieren Sicherheit, Aufbau und Abbau ab rund dreieinhalb Stunden vor der Show. Das Spektakel dauert bis zu 25 Minuten. Ihr genießt mit euren Gästen.
        _key: k_002bb2a1e4204dd1d7d4
    ownNumbers: true
  - type: landingTeaser
    id: preise
    kicker: Showconfigurator
    headline: Stel jullie show *zelf* samen.
    text: "Van een hart tot een maanlanding, met 100 tot 1000 drones. In de configurator zien jullie wat bij de gelegenheid past."
    todo: "FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan."
