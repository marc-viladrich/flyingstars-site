  - type: landingTeaser
    id: preise
    kicker: Prijzen
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan. Paketgrenzen und Preisstruktur 2027 sind noch offen.
    headline: Stel *jullie show* samen
    text: Begin met onze basispakketten en vul ze aan met meer drones, meer maatwerk, meer spektakel. Altijd als vast pakket zonder verrassingen.
    href: /drohnenshow-preise/?anlass=launch#konfigurator
