# Meilensteine als ruhige Timeline. Inhalte aus Elevate, Fakten aus Fragebogen (21.10.) und Moritz' Notizen (30.10.).
# Thomas (freier Designer) wird laut Notizen nicht genannt; Bürohund Chopper darf vorkommen.
# Offen: VW Golf 350 (Fragebogen) oder 400 Drohnen (Notizen), deshalb ohne Zahl; E.ON 15.09. oder 15./16.09., deshalb „im September“.
title: Über uns
description: "FlyingStars aus dem Ruhrgebiet: Team, Geschichte und Meilensteine. 178 Shows seit 2022, eigenes Design-Team, eigene Flotte, Büro auf Zollverein."
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: hero
    kicker: Über uns
    headline: Ein Team aus dem Ruhrgebiet, das den *Nachthimmel* bespielt.
    text: Ronja, Florian und Erwin führen FlyingStars gemeinsam, mit einem kleinen Team aus dem Ruhrgebiet. Wir entwerfen Drohnenshows, holen die Genehmigungen ein und fliegen sie mit unserer eigenen Flotte. Unser Büro ist im Triple Z auf Zeche Zollverein in Essen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: Weltkugel aus Drohnen über dem Rhein bei der Extraschicht in Duisburg
      width: 2544
      height: 1493
    cta: { label: Show anfragen, href: /kontakt/ }
    secondary: { label: Unsere Meilensteine, href: "#meilensteine" }

  - type: team
    id: team
    kicker: Team
    headline: Die Menschen hinter den Shows.
    text: Ihr erreicht uns als Team, und am Showabend stehen wir selbst mit auf dem Feld.
    members:
      - name: Ronja Donsbach
        role: Geschäftsführerin
        bio: Beantwortet die meisten Anfragen und stimmt Design und Musik mit Partner:innen ab. Auch auf Englisch.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Ronja_Teamfoto.jpg", alt: Ronja Donsbach mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Florian Becker
        role: Geschäftsführer
        bio: Verwaltung, Personal und Kund:innen in Deutschland. Schreibt unseren Blog.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Florian_Teamfoto.jpg", alt: Florian Becker mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Erwin Wilms
        role: Geschäftsführer
        bio: Anträge, Behörden und Luftfahrtrecht. Sorgt dafür, dass eure Show fliegen darf. Auch auf Englisch.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Erwin_Teamfoto.jpg", alt: Erwin Wilms mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Patrick
        role: Head of Technik
        bio: Flotte, Verfügbarkeit, Einkauf und das technische Setup jeder Show.
      - name: Alejandro
        role: Head of Design
        bio: Entwirft unsere Shows und ihre Choreografien.
      - name: Chopper
        role: Bürohund
        bio: Neu im Team.
    note: Dazu kommen rund zehn Aushilfen, die mit uns aufbauen, absichern und wieder abbauen.
    cta: { label: Lernt uns kennen, href: /kontakt/ }

  - type: textMedia
    kicker: Geschichte
    headline: Wie FlyingStars angefangen hat.
    body: |
      FlyingStars begann als Corona-Projekt. In Asien gab es damals schon viele große Drohnenshows, in Europa noch nicht. Wir wollten wissen, warum, und haben angefangen zu tüfteln. Am 1. Dezember 2021 haben wir das Gewerbe angemeldet.

      Unsere erste Show flogen wir am 13. August 2022, zu einem privaten Geburtstag mit 50 Drohnen. Im selben Jahr kamen sieben weitere dazu. Seitdem sind es 178 Shows geworden, für Marken, Städte, Festivals und Paare.

      Unser Sitz ist in Gelsenkirchen. Gearbeitet wird im Triple Z, dem Gründungszentrum auf Zeche Zollverein in Essen. Dort könnt ihr uns auch besuchen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: Kreis aus bunten Drohnen über Berlin, Zuschauer:innen filmen die Show mit dem Handy
      width: 1920
      height: 987
    mediaSide: right

  - type: timeline
    id: meilensteine
    kicker: Meilensteine
    headline: Meilensteine.
    text: Von 50 Drohnen auf einem Geburtstag bis zu 600 Drohnen in einem Musical.
    items:
      - { when: "2021", title: Gründung, text: Am 1. Dezember melden wir FlyingStars als Gewerbe an. }
      - { when: "2022", title: Die erste Show, text: Am 13. August fliegen 50 Drohnen zu einem privaten Geburtstag. }
      - { when: "2022", title: PUMA im Borussia-Park, text: "Am 11. November, unsere sechste Show. 100 Drohnen vor dem Derby Gladbach gegen Dortmund, die Anfrage kam etwa 14 Tage vorher." }
      - { when: "2023", title: Die erste generische Betriebsgenehmigung in Deutschland, text: Im Juli erteilt uns das Luftfahrt-Bundesamt die Genehmigung. Seitdem können wir die meisten Flugorte selbst freigeben. }
      - { when: "2023", title: L’Oréal × Prada Paradoxe, text: Am 11. Oktober 350 Drohnen am Rheinturm in Düsseldorf. }
      - { when: "2023", title: "#Böllerciao mit der Deutschen Umwelthilfe", text: "Am 27. November 150 Drohnen im Berliner Cantianstadion, vor Presse, Politik und Öffentlichkeit." }
      - { when: "2023", title: Einzug ins Triple Z, text: Im Dezember beziehen wir unser Büro im Gründungszentrum auf Zeche Zollverein. }
      - { when: "2024", title: 50 Jahre VW Golf, text: Am 22. Mai an der Scalaria am Wolfgangsee. Lange unsere größte Show. }
      - { when: "2025", title: Die erste Indoor-Show, text: Am 28. März für Siemens auf der Hannover Messe. }
      - { when: "2025", title: Kein Bock auf Nazis, text: "Am 8. August. Seitdem fliegen wir regelmäßig Shows für Demokratie, Vielfalt und Zusammenhalt." }
      - { when: "2026", title: Bokkenrijders in Maastricht, text: Im Juni 20 Shows mit je 600 Drohnen in einem Musical. 12.000 Drohnen in einem Monat. }
      - { when: "2026", title: E.ON in Hamburg, text: Im September eine Doppelshow mit 500 Drohnen über der Elbe an den Landungsbrücken. }
      - { when: "2026", title: Indoor im Triple Z, text: "Im September eine Indoor-Show im Gründungszentrum, in dem auch unser Büro ist." }

  - type: textMedia
    kicker: Aus einer Hand
    headline: Design, Genehmigung und Flotte in einer Hand.
    body: |
      Die wichtigen Teile einer Show liegen bei uns. Das hält die Wege kurz, auch wenn es eilt.

      - **Design:** Unser Design-Team entwirft jede Show für ihren Anlass. Ihr seht Entwürfe und gebt jedes Motiv frei.
      - **Genehmigung:** Unsere Betriebsgenehmigung des Luftfahrt-Bundesamts war die erste generische in Deutschland. Dank ihr können wir die meisten Flugorte selbst freigeben. Weitere Anträge, etwa bei der Deutschen Flugsicherung, stellen wir selbst.
      - **Flotte:** Geflogen wird mit unseren eigenen Drohnen. Patrick hält sie startklar und plant, welche Drohnen wann wo fliegen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
      alt: Volkswagen-Logo aus Drohnen über dem Wolfgangsee, Gäste filmen von einer Terrasse
      width: 1920
      height: 1281
    mediaSide: left

  - type: metrics
    id: sicherheit
    kicker: Sicherheit
    headline: So planen wir Sicherheit.
    text: Leichte Drohnen, ein abgesperrter Bereich und Systeme, die sich gegenseitig absichern.
    items:
      - { label: Gewicht, value: ca. 300 g, text: So viel wiegt eine Showdrohne. }
      - { label: Sicherheitsbereich, value: 100 × 100 m, text: Während der Show hält sich hier niemand auf. Ein Geofence begrenzt den Flug. }
      - { label: Systeme, value: Mehrfach abgesichert, text: "Automatische und manuelle Systeme überwachen jeden Flug. Fällt eine Drohne aus, fliegt sie meist zurück oder landet im Sicherheitsbereich." }
      - { label: Haftpflicht, value: "bis 1,3 Mio. €", text: In jedem Paket enthalten. }
      - { label: Flughöhe, value: bis 120 m, text: So hoch fliegen wir in der Regel. }
      - { label: Kameras, value: Keine, text: Unsere Showdrohnen filmen nicht. }

  - type: sustainability
    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Leise, ohne Rauch und ohne Müll vor Ort.
    text: Nachhaltigkeit ist der Grund, aus dem wir FlyingStars gegründet haben. Wir denken sie bei jeder Entscheidung mit.
    points:
      - Vor Ort entstehen kein Feinstaub, kein Müll und kein Knall. Laut ist nur die Musik.
      - Unsere Akkus laden wir mit 100 % Ökostrom von naturstrom.
      - Die Drohnen wiegen rund 300 Gramm und werden in der EU gebaut, bei Drotek SAS in Frankreich.
      - Akkus, Motoren und Rotoren lassen sich einzeln tauschen.
      - Zu den Shows fahren wir mit einem elektrischen Ford E-Transit.
      - Den Schallschutz unserer Shows hat der TÜV Nord in einem Gutachten untersucht.

  - type: metrics
    id: zahlen
    kicker: In Zahlen
    headline: In Zahlen.
    text: Stand 21. Oktober 2026.
    items:
      - { label: Shows, value: "178", text: Seit der ersten Show im August 2022. In diesem Jahr waren es bis Oktober 50. }
