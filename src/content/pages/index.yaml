  # Einspaltig ohne Bild: rechts neben dem Text erscheint später ein Schwarm (Himmel-Agent)
  - type: textMedia
    id: warum-drohnen
    kicker: Individuelle Drohnenshows
    headline: Feuerwerk? War gestern
    body: |-
      Willkommen in der Zukunft der Unterhaltung. Drohnen-Lichtshows sind die Alternative für Gäste, die sich an Pyrotechnik sattgesehen haben.

      Sie sind spektakulärer: 3D statt 2D, kilometerweit sichtbar, bisher kaum bekannt – Aufmerksamkeit garantiert. Emotionaler: Böller knallen. Drohnenshows erzählen Geschichten, die begeistern bis berühren. Und einzigartiger: Aus 100 bis 1000+ Leuchtpixeln können wir fast jedes Motiv bauen.

      Wie sieht eure Geschichte in den Himmel gezeichnet aus? Finden wir es heraus!
    cta: { label: Drohnenshow planen, href: /drohnenshow-preise/ }
    _key: k_55390b5c7d73f75ab4f2

