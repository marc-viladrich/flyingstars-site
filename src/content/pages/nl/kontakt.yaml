title: Vraag een show aan
description: Vertel FlyingStars jullie datum, locatie en gelegenheid. We reageren binnen 48 uur per e-mail,
  telefoon, WhatsApp of videogesprek.
sections:
  - type: contactForm
    kicker: Aanvraag
    headline: Vertel ons over jullie datum.
    text: Datum, locatie en gelegenheid zijn genoeg voor een eerste inschatting. Laat open wat jullie nog niet
      weten. Versturen is nog geen boeking.
  - type: steps
    id: danach
    kicker: Verloop
    headline: In vier stappen naar jullie show.
    steps:
      - title: Antwoord
        text: We antwoorden binnen 48 uur per e-mail, met vragen of een eerste inschatting.
        duration: 48 h
      - title: Eerste gesprek
        text: In een kort telefoon- of videogesprek bespreken we locatie, beelden en omvang.
      - title: Offerte
        text: Jullie ontvangen een schriftelijke offerte. Bij de boeking betalen jullie 40% aan.
      - title: Planning
        text: We controleren de locatie, regelen de vergunning en ontwerpen de show samen met jullie.
  - type: textMedia
    kicker: Contact
    headline: Liever direct praten?
    body: >
      Achter elk contactkanaal staat hetzelfde team: Ronja, Florian en Erwin.


      **Telefoon:** [0209 883 065 62](tel:+4920988306562)<br>

      **Mobiel en WhatsApp:** [01579 260 86 72](tel:+4915792608672), [schrijf via
      WhatsApp](https://wa.me/4915792608672)<br>

      **E-mail:** [team@flyingstars.art](mailto:team@flyingstars.art)<br>

      **Videogesprek:** [plan een afspraak via Calendly](https://calendly.com/team-flyingstars/beratung)


      **Bezoek:** Triple Z, Gründungszentrum Zeche Zollverein, Katernberger Str. 107, 45327 Essen. Meld jullie
      vooraf even aan.


      **Post:** FlyingStars GmbH, Bulmker Straße 107, 45888 Gelsenkirchen
