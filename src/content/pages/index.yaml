  - type: occasions
    id: anlaesse
    kicker: Anlässe
    headline: Für jeden Anlass die passende Show.
    text: "Ob Produktlaunch, Stadtfest oder Heiratsantrag: Wir entwickeln jede Show
      für ihr Publikum – und übernehmen alles, was dafür nötig ist."
    cards:
      - category: Firmen & Marken
        title: Deine Marke auf der größten Leinwand der Welt
        text: Logos, Claims und Produkte, präzise in den Nachthimmel gezeichnet – für
          Kund:innen, Mitarbeitende und die Kamera.
        image:
