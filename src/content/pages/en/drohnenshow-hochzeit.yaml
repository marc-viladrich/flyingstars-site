  - type: landingTeaser
    id: choreografie
    kicker: Bespoke choreography
    headline: As unique as your *love story*
    text: A swarm of shining light-show drones draws your initials, vows of love and in-jokes across the sky. Set to music and tailored to your wishes.
    href: /drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator
    cta: See motifs in the configurator
    loop: hochzeit
    _key: k_52056666f5076b5e0423
  - type: sustainability
    id: familienfreundlich
    kicker: Family-friendly
    headline: Children and *dogs* welcome
    text: Unlike fireworks, a drone ballet has no loud bang, no bothersome smoke and no fire-risk debris. Just a soft hum – and your guests' amazement.
    _key: k_59a09168d2946ce16e34
    scene: chopper-play
  - type: landingBento
    id: vorteile
    kicker: Advantages
    headline: Our promises
    lead:
      title: All-inclusive
      text: "Design, music, show, permits: we take everything off your hands, all from a single source."
      icon: heart-handshake
    items:
      - icon: globe
        title: International
        text: "Wherever you celebrate, we'll be there: in Germany, Austria, Switzerland or anywhere in the world."
        _key: k_f070569c03c9b4b11034
      - icon: shield-check
        title: Safe
        text: We are LBA and EASA certified and provide a 100 x 100 metre safety zone.
        _key: k_85e68777aa937b3e85b1
    _key: k_9d2cf9c04b90b456039c
  - type: landingRefs
    id: referenzen
    kicker: References
    headline: Nights we will *never forget*
    projects:
      - heiratsantrag-hugenpoet
      - hochzeit-recklinghausen
    cards:
      - ref: heiratsantrag-hugenpoet
        title: Proposal in Essen
        kicker: She said yes!
        text: With 220 drones, we helped our client Armin win over his Berina. Accompanied by a violinist, we wrapped the sky above Schloss Hugenpoet in delicate white.
        _key: k_1cd45074068daabdd5a2
      - ref: hochzeit-recklinghausen
        title: Wedding in Recklinghausen
        kicker: A surprise for the bride and groom
        text: Veronika and Felix were amazed when their love story suddenly lit up above them. At the family's request, we prepared the choreography in secret.
        _key: k_0df1ee61f7ea5938057b
    _key: k_6500b76af74b7dd741ca
  - type: landingPrice
    id: preise
    kicker: Costs
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.
    headline: Put *your show* together
    text: Our drone shows start at €7,900 (net) plus travel. You can tailor your package with more drones, customisation and extras such as photos or videos of the performance.
    package: SPARK
