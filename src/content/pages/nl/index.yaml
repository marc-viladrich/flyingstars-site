  - type: tempo
    id: ablauf
    kicker: Verloop
    headline: Van idee tot *applaus*
    marks:
      - value: 48 u
        label: "#1 Aanvraag"
        text: Vertel ons datum, locatie en gelegenheid. Binnen uiterlijk 48 uur geven we jullie een inschatting. Na het eerste gesprek ontvangen jullie de offerte; een bezichtiging is zelden nodig.
        _key: k_07593dae179ab85954fb
      - value: 1–2 weken
        label: "#2 Planning"
        text: Samen ontwikkelen we verhaallijn, motieven en muziek. Jullie zijn zo betrokken als jullie willen. Met toestemming van de grondeigenaren regelen wij alle vergunningen.
        _key: k_8712fd69e4210fc7f3f1
      - value: 3,5 u
        label: "#3 Showdag"
        text: We regelen veiligheid, opbouw en afbouw vanaf zo'n drieënhalf uur voor de show. Het spektakel duurt tot 25 minuten. Jullie genieten samen met jullie gasten.
        _key: k_002bb2a1e4204dd1d7d4
      - value: 25 min
        label: Applaus
        _key: k_3c30dd0af9bfae6075dc
    facts: []
    _key: k_22cad4004e6677e22092
