title: "Over FlyingStars: team, missie en mijlpalen"
description: Leer onze visie en de mensen erachter kennen ✓ 150+ droneshows over de hele wereld ☎︎ {{contact.phone.international}}
noindex: false
image: /media/wordpress/b434bb6c604ab3d7eabf6d4819ee32c0b19e737e4f04ee8d0c1e8bb234a51cb6.jpg
sections:
  - type: landingHero
    todo: "FlyingStars muss ein freigegebenes Teamfoto liefern (Moritz' Platzhalter #Teamfoto); bis dahin läuft hier das Showreel."
    kicker: Over FlyingStars
    headline: We *betoveren* gasten met jullie verhaal
    text: Mensen vermaken, emoties oproepen en bijblijven. We willen laten zien dat dat ook zonder knallen, afval en rook kan. Daarom vliegen we sinds 2021 meer dan 150 magische droneshows voor tienduizenden bezoekers.
    cta:
      label: Leer ons kennen
      href: "#team"
    video: showreel
    poster:
      src: /media/wordpress/bd7b6e3cd83847cc488f898689263fe67b53185b77d01fe51b466fa929afb809.jpg
      alt: Droneformatie boven de skyline van Düsseldorf met de Rheinturm
      width: 1600
      height: 900
    facts:
      - value: "2021"
        label: opgericht
        _key: k_07f319e4f08e855ed3c2
      - value: 150+
