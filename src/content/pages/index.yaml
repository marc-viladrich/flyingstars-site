  # show-duration.json), danach der Applaus: das Label sagt beides (Marc, 17.11.2026: Dauer plus „Applaus“ war missverständlich).
  - type: tempo
    id: ablauf
    kicker: Ablauf
    headline: Von der Idee bis zum *Applaus*
    marks:
      - { value: 48 h, label: "#1 Anfrage", text: "Sagt uns Datum, Ort und Anlass. In spätestens 48 Stunden geben wir euch eine Einschätzung. Nach dem Erstgespräch erhaltet ihr das Angebot, eine Begehung ist selten notwendig.", "_key": "k_07593dae179ab85954fb" }
      - { value: 1–2 Wochen, label: "#2 Planung", text: "Gemeinsam entwickeln wir Storyline, Motive und Musik. Ihr seid so viel eingebunden, wie ihr möchtet. Mit Zustimmung der Grundstückseigentümer:innen holen wir alle Genehmigungen ein.", "_key": "k_8712fd69e4210fc7f3f1" }
