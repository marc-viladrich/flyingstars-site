    headline: Na 150+ shows nog altijd als de *eerste keer*
    text: De meeste mensen zien voor het eerst een droneshow. Het is onze taak om ze mee te slepen! Daarom verzorgen we sinds 2021 voorstellingen die lang in het hoofd en diep in het hart blijven.
