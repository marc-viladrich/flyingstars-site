    todo: FlyingStars muss die Website-Angabe Windstärke 5 mit den Windgrenzen der AGB abstimmen, die Startflächen je Drohnenzahl bestätigen und schriftliche Nutzungsfreigaben für LBA-, EASA- und naturstrom-Logos liefern.
    headline: Zodat alles soepel *vliegt*
    text: Zodat jullie zorgeloos van de voorstelling kunnen genieten, werken we volgens de hoogste veiligheidsnormen. We regelen alle vergunningen, beveiligen het vlieggebied van 100 x 100 meter en zorgen graag voor stewards.
