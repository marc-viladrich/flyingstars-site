name: Deploy
# Der EINZIGE host-spezifische Workflow. Hosting wechseln = Job "upload" austauschen,
# alles davor (Build-Artefakt) bleibt gleich. Varianten für IONOS/Dokploy/rsync in README.md.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx astro build
        env:
          SITE_URL: ${{ github.event_name == 'push' && vars.SITE_URL || vars.PREVIEW_URL || 'https://example.invalid' }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/, retention-days: 7 }

  # --- HOST-SPEZIFISCH: Cloudflare Pages (Direct Upload) ------------------------------
  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Cloudflare-Konfiguration prüfen
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CF_PAGES_PROJECT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Cloudflare-Konfiguration fehlt: $key"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v6   # für functions/ (Pages Functions werden aus dem Repo mitgebündelt)
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Cloudflare Pages deploy
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
      - name: Preview-URL in den PR schreiben
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.cf.outputs.deployment-url }}`;
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n**Preview:** ${url}\n\nGebaut aus \`${context.payload.pull_request.head.sha.slice(0,7)}\`. Freigabe = Merge.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  # --- ENDE HOST-SPEZIFISCH -------------------------------------------------------------
