  - type: textMedia
    id: warum-drohnen
    kicker: Droneshows op maat
    headline: Vuurwerk? Dat was gisteren
    cta:
      label: Droneshow plannen
      href: /drohnenshow-preise/
    _key: k_55390b5c7d73f75ab4f2
    body: "Welkom in de toekomst van entertainment. Dronelichtshows zijn het alternatief voor gasten die pyrotechniek wel gezien hebben.\n\nZe zijn spectaculairder: 3D in plaats van 2D, kilometers ver zichtbaar, nog nauwelijks bekend – aandacht gegarandeerd. Emotioneler: knallers knallen. Droneshows vertellen verhalen die enthousiast maken en raken. En unieker: met 100 tot 1000+ lichtpixels kunnen we bijna elk motief bouwen.\n\nHoe ziet jullie verhaal eruit, getekend aan de hemel? Laten we het ontdekken!"
    mediaSide: right
  - type: landingRefs
    id: projekte
    kicker: Referenties
    headline: Nachten die we nooit vergeten
    text: "Sinds 2021 vliegen we jaarlijks meer dan 30 shows, in totaal meer dan 150."
    todo: "Für E.ON (Hamburg, 2026) fehlen Showbild, genaues Datum und eine Fallstudie."
    _key: k_c25f10c971a03e70f6ba
    cta:
      label: Ontdek meer
      href: /referenzen/
    projects:
      - musikalischer-teaser-bokkenrijders
      - eon-hamburg
      - boellerciao
      - hochzeit-recklinghausen
    cards:
      - ref: musikalischer-teaser-bokkenrijders
        title: "Bokkenrijders: 20 musicals"
        kicker: Concert – Maastricht – 600 drones
        _key: k_2ef60090e51cf375bec9
      - ref: eon-hamburg
        title: "E.ON: The Future is Now"
        kicker: Marketing – Hamburg – 500 drones
        _key: k_ef262c704d79d8f32e03
      - ref: boellerciao
        title: "Umwelthilfe: #BÖLLERCIAO"
        kicker: Goed doel – Berlijn – 150 drones
        _key: k_2e558b9c482302e73d70
      - ref: hochzeit-recklinghausen
        title: "Bruiloft: Veronika & Felix"
        kicker: Privé – Recklinghausen – 150 drones
        _key: k_919446ff3fbd624a8349
  - type: steps
    id: darum
    kicker: Waarom FlyingStars
    headline: Goed om te weten
    _key: k_92d0a7f1633ea84ff104
    steps:
      - title: Compleet
        text: "Van ontwerp en vergunning tot vloot en veiligheid: bij ons krijgen jullie alles uit één hand, van een goed op elkaar ingespeeld team."
        _key: k_4161b97d77cfdcb1c686
      - title: Snel
        text: We maken shows ook binnen één tot twee weken mogelijk. Als geautoriseerde operator mogen we veel vergunningsprocedures overslaan.
        _key: k_e8d0aa1d372af5e42c97
      - title: Internationaal
        text: "We vliegen in Duitsland, Oostenrijk en Zwitserland – en dankzij uitgebreide vergunningen ook snel in de EU en wereldwijd."
        _key: k_c8740dc80d6854f37ae5
    ownNumbers: true
  - type: textMedia
    id: sicherheit
    kicker: Veiligheid
    headline: Zodat alles soepel vliegt
    _key: k_80f57143a3d7d816104c
    todo: FlyingStars muss die Website-Angabe Windstärke 5 mit den Windgrenzen der AGB abstimmen.
    body: "Zodat jullie zorgeloos van de voorstelling kunnen genieten, werken we volgens de hoogste veiligheidsnormen. We regelen alle vergunningen, beveiligen het vlieggebied van 100 x 100 meter en zorgen graag voor stewards.\n\n- Gecertificeerd door het Duitse Luftfahrt-Bundesamt (LBA) en het EU-agentschap voor de veiligheid van de luchtvaart (EASA)\n- Aansprakelijkheidsverzekering tot € 1,3 mln. in elk pakket beschermt jullie bij schade\n- Shows kunnen doorgaan tot windkracht 5 en bij motregen"
    mediaSide: right
    cta:
      label: Dit hebben we van jullie nodig
      href: /faq/#planung
  - type: textMedia
    id: nachhaltigkeit
    kicker: Duurzaamheid
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom und das TÜV-Nord-Schallschutzgutachten bereithalten.
    _key: k_001c02ae39915e989410
    headline: Geen knal. Geen afval. Geen rook.
    body: "Ook honden en kinderen zijn van harte welkom bij onze drone-evenementen: ze zijn afvalvrij, lokaal emissievrij en zoemen zachter dan vuurwerk. Met shows voor de Deutsche Umwelthilfe en Kein Bock auf Nazis zetten we bovendien regelmatig ecologische en sociale signalen aan de hemel.\n\n- Geen knal: TÜV NORD bevestigt de geluidsbescherming van onze techniek.\n- Geen afval: herbruikbare drones, opgeladen met 100% groene stroom.\n- Geen rook: ter plaatse ontstaan geen schadelijke emissies."
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: "Kleurrijke vuurwerkbloem van drones boven Berlijn tijdens de campagne #Böllerciao van de Deutsche Umwelthilfe"
      width: 1920
      height: 987
    mediaSide: right
    cta:
      label: Over duurzaamheid
      href: /ueber-uns/#nachhaltigkeit
  - type: steps
    id: ablauf
    kicker: Verloop
    headline: Van idee tot applaus
    _key: k_22cad4004e6677e22092
    steps:
      - title: "#1 Aanvraag"
        text: "Vertel ons datum, locatie en gelegenheid. Binnen uiterlijk 48 uur geven we jullie een inschatting. Na het eerste gesprek ontvangen jullie de offerte; een bezichtiging is zelden nodig."
        _key: k_07593dae179ab85954fb
      - title: "#2 Planning"
        text: "Samen ontwikkelen we verhaallijn, motieven en muziek. Jullie zijn zo betrokken als jullie willen. Met toestemming van de grondeigenaren regelen wij alle vergunningen."
        _key: k_8712fd69e4210fc7f3f1
      - title: "#3 Showdag"
        text: "We regelen veiligheid, opbouw en afbouw vanaf zo'n drieënhalf uur voor de show. Het spektakel duurt tot 25 minuten. Jullie genieten samen met jullie gasten."
        _key: k_002bb2a1e4204dd1d7d4
    ownNumbers: true
  - type: landingTeaser
    id: preise
    kicker: Prijzen
    headline: Stel jullie show samen
    text: "Wij maken alles mogelijk: van kleine evenementen met een krap budget tot grote spektakels met meer drones, meer muziek en meer wow. Altijd transparant, altijd tegen een vaste prijs zonder verrassingen."
    todo: "FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan."
    _key: k_bb613fb3a85d23de53b1
    href: /drohnenshow-preise/#konfigurator
    cta: Show plannen
    loop: start
  - type: team
    id: ueber
    kicker: Over FlyingStars
    headline: Stralende drones voor stralende ogen
    text: "We willen mensen fascineren, meeslepen en raken. Daarom laten we sinds 2021 zien dat onvergetelijke momenten vol magie kunnen zitten – en tegelijk stil, schoon en rekening houdend met anderen kunnen zijn."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    note: "Bekend van: ZDF, WDR, NTV, WAZ"
    cta:
      label: Over ons
      href: /ueber-uns/
    todo: FlyingStars muss ein Teamfoto bzw. hochauflösende Porträts liefern; eine Presseseite für „In der Presse“ fehlt.
    _key: k_43486c946660a912fde1
    secondary:
      label: In de pers
      href: "#kundinnen"
  - type: contactForm
    kicker: Droneshow rechtstreeks bij de aanbieder boeken
    headline: Laten we jullie optreden plannen
    _key: k_101f174c707888bef85a
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.
    text: "Vertel ons over jullie ideeën, stel ons jullie vraag of reserveer een van de vrije data in 2027 en 2028. We antwoorden binnen 48 uur."
