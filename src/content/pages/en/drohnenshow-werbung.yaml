    id: ueber
    kicker: About FlyingStars
    todo: FlyingStars muss ein Teamfoto liefern; eine Presseseite für „In der Presse“ fehlt.
    note: "As seen on: ZDF, WDR, NTV, WAZ"
    cta:
      label: About us
      href: /ueber-uns/
    secondary:
      label: In the press
