  - type: landingRefs
    id: referenzen
    kicker: Our work
    headline: Big brands, big stages.
    projects:
      - nfl-berlin-game
      - puma-bundesliga
      - exploring-reinvented-der-neue-ford-explorer
      - loreal-prada-rheinturm
    cta:
      label: All our work
      href: /referenzen/
  - type: landingBento
    id: wirkung
    kicker: Impact
    headline: What a brand show can do.
    lead:
      label: Ford · Volkswagen · PUMA
      title: A logo people *recognise*.
      text: We turn your logo into points of light, drone by drone.
      image:
        src: https://flyingstars.art/wp-content/uploads/2024/12/FORD_comp.png
        alt: Ford lettering made of blue drones above the factory site in Cologne
        width: 1929
        height: 1133
    items:
      - icon: camera
        title: Content for your channels
        text: "Guests film and share the show. Raw footage from our camera drone costs {{offer.film.price}}, and is included in {{offer.film.included}}."
      - icon: newspaper
        title: A reason to report
        text: ZDF, WDR, ntv and WAZ are among the media that have reported on us and our shows.
    todo: FlyingStars muss die genannten ZDF-/WDR-Berichte konkret belegen; für Reichweiten- oder Wirkungsaussagen fehlen messbare Projektergebnisse.
  - type: landingFlow
    id: freigabe
    kicker: The process
    headline: From logo to finished show.
    text: Nothing flies without your approval.
    steps:
      - title: Enquiry and quote
        text: Tell us your date, location and goal. We'll reply within 48 hours and send a quote after a short conversation.
        duration: Reply within 48 h
      - title: Draft
        text: Send us your logo. First, you'll see a 2D draft of the motifs.
      - title: Animation
        text: Then a draft animation with music. From HORIZON upwards, you receive a video preview of the show.
      - title: Approval
        text: Once you've approved every motif, we programme the colours and light effects to the music.
        gate: true
      - title: Show day
        text: Our crew arrives around three hours beforehand, secures the take-off area and flies the show.
        duration: approx. 3 h setup
  - type: packages
    id: pakete
    kicker: Packages
    headline: How complex should your show be?
    text: A 2D logo is enough for many corporate celebrations. For launches with 3D objects and a storyline, choose HORIZON or ODYSSEY.
    compact: true
    items:
      - name: SPARK
        label: Classic 2D
      - name: HORIZON
        label: 3D in motion
        badge: Bestseller
        highlight: true
      - name: ODYSSEY
        label: 3D storytelling show
    note: All prices exclude VAT and travel
    cta:
      label: All services and prices
      href: /drohnenshow-preise/
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.
  - type: landingTeaser
    id: logo
    kicker: Show configurator
    headline: What does your *logo* look like in the sky?
    text: Upload your logo in the configurator and see it as a drone formation, with motifs from SPARK to ODYSSEY.
    href: /drohnenshow-preise/?anlass=launch#konfigurator
    cta: Try your logo in the configurator
    loop: marke
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
  - type: landingBento
    id: agenturen
    kicker: Agencies
    headline: You stay the face, we deliver the show.
    lead:
      icon: sparkles
      title: We fly, *you shine*.
      text: You stay in front of your clients. You decide how much to organise yourselves and how much we take on.
    items:
      - icon: hat-glasses
        title: White label
        text: We can fly anonymously. Your name takes the lead, we deliver the show.
      - icon: file-lock
        title: Confidential
        text: We sign a non-disclosure agreement.
      - icon: thumbs-up
        title: Approval
        text: We visualise the motifs with your client's logo to help you coordinate with them.
      - icon: clipboard-list
        title: Project management
        text: On request, we manage the project, including permits, authorities and on-site technology.
    closing:
      headline: A project for your client?
      text: Tell us about it. We'll reply within 48 hours and agree everything else with you in confidence.
      button:
        label: Enquire as an agency
        href: /kontakt/?anlass=agentur
  - type: landingSpotlight
    id: orte
    kicker: Locations
    headline: We fly where your audience is.
    text: Our generic operating authorisation lets us approve most flight sites ourselves. For controlled airspace, airport locations and federal waterways, we obtain the necessary special permits. This takes more lead time.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
      alt: Drone formation above the Düsseldorf skyline with the Rhine Tower
      width: 1920
      height: 985
    tags:
      - Borussia-Park · Mönchengladbach
      - Olympiastadion · Berlin
      - Rhine Tower · Düsseldorf
      - Inner harbour · Duisburg
    facts:
      - value: 4–8 weeks
        label: confirmation per EU country
      - value: approx. 3 months
        label: in Italy
    todo: FlyingStars muss aktuelle Cross-border-Fristen und mögliche Sondergebühren je Land bestätigen. Die Ortsbeispiele belegen keine pauschale Genehmigung oder garantierte Frist.
  - type: landingSite
    id: standort
    kicker: Site
    headline: Is your site suitable?
    text: Send us the address and the planned position of your audience. Before quoting, we check whether and how a show is possible there.
    variant: outdoor
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Moritz muss die Aufgabenliste für Markenshows freigeben.
    additionalResponsibilities:
      - task: Send your logo and approve every motif
        us: none
        you: full
      - task: Design and animate the motifs
        us: full
        you: none
    safetyRef: safety-concept
  - type: faq
    id: fragen
    kicker: FAQ
    headline: Questions from brands and agencies.
    cta:
      label: All questions
      href: /faq/
    tags:
      - werbung
  - type: contactForm
    kicker: Enquiry
    headline: Tell us about your campaign.
    text: A date, location and goal are enough. You can send your logo by email later.
