title: "Book a drone show for your wedding: magical moments"
navLabel: Wedding
description: "Paint your love story across the sky ✓ 150+ shows ✓ Family-friendly & little effort ☎︎ +49 209 88306562"
image: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
sections:
  - type: landingHero
    kicker: Book a wedding drone show
    headline: Paint your love story across the sky
    text: "May we have this dance? At your wedding, our drone show brings your fairy tale to life. For tearful moments and a highlight in your wedding video."
    cta:
      label: Request a show
      href: "#anfrage"
    secondary:
      label: ☎︎ +49 209 88306562
      href: tel:+4920988306562
    video: showreel
    videoLabel: Showreel
    poster:
      src: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
      alt: "Hand with a ring made of drones in the blue evening sky above treetops, at a proposal at Schloss Hugenpoet"
      width: 2063
      height: 1303
    facts: []
    _key: k_683af193db254741d0d4
