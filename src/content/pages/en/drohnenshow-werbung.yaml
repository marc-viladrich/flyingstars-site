title: Drone shows for advertising
navLabel: Brands & advertising
description: "Drone shows for brands and agencies: your logo in the night sky, with every motif approved in
  advance. For launches, anniversaries and campaigns."
image: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
sections:
  - type: landingHero
    kicker: Brands & advertising
    headline: Your brand in the *night sky*.
    text: We turn your logo and message into drones, matched to your music and campaign. You approve every motif
      before the show.
    cta:
      label: Enquire about a brand show
      href: "#anfrage"
    secondary:
      label: For agencies
      href: "#agenturen"
    video: ford
    videoLabel: Ford Explorer · Cologne
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
      alt: Volkswagen logo made of drones above Lake Wolfgangsee, guests filming from a terrace
      width: 1920
      height: 1281
    facts:
      - value: "178"
        label: shows since 2022
      - value: 48 h
        label: until our reply
      - value: 1–2 weeks
        label: with express service
