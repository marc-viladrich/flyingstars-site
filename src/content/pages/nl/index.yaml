  - type: team
    id: team
    kicker: Team
    headline: De mensen achter de hemel.
    text: Ronja, Florian en Erwin leiden FlyingStars samen. Jullie bereiken ons als team en op de showavond staan
      we zelf op het veld.
    members:
      - name: Ronja Donsbach
        role: Directeur
        bio: Beantwoordt de meeste aanvragen, ook in het Engels, en stemt ontwerp en muziek af.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/08/Ronja_Teamfoto.jpg
          alt: Ronja Donsbach met een drone in haar hand
          width: 800
          height: 1000
      - name: Florian Becker
        role: Directeur
        bio: Regelt administratie, personeel en klanten in Duitsland. Schrijft de blog.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/08/Florian_Teamfoto.jpg
          alt: Florian Becker met een drone in zijn hand
          width: 800
          height: 1000
      - name: Erwin Wilms
        role: Directeur
        bio: Aanvragen, instanties en luchtvaartrecht. Zorgt dat jullie show mag vliegen.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/08/Erwin_Teamfoto.jpg
          alt: Erwin Wilms met een drone in zijn hand
          width: 800
          height: 1000
      - name: Patrick
        role: Hoofd Techniek
        bio: Dronevloot, beschikbaarheid, inkoop en de technische opbouw van elke show.
      - name: Alejandro
        role: Hoofd ontwerp
        bio: Ontwerpt alle shows en choreografieën, beeld voor beeld, op het ritme van de muziek.
    note: Daarnaast een crew van piloten en technici die elke show ter plaatse opbouwt en vliegt.
    cta:
      label: Meer over ons
      href: /ueber-uns/
  - type: faq
    id: faq
    kicker: FAQ
