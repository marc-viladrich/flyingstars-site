# Über uns nach Moritz' Webtext (17.11.2026, „Webtext Über uns FlyingStars“): Titel, Meta, Abschnittsfolge, Überschriften und
# Texte wortgetreu, Ansprache durchgehend „ihr“ statt „du“. URL bleibt /ueber-uns/ (Moritz schreibt /ueber).
# Layout je Abschnitt aus dem Prototyp (docs/DESIGN.md „Neue Texte in bestehende Komponenten“): Showreel im Rahmen statt
# #Teamfoto (es gibt kein Teamfoto; das Bild auf der Startseite ist ein Stockfoto), Nachhaltigkeit als große Überschrift
# mit Foto, Werte als Icon-Raster, Porträts, farbiger Zeitstrahl, Punktkarte NRW statt #FotoDesGebäudes, Anfrage, FAQ.
# Flächen wechseln: Werte hell, Team dunkel, Meilensteine hell, Standort dunkel, Anfrage hell, FAQ dunkel.
title: "Über FlyingStars: Team, Mission und Meilensteine"
description: "Lernt unsere Vision und die Menschen dahinter kennen ✓ 150+ Drohnenshows in aller Welt ☎︎ +49 209 88306562"
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  # Eckdaten aus Moritz' Text (seit 2021, über 150 Shows) und aus seinen Meilensteinen (600 Drohnen, 2026).
  - type: landingHero
    kicker: Über FlyingStars
    headline: Wir *verzaubern* Gäste mit eurer Geschichte
    text: Menschen unterhalten, Emotionen erzeugen und in Erinnerung bleiben. Wir möchten zeigen, dass das auch ohne Knall, Müll und Rauch geht. Dafür fliegen wir seit 2021 mehr als 150 magische Drohnenshows für zehntausende Besucher:innen.
    cta: { label: Lernt uns kennen, href: "#team" }
    video: showreel
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
      alt: Drohnenformation über der Skyline von Düsseldorf mit Rheinturm
      width: 1600
      height: 900
    facts:
      - { value: "2021", label: gegründet, "_key": "k_07f319e4f08e855ed3c2" }
      - { value: "150+", label: Drohnenshows, "_key": "k_61cf80d1d9046e824f10" }
      - { value: "600", label: Drohnen in der größten Show, "_key": "k_1ad8788ba42c8951f048" }
    todo: "FlyingStars muss ein freigegebenes Teamfoto liefern (Moritz' Platzhalter #Teamfoto); bis dahin läuft hier das Showreel."
    _key: k_b7135e5f4ccf1ef0e1c1

  # Große Überschrift der Nachhaltigkeit, darunter die Einleitung neben einer Galerie von Festen (Galerie „willkommen“, Runde 4); die Scrollstory mit Knall, Müll, Rauch steht auf
  # /nachhaltigkeit/, hier führt der Link dorthin.
  - type: sustainability
    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Feste feiern, bei denen alle *willkommen* sind
    text: "Hunde, Kinder, die Natur: Große Teile unserer Gesellschaft bleiben einem Feuerwerk lieber fern. Wir feiern lieber Feste, die uns alle begeistern. Mit Drohnenshows bieten wir deshalb eine Alternative zu Knall, Müll und Rauch des Feuerwerks. Und setzen regelmäßig Zeichen für Demokratie und Umweltschutz in den Himmel."
    gallery: willkommen
    cta: { label: Zur Nachhaltigkeit, href: /nachhaltigkeit/ }
    _key: k_0fa41045b869c8273b40

  - type: steps
    id: haltung
    kicker: Unsere Haltung
    headline: Diese Werte fliegen immer mit
    surface: alt
    steps:
      - icon: handshake
        title: Teamarbeit
        subtitle: Alle zusammen für einen Moment
        text: Unsere Choreografien entstehen nicht im Alleingang. Sondern im vertrauten Zusammenspiel unseres Teams und mit euch. Mit vielen Kundinnen und Kunden pflegen wir deshalb seit Jahren einen engen Kontakt.
        _key: k_f25977eef0b3c3073f86
      - icon: telescope
        title: Neugier
        subtitle: Wie leuchtet eure Geschichte?
        text: "Wir finden immer neue Wege, Menschen zu verzaubern. Mal durch mehr Spektakel: modernste Technik, größere Tänze, mehr Wumms. Mal durch Kreativität und Ästhetik, um mit nur ein paar Pixeln am Himmel eine ganze Welt zu erschaffen."
        _key: k_1705c70732105b287ad3
      - icon: list-checks
        title: Gründlichkeit
        subtitle: Jedes Detail zählt
        text: Damit ihr die märchenhafte Atmosphäre gemeinsam mit euren Gästen aufsaugen könnt, planen wir jeden Schritt sorgfältig. Dank der Erfahrung aus über 150 Veranstaltungen in aller Welt sind wir auf wohl jede Eventualität vorbereitet.
        _key: k_4cbe7266c56990c2d263
    _key: k_5f577f27ee53584bc075

  # Reihenfolge und Kurzvorstellungen nach Moritz; Rollen und Bios gelten nur auf dieser Seite (memberTexts), damit die
  # Personendaten und die Übersetzungsverträge der anderen Seiten unverändert bleiben. Patrick und Alejandro ohne Nachnamen.
  - type: team
    id: team
    kicker: Unser Team
    headline: Alles aus einer Hand
    text: Wenn ihr FlyingStars bucht, bekommt ihr FlyingStars – keine externen Dienstleister:innen. Wir decken alle Aufgaben intern in einem eingespielten Team ab. Zusätzlich unterstützen uns rund zehn Aushilfskräfte beim Auf- und Abbau und der Absicherung unserer Auftritte.
    members:
      - personId: florian-becker
      - personId: ronja-donsbach
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
      - personId: chopper
    memberTexts:
      - { personId: florian-becker, role: Geschäftsführer, bio: Flo übernimmt unsere interne Verwaltung. Außerdem schreibt er auf unserem Blog., "_key": "k_b465446582054e981d9b" }
      - { personId: ronja-donsbach, role: Geschäftsführerin, bio: Ronja bearbeitet vermutlich eure Anfrage und koordiniert die Zusammenarbeit unseres Teams., "_key": "k_354002e2469c5de0d5ce" }
      - { personId: erwin-wilms, role: Geschäftsführer, bio: Erwin kümmert sich um Anträge und Genehmigungen und betreut internationale Projekte., "_key": "k_5fe478b35edaa77dd0a2" }
      - { personId: patrick, role: Technik, bio: Patrick stellt unsere Flotte zusammen und stellt den reibungslosen technischen Ablauf sicher., "_key": "k_c27f497bc32276117ae9" }
      - { personId: alejandro, role: Design, bio: Alejandro verwandelt eure Geschichte in eine einzigartige Choreografie in 2D und 3D., "_key": "k_9216ad57906a5ee4167a" }
      - { personId: chopper, role: Happiness, bio: Chopper sorgt für den Wau-Effekt eurer Show und für die gute Laune im Büro., "_key": "k_33354ce5e5195eb00295" }
    todo: FlyingStars muss Fotos von Patrick, Alejandro und Chopper liefern sowie hochauflösende Porträts der drei Geschäftsführer:innen; Nachnamen von Patrick und Alejandro fehlen in Moritz' Text.
    _key: k_c25a7d02d05d2423027c

  # Jahreszahlen und Texte von Moritz; die kurzen Titel je Jahr fasst sein Text zusammen (Entwurf, von Moritz zu prüfen).
  - type: timeline
    id: meilensteine
    kicker: Unsere Meilensteine
    headline: Vom privaten Geburtstag bis ans andere Ende der *Welt*
    surface: alt
    items:
      - { when: "2021", title: Gründung, text: "Unsere Gründer:innen wundern sich, wieso es Drohnenshows bisher fast nur in Asien gibt. Also holen sie sie einfach nach Deutschland. Am 01.12.2021 gründen sie FlyingStars.", "_key": "k_6c6ce3555dadeb7f9c19" }
      - { when: "2022", title: Die erste Show, text: "Unsere erste Drohnenshow findet im August auf einem privaten Geburtstag mit 50 Drohnen statt. Aufregend! Im selben Jahr folgen noch sieben weitere, unter anderem für PUMA.", "_key": "k_7d0e13be5f980d2587f6" }
      - { when: "2023", title: 42 Aufführungen, text: "2023 fliegen wir schon 42 Aufführungen. Unter anderem für die Deutsche Umwelthilfe, um die Kampagne #BÖLLERCIAO zu unterstützen. Außerdem ziehen wir ins Triple Z in Essen ein.", "_key": "k_53114f06e4c47ca208dc" }
      - { when: "2024", title: 400 Drohnen für VW, text: "Mit 400 Drohnen setzen wir für VW in Österreich einen Meilenstein. Wir fliegen insgesamt 45 Shows und verfeinern unsere Prozesse.", "_key": "k_73251c0c3357108c15e8" }
      - { when: "2025", title: Die erste Indoor-Show, text: "Im März fliegen wir unsere erste Indoor-Show für Siemens auf der Hannover-Messe. Mit Kein Bock auf Nazis dürfen wir seit dem August 2025 regelmäßig ein Zeichen setzen.", "_key": "k_41fdee284e0f1ec28380" }
      - { when: "2026", title: Rekordjahr, text: "Rekordjahr: Unsere größte Show mit 600 Drohnen fliegen wir für ein niederländisches Musical – gleich 20 Nächte hintereinander! Unser bisher weitester Auftrag führt uns in die Karibik.", "_key": "k_72e4446870d686464b34" }
    cta: { label: Alle Referenzen, href: /referenzen/ }
    todo: "Moritz' Zahlen weichen vom Bestand ab: VW Golf 350 oder 400 Drohnen (Fragebogen 350), Showzahlen je Jahr (Bestand: 178 Shows bis 21.10.2026). Titel je Jahr sind ein Entwurf."
    _key: k_65625cffa99167129c8b

  # Kein Gebäudefoto im Bestand (Moritz' Platzhalter #FotoDesGebäudes): Punktkarte NRW mit Büro und Hauptsitz.
  - type: location
    id: standort
    kicker: Standort
    headline: Zu Hause in *NRW*
    # Marc, 18.11.2026: Anschriften als eigene Blöcke unter dem Text (aus den Kontaktdaten), Moritz' Einladung und der
    # Satz zum Triple Z bleiben wörtlich; der Post-Satz steckt jetzt im Block „Hauptsitz“
    text: Besucht ihr uns mal auf einen Kaffee? Dann laden wir euch gerne in unser Büro ein. Hier sitzen wir im Triple Z, dem Gründungszentrum Zeche Zollverein, umgeben von innovativem Start-up-Spirit und nordrhein-westfälischer Industrietradition.
    places:
      - { label: Büro, role: Besuch auf einen Kaffee, address: visit, icon: coffee, lat: 51.492, lon: 7.041, "_key": "k_e306a90123055df8f90a" }
      - { label: Hauptsitz, role: Post, address: post, icon: mailbox, lat: 51.508, lon: 7.104, "_key": "k_4f2fced46fdc7f3b8b94" }
    note: Basis 51.51° N · 7.10° E
    todo: FlyingStars muss ein Foto des Triple Z bzw. des Büros liefern, falls es statt der Karte stehen soll.
    _key: k_29290f927e580af77d9b

  - type: contactForm
    kicker: Kontakt
    headline: Lernen wir uns kennen?
    text: Wir freuen uns darauf, eure Showidee gemeinsam zum Leben zu erwecken. Gerne sprechen wir in einem unverbindlichen Gespräch über eure Vision.
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.
