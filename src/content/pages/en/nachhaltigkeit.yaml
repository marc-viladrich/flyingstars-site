title: "Sustainability: drone shows by FlyingStars (vs. fireworks)"
description: No bang. No litter. No smoke. ✓ Drone shows for social and environmental engagement. ☎︎ +49 209 88306562
noindex: false
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: hero
    kicker: Sustainability
    headline: No bang. *No litter.* No smoke.
    text: Our drone shows prove that a big spectacle can also be quiet, locally emission-free and tidy. And so they warmly welcome every guest – including dogs, children and nature on site.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: A globe made of drones above the Rhine at Extraschicht in Duisburg, audience on the riverbank
      width: 2544
      height: 1493
    _key: k_ef572ac0e4ba13d454af
  - type: sustainability
    id: alternative
    kicker: drone shows
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen, die Belege für Ökostrom und das TÜV-NORD-Schallschutzgutachten bereithalten und die Nutzung des naturstrom-Logos schriftlich freigeben lassen.
    headline: The *alternative* to fireworks
    text: Our drone shows are often allowed to fly where fireworks are banned or unwelcome because of noise protection, fine dust or fire risk.
    facts:
      - label: No bang
        value: Quiet
        text: Our drones only hum quietly. TÜV NORD confirms our noise protection, so sensitive guests can join in too.
        _key: k_5dfd76d168b4a97a8cff
      - label: No litter
        value: "0"
        unit: kg
        text: Our drones are reusable. We recharge them again and again with 100% green electricity from naturstrom.
        _key: k_2a3281e1e1ce468cb8ed
      - label: No smoke
        value: "0"
        unit: g
        text: Our drones produce no fine dust, nitrogen oxides or heavy metals on site. No open flames are used.
        _key: k_85941100bf952a64e766
    points:
      - _key: k_4ecbfd8bacb8dad1a3e9
        value: Noise protection confirmed by TÜV NORD
      - _key: k_8fd4b4570f848e1175a8
        value: 100% green electricity from naturstrom
    proofImage:
      src: https://flyingstars.art/wp-content/uploads/2024/10/NATURSTROM-Logo_weiss.png
      alt: naturstrom
      width: 301
      height: 71
    _key: k_b58e8e802d7c6c5c47eb
