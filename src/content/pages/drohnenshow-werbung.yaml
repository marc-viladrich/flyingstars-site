  # Ablauf als Verlaufsstrahl wie „Freigabe“ im Prototyp, Zeitangaben aus Moritz' Texten
  - type: landingFlow
    id: ablauf
    kicker: Ablauf
    headline: In drei Schritten zur *Show*
    steps:
      - { title: "#1 Anfrage", text: "Ihr erzählt uns von Datum, Ort und Anlass. Wir melden uns innerhalb von 48 Stunden zurück, um ein Erstgespräch zu vereinbaren. Eine Begehung ist selten nötig.", duration: 48 h, "_key": "k_e01bd8edb2e65fef3485" }
      - { title: "#2 Planung", text: "Wir entwickeln die Choreo samt Motiven und Musik. Ihr seid so viel involviert, wie ihr möchtet. Mit Zustimmung der Grundstückseigentümer:innen holen wir alle Genehmigungen ein.", duration: unter 2 Wochen möglich, "_key": "k_b22b05daa48eb35fd92c" }
      - { title: "#3 Showtag", text: "Wir kümmern uns um alles: Aufbau dreieinhalb Stunden vor der Aufführung, Sicherheit, Abbau. Die Drohnen-Werbung selbst läuft für bis zu 25 Minuten.", duration: "3,5 h Aufbau · bis 25 Min Show", "_key": "k_9ebfd8a7c65e0d2211e6" }
    _key: k_a7152263e0461f67ead9

  # Entwurf für Moritz (Marc, 03.11.2026: „was übernehmen wir, was übernehmt ihr“ ist für Marken genauso relevant).
  # Zonen und Maße wie auf der Hochzeitsseite, Quellen: docs/sicherheitskonzept-quellen.md. Aufgaben nach dem Ablauf oben
  # (Logo schicken, jedes Motiv freigeben) und dem Technik-Datenblatt.
  - type: landingSite
    id: standort
    kicker: Standort
    headline: Passt euer Standort?
    text: Schickt uns die Adresse und die geplante Position eures Publikums. Vor dem Angebot prüfen wir, ob und wie die Show dort möglich ist.
    variant: outdoor
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Moritz muss die Aufgabenliste für Markenshows freigeben.
    additionalResponsibilities:
      - task: Logo schicken und jedes Motiv freigeben
        us: none
        you: full
        _key: k_f9022e9498a7fad0753a
      - task: Motive entwerfen und animieren
        us: full
        you: none
        _key: k_827a4c6b6a7c553bffad
    safetyRef: safety-concept
    _key: k_c4fd3256a7a568abb827

