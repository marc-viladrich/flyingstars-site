name: Cloudflare deploy
# Staging bis zum Hetzner-Umzug: jeder freigegebene Stand auf main geht nach grüner CI auf Cloudflare Pages.
# Ziel-URL: vars.SITE_URL (Produktionsbranch des Pages-Projekts ist main).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY != 'off' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Erfolgreiche CI für aktuellen main prüfen
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const sha = main.commit.sha;
            const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', head_sha: sha});
            if (!data.workflow_runs.some(run => run.head_sha === sha && run.conclusion === 'success')) {
              throw new Error('Aktueller main hat noch keine erfolgreiche CI.');
            }
            core.setOutput('sha', sha);
      - name: Cloudflare-Konfiguration prüfen
        env:
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for key in CF_PAGES_PROJECT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!key}" ]; then echo "::error::Cloudflare-Konfiguration fehlt: $key"; missing=1; fi
          done
          exit "$missing"
      - uses: actions/checkout@v6
        with: { ref: '${{ steps.gate.outputs.sha }}' }
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc, cache: npm, registry-url: 'https://npm.pkg.github.com', scope: '@marc-viladrich' }
      - run: npm ci
        # Private editor package (GitHub Packages): classic token with read:packages only.
        env: { NODE_AUTH_TOKEN: '${{ secrets.PACKAGES_READ_TOKEN }}' }
      - run: npx astro build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
      # Pages Functions (functions/) werden aus dem Repo-Root mitgebündelt.
      - name: Cloudflare Pages deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-hash=${{ steps.gate.outputs.sha }}
