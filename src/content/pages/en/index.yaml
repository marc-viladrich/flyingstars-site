  - type: tempo
    id: ablauf
    kicker: Process
    headline: From idea to *applause*
    marks:
      - value: 48 h
        label: "#1 Enquiry"
        text: Tell us the date, place and occasion. Within 48 hours at the latest, we give you an assessment. After the initial call you receive the quote; a site visit is rarely necessary.
        _key: k_07593dae179ab85954fb
      - value: 1–2 weeks
        label: "#2 Planning"
        text: Together we develop the storyline, motifs and music. You are as involved as you want to be. With the landowners' consent, we obtain all permits.
        _key: k_8712fd69e4210fc7f3f1
      - value: 3.5 h
        label: "#3 Show day"
        text: We organise safety, set-up and dismantling from around three and a half hours before the show. The spectacle lasts up to {{duration.outdoor.max}} minutes. You enjoy it with your guests.
        _key: k_002bb2a1e4204dd1d7d4
      - value: "up to {{duration.outdoor.max}} min"
        label: "Show, then applause"
        _key: k_3c30dd0af9bfae6075dc
