<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FlyingStars · Seite bearbeiten</title>
  <link rel="stylesheet" href="/editor/editor.css">
  <script type="module" src="/editor/editor.js"></script>
</head>
<body>
  <iframe id="site-frame" title="FlyingStars-Seite im Bearbeitungsmodus"></iframe>
  <div id="loading" class="editor-ui loading" role="status">Seite wird geladen …</div>

  <aside id="panel" class="editor-ui panel" tabindex="-1" aria-labelledby="panel-title" hidden>
    <div class="panel-head">
      <button id="panel-back" class="icon-only" type="button" aria-label="Zurück" title="Zurück" hidden></button>
      <span id="panel-icon" aria-hidden="true"></span>
      <h2 id="panel-title"></h2>
      <span id="panel-kind" class="panel-kind"></span>
      <div id="panel-actions" class="panel-actions"></div>
      <button id="panel-unpin" class="icon-only" type="button" aria-label="Wieder automatisch platzieren" title="Wieder automatisch platzieren (oder Doppelklick auf die Titelleiste)" hidden></button>
      <button id="panel-close" class="icon-only" type="button" aria-label="Schließen" title="Schließen"></button>
    </div>
    <div id="panel-body" class="panel-body"></div>
    <div class="panel-resize" data-edge="left" aria-hidden="true"></div>
    <div class="panel-resize" data-edge="right" aria-hidden="true"></div>
  </aside>

  <div id="dock" class="editor-ui dock" role="toolbar" aria-label="Seiteneditor">
    <button id="page-button" class="page-button" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    <span class="dock-sep" aria-hidden="true"></span>
    <button id="mode" type="button" aria-pressed="false"></button>
    <button id="language" type="button" aria-haspopup="menu" aria-expanded="false" title="Sprache der Ansicht"></button>
    <button id="add-section" class="icon-only" type="button" aria-label="Abschnitt hinzufügen" title="Abschnitt hinzufügen"></button>
    <button id="more" class="icon-only" type="button" aria-label="Weitere Aktionen" title="Weitere Aktionen" aria-haspopup="menu" aria-expanded="false"></button>
    <span id="dock-status" class="dock-status" role="status" hidden></span>
    <button id="publish" class="publish" type="button" hidden></button>
    <button id="upload" class="publish" type="button" hidden></button>
    <button id="undo" class="icon-only" type="button" aria-label="Rückgängig" title="Rückgängig (⌘Z)" hidden></button>
    <button id="save" class="primary" type="button" title="Alle Änderungen speichern (⌘S)" hidden></button>
  </div>

  <div id="toast" class="editor-ui toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
