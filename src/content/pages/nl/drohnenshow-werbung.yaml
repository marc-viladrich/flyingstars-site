  - type: textMedia
    id: marketing
    kicker: Reclame en marketing met drones
    headline: Jullie bedrijf op het grootste podium ter wereld
    body: "Het nieuwe product waarvan iedereen de lancering moet meekrijgen. De reclamevideo met wow-effect. De merkcampagne die jullie logo weer in de hoofden brandt.\n\nSamen bouwen we een choreografie op maat die het verhaal van jullie merk vertelt. Meer dan alleen jullie logo, een claim of jullie bedrijfsnaam – emotionele storytelling die betovert.\n\nOnze droneshows zijn een alternatief voor vuurwerk dat nog bijna niemand kent. Aandacht gegarandeerd, zelfs van kilometers afstand."
    mediaSide: right
    cta:
      label: Show aanvragen
      href: "#anfrage"
    _key: k_7abf894f6f4dfb7d5b8c
  - type: textMedia
    id: komplettpaket
    kicker: Totaalpakket
    headline: Alles erin voor jullie marketing
    body: "Van idee tot applaus begeleiden we jullie bij de hele planning en uitvoering.\n\n- Techniek: wij leveren hardware, software en lichtdrones.\n- Muziek: laat de drones dansen op jullie playlist.\n- Promotiemateriaal: op verzoek maken we foto's en filmopnamen.\n- Vergunningen: wij nemen de complete bureaucratie over.\n- Veiligheid: LBA- en EASA-gecertificeerd, aansprakelijkheidsverzekering tot € 1,3 mln.\n- Snelheid: planning in minder dan twee weken mogelijk.\n- Internationaal: in Duitsland, Europa en wereldwijd"
    mediaSide: right
    cta:
      label: Show aanvragen
      href: "#anfrage"
    _key: k_5fce2f823d9e547c9f3a
  - type: steps
    id: agenturen
    kicker: Voordelen
    headline: Onze ervaring uit 150+ B2B-shows
    steps:
      - title: "Wij vliegen, jullie stralen"
        text: We tekenen graag NDA's voor jullie reclame- of marketingbureau.
        _key: k_8949ebf1a13706740934
      - title: Merkveilig
        text: Jullie keuren alle motieven goed en houden zo de controle over jullie merk.
        _key: k_fbb4c3639f44f4ea8804
      - title: KPI-gericht
        text: "De resultaten tellen: we werken met jullie samen om succes te meten."
        _key: k_cee3e178d47544d71e22
    ownNumbers: true
    _key: k_35809e7974828f33e234
  - type: landingRefs
    id: referenzen
    kicker: Referenties
    todo: Für E.ON fehlen Showbild, genaues Datum und Fallstudie.
    headline: Door honderdduizenden gezien
    cta:
      label: Alle referenties
      href: /referenzen/
    projects:
      - spotify-luciano-apache
      - loreal-prada-rheinturm
      - eon-hamburg
    cards:
      - ref: spotify-luciano-apache
        title: Spotify
        kicker: Visuele albumrelease
        text: "Als Luciano en Apache 207 samenwerken, ontstaat er iets groots. Hun nieuwe EP mochten we bij de release met 350 drones boven Prenzlauer Berg visueel in scène zetten."
        _key: k_78b56031fa52bc4e444c
      - ref: loreal-prada-rheinturm
        title: L’Oréal x Prada
        kicker: Een productlancering die niemand kon missen
        text: "Een parfum dat feller straalt dan de Rheinturm: met 350 drones midden in Düsseldorf verzorgden we een voorstelling die honderden keren werd gedeeld."
        _key: k_da7261ca4e5d1bd54a6d
      - ref: eon-hamburg
        title: E.ON
        kicker: The Future is Now
        text: Met 500 drones maakten we van de haven van Hamburg het grootste podium van de E.ON New Energy Experience 2026. De hommage aan de Hanzestad maakte duizenden toeschouwers enthousiast.
        _key: k_c4bbae2e1586193f7306
    _key: k_1f617bd698f4f907e713
  - type: steps
    id: ablauf
    kicker: Verloop
    headline: In drie stappen naar jullie show
    steps:
      - title: "#1 Aanvraag"
        text: "Jullie vertellen ons datum, locatie en gelegenheid. We nemen binnen 48 uur contact op om een eerste gesprek in te plannen. Een bezichtiging is zelden nodig."
        _key: k_e01bd8edb2e65fef3485
      - title: "#2 Planning"
        text: Wij ontwikkelen de choreografie met motieven en muziek. Jullie zijn zo betrokken als jullie willen. Met toestemming van de grondeigenaren regelen wij alle vergunningen.
        _key: k_b22b05daa48eb35fd92c
      - title: "#3 Showdag"
        text: "Wij regelen alles: opbouw drieënhalf uur voor de voorstelling, veiligheid, afbouw. De dronereclame zelf duurt tot 25 minuten."
        _key: k_9ebfd8a7c65e0d2211e6
    ownNumbers: true
    _key: k_a7152263e0461f67ead9
  - type: landingTeaser
    id: preise
    kicker: Prijzen
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    headline: Stel jullie show samen
    text: "Begin met onze basispakketten en vul ze aan met meer drones, meer maatwerk, meer spektakel. Altijd als vast pakket zonder verrassingen."
    href: /drohnenshow-preise/?anlass=launch#konfigurator
    cta: Show plannen
    loop: marke
    _key: k_1f4f4d01bf5354a2a7ba
