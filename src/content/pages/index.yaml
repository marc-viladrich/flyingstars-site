  # Anlässe als Slider (Marc, 31.10.2026, Runde 9): die vier wichtigsten sichtbar, der Rest läuft rechts aus dem Bild.
  # Kicker = Zielgruppe, Kartentitel = Nutzen. Silvester rückt im November und Dezember nach vorn (season). Hochzeit und
  # Heiratsantrag sind eine Karte. Texte sind Entwürfe für Moritz.
  - type: occasions
    id: anlaesse
    kicker: Anlässe
    headline: Für jeden Anlass die passende Show.
    cards:
      - category: Marken & Werbung
        title: Eure Marke auf der größten Leinwand der Welt
        text: Logos, Produkte und Claims am Himmel, für Launches, Jubiläen und Drehs.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg", alt: "Volkswagen-Logo aus Drohnen über dem Wolfgangsee, Gäste auf einer Terrasse", width: 1920, height: 1281 }
        facts: [ Jedes Motiv gebt ihr vorab frei, "Für Gäste, Mitarbeitende und die Kamera" ]
        cta: { label: Drohnenshows für Marken, href: /drohnenshow-werbung/ }
      - category: Agenturen
        title: Wir fliegen, ihr glänzt
        text: Wir fliegen für eure Kund:innen und bleiben auf Wunsch im Hintergrund.
        image: { src: "https://flyingstars-relaunch.vercel.app/media/projekte/ford.jpg", alt: Ford-Schriftzug aus Drohnen über dem Werksgelände in Köln, width: 1600, height: 900 }
        facts: [ NDA und Projektleitung auf Wunsch, Visualisierung mit dem Logo eurer Kund:innen ]
        cta: { label: Für Agenturen, href: "/drohnenshow-werbung/#agenturen" }
      - category: Städte & Gemeinden
        title: Ein Highlight, über das die ganze Stadt spricht
        text: Stadtfeste und Jubiläen ohne Pyrotechnik, auch im trockensten Sommer.
        image: { src: "https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg", alt: Weltkugel aus Drohnen über dem Rhein bei der Extraschicht in Duisburg, width: 2544, height: 1493 }
        facts: [ "Stadtwappen, Jubiläumszahlen, eure Geschichte", 10 % Rabatt bei Buchung im Vorjahr ]
        cta: { label: Show für eure Stadt anfragen, href: "/kontakt/?anlass=stadt" }
      - category: Hochzeit & Privat
        title: Euer Moment, am Himmel geschrieben
        text: Initialen, Herzen und euer Datum über der Feier, auch als Heiratsantrag.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/12/Hochzeit_cover.jpg", alt: Zwei Blüten aus Drohnen am Abendhimmel über einer Hochzeitsfeier, width: 1518, height: 854 }
        facts: [ Auch als Überraschung oder Antrag, SPARK ab 7.900 € netto ]
        cta: { label: Drohnenshow zur Hochzeit, href: /drohnenshow-hochzeit/ }
      - category: Festivals & Konzerte
        title: Der Höhepunkt, der eure Geschichte weitererzählt
        text: Die Show schließt an Bühne, Musik und Licht an, auch an vielen Abenden hintereinander.
        image: { src: "https://flyingstars-relaunch.vercel.app/media/projekte/bokkenrijders.jpg", alt: "Schriftzug Bokkenrijders aus Drohnen über der Freilichtbühne in Maastricht, Publikum im Vordergrund", width: 1600, height: 900 }
        facts: [ "Jeden Abend dieselbe Show, auch 20-mal hintereinander", 10 % Rabatt bei Buchung im Vorjahr ]
        cta: { label: 600 Drohnen im Musical, href: /musikalischer-teaser-bokkenrijders/ }
      - category: Silvester & Weihnachten
        title: Silvester ohne Böller
        text: "Ein Countdown aus Licht statt Knall und Rauch, für Städte, Gemeinden und Veranstalter:innen."
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png", alt: "Bunte Feuerwerksblüte aus Drohnen über Berlin bei der Kampagne #Böllerciao der Deutschen Umwelthilfe", width: 1920, height: 987 }
        facts: [ Mit der Deutschen Umwelthilfe über Berlin geflogen, "Früh anfragen, die Termine sind knapp" ]
        cta: { label: Silvester-Show anfragen, href: "/kontakt/?anlass=stadt" }
        season: [ 11, 12 ]
      - category: Indoor
        title: Drohnen in der Halle
        text: "Für Messen, Bühnen und Hallen ab {{offer.indoor.ceilingWords}} Metern Deckenhöhe."
        image: { src: "https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg", alt: Leuchtende Drohnen in Formation vor der Bühne eines voll besetzten Saals, width: 1200, height: 764 }
        facts: [ "{{offer.indoor.drones.min}} bis {{offer.indoor.drones.max}} Drohnen, {{duration.indoor.min}} bis {{duration.indoor.max}} Minuten", Einzeln kalkuliert ]
        cta: { label: Indoor-Drohnenshows, href: /drohnenshow-indoor/ }
    todo: Moritz muss die Anlass-Texte freigeben; FlyingStars muss die Relaunch-Sitemap bestätigen. Eigene Seiten für Städte, Festivals und Silvester sind bislang nicht ausgearbeitet.

  - type: packages
    id: pakete
    kicker: Pakete
    compact: true
    headline: Transparente Preise. Keine Überraschungen.
    text: Der Preis hängt davon ab, wie aufwendig die Bilder am Himmel sind und wie viele Drohnen fliegen.
    items:
      - { name: SPARK, label: Klassisch in 2D }
      - { name: HORIZON, label: 3D in Bewegung, badge: Bestseller, highlight: true }
      - { name: ODYSSEY, label: Erzählte 3D-Show }
    note: Alle Preise netto zzgl. Anfahrt
    cta: { label: Alle Leistungen und Preise, href: /drohnenshow-preise/ }
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.

  # Vorgeschmack auf den Konfigurator (Marc, 31.10.2026, Runde 7): kein interaktiver Konfigurator, sondern ein Showreel,
  # das sich selbst abspielt: die stärksten Motive von SPARK bis ODYSSEY, ein Beispiel-Logo, daneben ein Wireframe.
  - type: configuratorTeaser
    id: konfigurator
    kicker: Show-Konfigurator
    headline: Stellt eure Show *selbst* zusammen.
    text: Vom Herz bis zur Mondlandung, von 100 bis 600 Drohnen. Im Konfigurator seht ihr, was zu eurem Anlass passt.
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.

  - type: projectGrid
    id: projekte
    kicker: Referenzen
    headline: Ein paar Nächte, die wir nicht vergessen.
    text: 30 bis 50 Shows im Jahr, von 50 bis 600 Drohnen. Eine kleine Auswahl.
    limit: 4
    cta: { label: Alle Referenzen, href: /referenzen/ }

  # Ablauf in Zahlen (Marc, 31.10.2026): Nutzen statt Prozessbeschreibung, wie schnell es gehen kann, gemischt mit
  # „In Zahlen statt in Adjektiven“. Quellen: Fragebogen 21.10. (48 h, 1–2 Monate ideal, Express in 1–2 Wochen, PUMA-Anfrage
  # ca. 14 Tage vor dem Derby, ca. 3 h Aufbau). Entwurf für Moritz.
  - type: tempo
    id: ablauf
    kicker: Ablauf in Zahlen
    headline: Von der Anfrage bis zum Showabend.
    text: Ideal sind ein bis zwei Monate Vorlauf. Wenn es eilt, geht es auch in ein bis zwei Wochen.
    marks:
      - { value: { fact: responseHours, display: hours }, label: bis zu unserer Antwort, text: "Meist schneller, per Mail, Telefon oder Videocall." }
      - { value: 1–2 Monate, label: "Vorlauf, ideal", text: Genug Zeit für eure Freigaben im Design und für die Genehmigung. }
      - { value: 3 h, label: Aufbau am Showtag, text: "Unser Team baut auf, fliegt die Show und packt wieder ein." }
    shortcut: { value: Express in 1–2 Wochen, label: bei Bedarf zubuchbar, text: "Für PUMA kam die Anfrage 14 Tage vor dem Derby, die Show flog pünktlich zum Anstoß.", href: "/kontakt/?extras=express" }
    facts:
      - { value: { fact: showsTotal, display: shows }, label: Erfahrung, text: "Seit August 2022, Stand Oktober 2026" }
      - { value: 600 Drohnen, label: Größte Show, text: "Musical Bokkenrijders in Maastricht, an 20 Abenden" }
      - { value: Design · Genehmigung · Flotte, label: Aus einer Hand, text: "Eigenes Design-Team, eigene Genehmigung, eigene Drohnen" }

  # Presse und Qualität (Marc, 31.10.2026): weiter unten, nach dem Ablauf. Logos von LBA, EASA und naturstrom tragen,
  # TÜV-Gutachten und Haftpflicht stehen klein darunter. LBA- und EASA-Logo zeigt die Live-Seite heute schon; Nutzungsregeln
  # beider Behörden und die naturstrom-Freigabe sind noch zu klären (recherche-runde-2.md, Abschnitt 4).
  - type: logoBar
    id: presse
    kicker: Presse & Qualität
    # Marc, 31.10.2026: Logos zeigen, Freigaben werden angenommen (vor Livegang bei FlyingStars bestätigen lassen;
    # namentlich belegt sind nur ntv und WAZ). Ohne cleared erscheint der Name als Text.
    pressItems:
      - { name: ZDF, logo: /brand/logos/presse-zdf.svg, cleared: true, knock: true, note: "1, 2 oder 3" }
      - { name: WDR, logo: /brand/logos/presse-wdr.svg, cleared: true, note: Fernsehen und Interviews }
      - { name: ntv, logo: /brand/logos/presse-ntv.svg, cleared: true, knock: true, note: Startup News, href: "https://www.n-tv.de/mediathek/magazine/startup_news/Drohnen-verwandeln-Nachthimmel-in-Showbuehne-article25835436.html" }
      - { name: tagesschau, logo: /brand/logos/presse-tagesschau.svg, cleared: true, note: "#Böllerciao in Berlin" }
      - { name: Tagesspiegel, logo: /brand/logos/presse-tagesspiegel.svg, cleared: true, note: "#Böllerciao in Berlin" }
      - { name: WAZ, logo: /brand/logos/presse-waz.svg, cleared: true, note: Ruhrorter Hafenfest, href: "https://www.waz.de/lokales/duisburg/article409722481/ruhrorter-hafenfest-die-geheimnisse-hinter-dem-neuen-highlight.html" }
    quality:
      - { title: Betriebsgenehmigung des Luftfahrt-Bundesamts, text: seit Juli 2023, icon: permit, logo: /brand/logos/quali-lba-weiss.png, cleared: true }
      - { title: EU-weit nach EASA-Regeln, text: "Shows in der ganzen EU, auch in Österreich und den Niederlanden", icon: permit, logo: /brand/logos/quali-easa-weiss.png, cleared: true }
      - { title: 100 % Ökostrom von naturstrom, text: für die ganze Flotte, icon: leaf, logo: /brand/logos/quali-naturstrom.svg, cleared: true }
      - { title: Schallschutz-Gutachten, text: vom TÜV Nord, icon: sound, secondary: true }
      - { title: "Haftpflicht bis 1,3 Mio. €", text: in jedem Paket, icon: shield, secondary: true }
    todo: FlyingStars muss schriftliche Nutzungsfreigaben für Presse-, LBA-, EASA- und naturstrom-Logos sowie konkrete Beiträge von ZDF/WDR liefern. tagesschau und Tagesspiegel belegen bisher keinen namentlichen FlyingStars-Bezug.

  # Nachhaltigkeit als Scrollstory aus dem Prototyp (Marc, 31.10.2026). Nur Aussagen über die Show vor Ort (EmpCo).
  - type: sustainability
    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Kein Knall. Kein Rauch. Kein Müll.
    text: Was eine Drohnenshow vor Ort hinterlässt, ist die Erinnerung.
    facts:
      - { label: Kein Knall, value: leise, text: "Die Drohnen summen, laut ist nur eure Musik. Den Schallschutz hat der TÜV Nord in einem Gutachten untersucht." }
      - { label: Kein Rauch, value: "0", unit: g, text: "Keine Pyrotechnik, also kein Rauch und keine Schwermetalle über dem Publikum." }
      - { label: Kein Müll, value: "0", unit: kg, text: "Keine Hülsen, keine Reste. Dieselben Drohnen fliegen Show für Show." }
      - { label: Ökostrom, value: { fact: renewablePercent }, unit: "%", text: Ökostrom von naturstrom für unsere Akkus. }
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom, Herstellung und das TÜV-Nord-Schallschutzgutachten bereithalten.
    pillarsRef: sustainability-pillars

  - type: comparison
    id: vergleich
    kicker: Ehrlicher Vergleich
    headline: Drohne, Feuerwerk oder Laser?
    text: Jede Technik hat ihre Stärken. So unterscheiden sich die drei bei den Fragen, die am häufigsten kommen.
    rowHeader: Kriterium
    columns: [ Drohnenshow, Feuerwerk, Lasershow ]
    rows:
      - label: Logos und Schriftzüge am Himmel
        values: [ "Ja, auch in 3D", Nein, "Teilweise, nur auf Flächen oder Dunst" ]
        cells:
          - { label: Ja, text: auch in 3D, tone: y }
          - { label: Nein, text: "", tone: n }
          - { label: Teilweise, text: nur auf Flächen oder Dunst, tone: p }
      - label: Lautstärke
        values: [ "Leise, Musik nach Wahl", Sehr laut, Leise ]
        cells:
          - { label: Leise, text: Musik nach Wahl, tone: y }
          - { label: Sehr laut, text: "", tone: n }
          - { label: Leise, text: "", tone: y }
      - label: Rauch, Feinstaub, Müll vor Ort
        values: [ Keine, Viel, Dunst für sichtbare Strahlen nötig ]
        cells:
          - { label: Keine, text: "", tone: y }
          - { label: Viel, text: "", tone: n }
          - { label: Dunst, text: für sichtbare Strahlen nötig, tone: p }
      - label: Brandgefahr
        values: [ Keine, "Ja, Verbote bei Trockenheit", Keine ]
        cells:
          - { label: Keine, text: "", tone: y }
          - { label: Ja, text: Verbote bei Trockenheit, tone: n }
          - { label: Keine, text: "", tone: y }
      - label: Wind und Wetter
        values: [ "Bis Windstärke 5, kein Starkregen", Bei Sturm abgesagt, "Robust, auch drinnen" ]
        cells:
          - { label: Grenze, text: "bis Windstärke 5, kein Starkregen", tone: p }
          - { label: Grenze, text: bei Sturm abgesagt, tone: p }
          - { label: Robust, text: auch drinnen, tone: y }
      - label: Sichtbar aus der Ferne
        values: [ Kilometerweit, Kilometerweit, "Begrenzt, wirkt am besten aus der Nähe" ]
        cells:
          - { label: Kilometerweit, text: "", tone: y }
          - { label: Kilometerweit, text: "", tone: y }
          - { label: Begrenzt, text: wirkt am besten aus der Nähe, tone: p }
    note: Entwurf · fachliche Prüfung ausstehend
    todo: FlyingStars muss den Vergleich fachlich prüfen, insbesondere pauschale Aussagen zu Brandgefahr, Lautstärke und Umweltwirkung; der Block ist bereits als Entwurf gekennzeichnet.

  - type: team
    id: team
    kicker: Team
    headline: Die Menschen hinter dem Himmel.
    text: Ronja, Florian und Erwin führen FlyingStars gemeinsam. Ihr erreicht uns als Team, und am Showabend stehen wir selbst mit auf dem Feld.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    note: Dazu eine Crew aus Pilot:innen und Techniker:innen, die jede Show vor Ort aufbaut und fliegt.
    cta: { label: Mehr über uns, href: /ueber-uns/ }
    todo: FlyingStars muss hochauflösende Porträts von Ronja, Florian und Erwin sowie Fotos von Patrick und Alejandro liefern; die vorhandenen Porträts messen nur 199 × 199 Pixel.

  - type: faq
    id: faq
    kicker: FAQ
    headline: Was ihr vor der Anfrage wissen solltet.
    cta: { label: Alle Fragen, href: /faq/ }
    openFirst: true
