    cards:
      - ref: spotify-luciano-apache
        title: Spotify
        kicker: Visual album release
        text: When Luciano and Apache 207 collaborate, something big happens. For the release of their new EP, we staged it visually with 350 drones above Prenzlauer Berg.
        _key: k_78b56031fa52bc4e444c
      - ref: loreal-prada-rheinturm
        title: L’Oréal x Prada
        kicker: A product launch nobody could miss
        text: "A perfume that shines brighter than the Rhine Tower: with 350 drones in the heart of Düsseldorf, we staged a performance that was shared hundreds of times."
        _key: k_da7261ca4e5d1bd54a6d
      - ref: exploring-reinvented-der-neue-ford-explorer
        title: Ford
        kicker: Vehicle launch
        text: For the launch of the new Ford Explorer, 350 drones wrote the lettering above the Electric Vehicle Center in Cologne.
        _key: k_d03a5549db87ffe48729
      - ref: nfl-berlin-game
        title: NFL
        kicker: Sports event
        text: For the NFL Berlin Game 2025, 300 drones flew the Indianapolis Colts horseshoe above the Olympiastadion.
        _key: k_de73f7479d245b809aec
      - ref: puma-bundesliga
        title: PUMA
        kicker: Short notice
        text: "The request came 14 days before the derby: 100 drones showed the PUMA logo right on time for kick-off at Borussia-Park."
        _key: k_87ccd298edb04bc4e9f7
      - ref: eon-hamburg
        title: E.ON
        kicker: The Future is Now
        text: With 500 drones, we turned the Port of Hamburg into the biggest stage of the E.ON New Energy Experience 2026. The tribute to the Hanseatic city thrilled thousands of spectators.
        _key: k_c4bbae2e1586193f7306
    _key: k_1f617bd698f4f907e713
  - type: landingFlow
    id: ablauf
    kicker: Process
    headline: Three steps to your *show*
    steps:
      - title: "#1 Enquiry"
        text: Tell us the date, place and occasion. We get back to you within 48 hours to arrange an initial call. A site visit is rarely needed.
        duration: 48 h
        gate: false
        _key: k_e01bd8edb2e65fef3485
      - title: "#2 Planning"
        text: We develop the choreography, including motifs and music. You are as involved as you want to be. With the landowners' consent, we obtain all permits.
        duration: possible in under 2 weeks
        gate: false
        _key: k_b22b05daa48eb35fd92c
      - title: "#3 Show day"
        text: "We take care of everything: set-up three and a half hours before the performance, safety, dismantling. The drone advertising itself runs for up to 25 minutes."
        duration: 3.5 h set-up · show up to 25 min
        gate: false
        _key: k_9ebfd8a7c65e0d2211e6
    _key: k_a7152263e0461f67ead9
  - type: landingSite
    id: standort
    kicker: Site
    todo: "FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Schriftliche Nutzungsfreigaben für LBA-, EASA- und naturstrom-Logos fehlen."
    headline: Is your site suitable?
    text: Send us the address and the planned position of your audience. Before quoting, we check whether and how a show is possible there.
    variant: outdoor
    safetyRef: safety-concept
    _key: k_c4fd3256a7a568abb827
    quality:
