  - type: landingFlow
    id: ablauf
    kicker: Verloop
    headline: Wij plannen, jullie *leunen achterover*
    steps:
      - title: "#1 Aanvraag"
        text: Wanneer en waar trouwen jullie? Binnen 48 uur nemen we contact op om kennis te maken en jullie een vaste offerte te doen. Een bezoek aan jullie locatie is zelden nodig.
        duration: 48 u
        gate: false
        _key: k_6b92c66eeb04fdf588fc
      - title: "#2 Voorbereiding"
        text: Jullie vertellen ons jullie liefdesverhaal. Wij maken er een choreografie van. En omdat het plannen van een bruiloft al stressvol genoeg is, regelen we ook vergunningen en dergelijke.
        gate: false
        _key: k_54439060443f507bff93
      - title: "#3 Bruiloft"
        text: Vanaf drieënhalf uur voor de dronedans bereiden we alles voor. De show zelf duurt tot 25 minuten. Jullie mogen kijken en genieten – opbouw, afbouw en veiligheid regelen wij.
        duration: 3,5 u vooraf · show tot 25 min
        gate: false
        _key: k_77816c393a12e22dfcb5
    _key: k_bd1dd6072c1145a15939
  - type: landingCta
    headline: Wordt het een *verrassing*?
    text: Of het nu een aanzoek of een cadeau van de familie is, we stemmen alleen met jullie af. De startzone richten we uit het zicht in en de timing regelen we met de locatie.
    button:
      label: Vraag een verrassingsshow aan
      href: "#anfrage"
    _key: k_ae4a2fbaa25b27dc1ad0
  - type: team
    id: ueber
    kicker: Over FlyingStars
    todo: FlyingStars muss ein Teamfoto liefern.
    cta:
      label: Over ons
      href: /ueber-uns/
    headline: Het is ons een *eer* om jullie gasten te mogen zijn
    text: Normaal gesproken vliegen we voor steden, festivals en wereldconcerns als L’Oréal, Prada of Spotify. Maar een bijzondere plek in ons fotoalbum hebben de bruidsparen van wie we de bruiloft onvergetelijk mochten maken. Daarom zijn we een van de weinige aanbieders die ook voor privéfeesten vliegen. Op jullie feest zorgen we met een kleine crew op de achtergrond dat alles soepel verloopt.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    _key: k_3ed49f154258b655d578
  - type: contactForm
    kicker: Droneshow voor de bruiloft boeken
    headline: Laten we jullie choreografie plannen
    text: Reserveer jullie trouwdatum op tijd, stel ons jullie vragen of vertel ons over jullie showidee. We antwoorden binnen 48 uur.
    _key: k_f7f1d08aab8e84a827cd
