            _key: k_adbef3f274951eda7f54
        _key: k_bf63937c697c823dc996
    closing:
      headline: Is jullie hal geschikt?
      text: Stuur ons foto's of een plattegrond met de plafondhoogte. We laten jullie binnen 48 uur weten wat daar mogelijk is.
      button:
        label: Vraag een indoor-offerte aan
        href: "#anfrage"
    _key: k_2957e41a82a467bac50c
  - type: faq
    id: fragen
    kicker: FAQ
    headline: Vragen over indoor-shows.
    cta:
      label: Alle vragen
      href: /faq/
