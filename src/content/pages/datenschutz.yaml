title: Datenschutz
description: "Hinweise zur FlyingStars-Vorschau: selbst gehostete Schriftarten, Medien und Kontaktformular sowie die Datenschutzerklärung der bestehenden Website."
noindex: true
sections:
  - type: textMedia
    headline: Datenschutz in dieser Vorschau
    body: |
      Die Schriftarten und Vorschaubilder werden über diese Website ausgeliefert. Videos werden erst gestartet, wenn du sie ausdrücklich anklickst. Die Vorschau verwendet kein Analyse-Tracking.

      Der Formularversand ist noch nicht eingerichtet. Ohne diese Einrichtung werden deine Angaben nicht gespeichert oder per E-Mail versendet; du erhältst eine entsprechende Rückmeldung.

      Die veröffentlichten Datenschutzinformationen findest du in der [Datenschutzerklärung der bestehenden FlyingStars-Website](https://flyingstars.art/datenschutz/). Die Erklärung für diese neue Website muss vor ihrer endgültigen Veröffentlichung ergänzt und geprüft werden.
