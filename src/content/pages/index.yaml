  - type: steps
    id: ablauf
    kicker: Ablauf
    headline: Von der Idee bis zur Landung.
    text: Du bist so viel oder so wenig eingebunden, wie du möchtest. Wir kommen mit
      Lösungen, nicht mit Problemen.
    steps:
      - title: Anfrage
        text: Erzähl uns Datum, Ort und Anlass. Wir melden uns innerhalb von 48 Stunden
          – meist deutlich schneller.
        duration: 48 h Antwortzeit
      - title: Standort & Angebot
        text: Wir prüfen den Showbereich von rund 100 × 100 Metern und schicken dir ein
          Festpreis-Angebot, das du online annimmst.
        duration: Festpreis
      - title: Genehmigung
        text: Wir holen alle luftrechtlichen Genehmigungen ein. Von dir brauchen wir nur
          die Zustimmung der Grundstückseigentümer:innen.
        duration: LBA · EASA
      - title: Design
        text: "Motive, Storyline und Musik entwickeln wir gemeinsam: erst als
          Rohanimation, dann mit Farben und Lichteffekten im Takt."
        duration: Entwürfe & Feedback
      - title: Showtag
        text: Rund drei Stunden Aufbau, ein Team aus Pilot:innen und Techniker:innen vor
          Ort – du genießt mit deinen Gästen.
        duration: ca. 3 h Aufbau
  - type: metrics
    id: warum
    kicker: Warum FlyingStars
    headline: In Zahlen statt in Adjektiven.
    text: Wir erklären keine Drohnenshows mehr. Wir zeigen, was nach über 150 Shows
      selbstverständlich ist.
    items:
      - label: Erfahrung
        value: 150+ Shows
        text: Seit 2022 für Marken, Städte, Festivals und Paare – in Deutschland und
          ganz Europa.
      - label: Tempo
        value: 1–2 Wochen
        text: So schnell kann eine Show im Express stehen. Ideal sind 1–2 Monate
          Vorlauf.
      - label: Aus einer Hand
        value: Design · Genehmigung · Flotte
        text: Eigenes Design-Team, eigene LBA- und EASA-Genehmigungen, eigene Drohnen.
      - label: Preis
        value: ab 7.900 €
        text: Drei Pakete mit festen Preisen. Gleiches Angebot günstiger gesehen? Wir
          ziehen mit.
      - label: Sicherheit
        value: LBA · EASA · TÜV Nord
        text: Leichte Drohnen mit rund 300 g, redundante Sicherheitssysteme, Haftpflicht
          in jedem Paket.
      - label: Klima
        value: 100 % Ökostrom
        text: Kein Feinstaub, kein Müll, kein Knall. Unsere Drohnen werden in der EU
          gebaut und fliegen Show für Show.
  - type: projectGrid
    id: projekte
    kicker: Projekte
    headline: Ein paar Nächte, die wir nicht vergessen.
    text: "Über 30 Shows im Jahr, von 100 bis 600 Drohnen. Eine kleine Auswahl:"
    limit: 4
    cta:
      label: Alle Projekte
      href: /projekte/
  - type: sustainability
    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Kein Knall. Kein Rauch. Kein Müll.
    lines:
      - Kein Knall.
      - Kein Rauch.
      - Kein Müll.
    text: "Nach unserer Show bleibt nur die Erinnerung – kein Rauch über der Stadt,
      nichts auf dem Boden. Vier Zahlen, die den Unterschied machen:"
    facts:
      - label: Kein Knall
        value: leise
        text: Statt Knall nur ein Summen – schont Anwohner:innen, Haus- und Wildtiere.
      - label: Kein Rauch
        value: "0"
        text: Feinstaub, Stickoxide oder Schwermetalle vor Ort – nichts landet in Luft,
          Boden oder Grundwasser.
        unit: g
        tone: o
      - label: Kein Müll
        value: "0"
        text: Müll nach der Show. Keine Hülsen, keine Reste – dieselbe Flotte fliegt
          Show für Show.
        unit: kg
      - label: Ökostrom
        value: "100"
        text: Ökostrom von naturstrom.
        unit: "%"
        tone: g
    proofImage:
      src: https://flyingstars.art/wp-content/uploads/2024/10/NATURSTROM-Logo_weiss.png
      alt: naturstrom
      width: 500
      height: 100
    proofText: Unser Strom kommt zu 100 % von naturstrom, zusätzlich leisten wir
      über ClimatePartner einen Klimabeitrag.
    campaign: Für die Kampagne der Deutschen Umwelthilfe haben wir im November 2023
      über dem Cantianstadion in Berlin 150 Drohnen fliegen lassen – als Beweis,
      dass Silvester auch ohne Böller wunderschön sein kann.
