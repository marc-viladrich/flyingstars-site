  - type: landingTeaser
    id: choreografie
    kicker: Choreografie op maat
    headline: Zo uniek als jullie *lovestory*
    text: Een zwerm stralende lichtshowdrones tekent jullie initialen, liefdesverklaringen en insiders aan het firmament. Afgestemd op de muziek en op maat van jullie wensen.
    href: /drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator
    cta: Bekijk beelden in de configurator
    loop: hochzeit
    _key: k_52056666f5076b5e0423
  - type: sustainability
    id: familienfreundlich
    kicker: Gezinsvriendelijk
    headline: Kinderen en *honden* welkom
    text: Anders dan bij vuurwerk is er bij een droneballet geen harde knal, geen storende rook en geen afval met brandgevaar. Alleen een zacht gezoem – en de verwondering van de gasten.
    _key: k_59a09168d2946ce16e34
    scene: chopper-play
  - type: landingBento
    id: vorteile
    kicker: Voordelen
    headline: Onze beloften
    lead:
      title: Alles inbegrepen
      text: "Ontwerp, muziek, show, vergunningen: wij nemen jullie alles uit handen, alles uit één hand."
      icon: heart-handshake
    items:
      - icon: globe
        title: Internationaal
        text: "Waar jullie ook feesten, wij zijn erbij: in Duitsland, Oostenrijk, Zwitserland of wereldwijd."
        _key: k_f070569c03c9b4b11034
      - icon: shield-check
        title: Veilig
        text: We zijn LBA- en EASA-gecertificeerd en zorgen voor een veiligheidszone van 100 x 100 meter.
        _key: k_85e68777aa937b3e85b1
    _key: k_9d2cf9c04b90b456039c
  - type: landingRefs
    id: referenzen
    kicker: Referenties
    headline: Nachten die we *nooit vergeten*
    projects:
      - heiratsantrag-hugenpoet
      - hochzeit-recklinghausen
    cards:
      - ref: heiratsantrag-hugenpoet
        title: Huwelijksaanzoek in Essen
        kicker: Ze zei ja!
        text: Met 220 drones mochten we onze klant Armin helpen zijn Berina voor zich te winnen. Begeleid door een violiste hulden we de hemel boven Schloss Hugenpoet in teder wit.
        _key: k_1cd45074068daabdd5a2
      - ref: hochzeit-recklinghausen
        title: Bruiloft in Recklinghausen
        kicker: Verrassing voor het bruidspaar
        text: Veronika en Felix keken hun ogen uit toen hun liefdesverhaal plotseling boven hen oplichtte. Op verzoek van de familie mochten we de choreografie in het geheim voorbereiden.
        _key: k_0df1ee61f7ea5938057b
    _key: k_6500b76af74b7dd741ca
