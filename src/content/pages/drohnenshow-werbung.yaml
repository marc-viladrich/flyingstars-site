  # Vorteile als Kacheln wie „Agenturen“ im Prototyp: „Wir fliegen, ihr glänzt“ als große Aussage, zwei Icon-Kacheln,
  # darunter der Agentur-Abschluss mit Gesichtern (Text aus dem Prototyp). #agenturen ist Ziel der Agentur-Links.
  - type: landingBento
    id: agenturen
    kicker: Vorteile
    headline: Unsere Erfahrung aus 150+ B2B-Shows
    lead:
      icon: sparkles
      title: Wir fliegen, *ihr glänzt*
      text: Gerne unterschreiben wir NDAs für eure Werbe- oder Marketing-Agentur.
    items:
