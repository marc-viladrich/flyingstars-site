    kicker: Droneshow voor de bruiloft boeken
    headline: Schilder jullie liefdesverhaal aan de hemel
    text: Mogen we jullie ten dans vragen? Op jullie bruiloft brengt onze droneshow jullie sprookje tot leven. Voor ontroerende momenten en een hoogtepunt in de trouwvideo.
