  # „Faszinierend wie Feuerwerk, sicher wie Laser“: Moritz hat den Vergleich Drohne/Feuerwerk/Laser ausgeschlossen (Marc,
  # 17.11.2026). Seine drei Absätze stehen links, rechts spielt die Indoor-Reihe (Marc, 18.11.2026: „Hier würde eigentlich
  # auch eine Animations-Reihe wie auf der Startseite sehr gut passen“; show: indoor, scripts/himmel/folge.js).
  - type: sustainability
    id: unterschied
    kicker: Alternative zur Lichtshow
    headline: Faszinierend wie *Feuerwerk*, sicher wie Laser
    text: |-
      Wir holen das Funkeln, den Glanz und die staunenden Gäste des Feuerwerks unter euer Dach. Ohne Abfall, Rauch und nur mit einem leisen Surren.

      Eure Indoor-Drohnenshow ist eine {{duration.indoor.min}}- bis {{duration.indoor.max}}-minütige Choreografie, die die Aufmerksamkeit aller Besucher:innen fesselt. Denn kaum ein Gast hat bereits einen der magischen Tänze gesehen – geschweige denn im Innenraum.

      Deshalb gestalten wir faszinierende Motive unterlegt mit Musik, die eure Geschichte erzählen. Ab 50 Drohnen auch mit individuellen Figuren wie eurem Logo oder euren Initialen.
    show: indoor
    cta: { label: Show anfragen, href: "#anfrage" }
    _key: k_c030e32b9a3f99dac46e

