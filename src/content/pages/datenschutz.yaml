# Vorläufiger Hinweis für die Vorschau. Die Datenschutzerklärung der neuen Website muss FlyingStars bzw. deren
# Datenschutzberatung schreiben oder freigeben (Hosting, Formulardienst, Calendly, WhatsApp-Link, Videos).
title: Datenschutz
description: "Datenschutzhinweise zur FlyingStars-Vorschau: selbst ausgelieferte Schriften und Bilder, Videos erst auf Klick, kein Analyse-Tracking."
noindex: true
sections:
  - type: textMedia
    headline: Datenschutz in dieser Vorschau
    body: |
      Schriften und Vorschaubilder liefert diese Website selbst aus. Videos starten erst, wenn ihr sie ausdrücklich anklickt. Die Vorschau verwendet kein Analyse-Tracking.

      Der Formularversand ist noch nicht eingerichtet. Bis dahin werden eure Angaben weder gespeichert noch per E-Mail verschickt, und ihr bekommt dazu eine Rückmeldung.

      Die geltenden Datenschutzinformationen findet ihr in der [Datenschutzerklärung der bestehenden FlyingStars-Website](https://flyingstars.art/datenschutz/). Für die neue Website wird die Erklärung vor der Veröffentlichung ergänzt und geprüft.
