    kicker: Process
    headline: An established process
    marks:
      - value: 48 h
        label: "#1 Enquiry"
        text: Tell us the date, place and occasion, and we will get back to you with ideas within 48 hours. An initial call is the next step; an on-site visit is rarely needed.
        _key: k_bcd783da285c16316e38
      - value: < 2 weeks
        label: "#2 Planning"
        text: We build the storyline and motifs. You are welcome to bring in your wishes. We also take care of all permits; you only provide the landowners' consent.
        _key: k_1a7a9d6124366c37cbbf
      - value: 3.5 h
        label: "#3 Show day"
        text: While you look after your guests, we set up (three and a half hours), perform the show (five to eight minutes) and quietly dismantle again.
