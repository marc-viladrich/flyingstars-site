title: Privacy
description: Voorlopige privacyinformatie over hosting, het contactformulier en media in de FlyingStars-preview. Juridische toetsing volgt nog.
noindex: true
sections:
  - type: textMedia
    headline: Privacy in deze preview
    body: |
      **Concept voor juridische toetsing.** Deze informatie beschrijft het technische prototype. FlyingStars en de privacyadviseur moeten deze vóór productiegebruik aanvullen en goedkeuren. Als e-mailverzending ontbreekt, betekent dat niet dat de hosting geen gegevens verwerkt.

      Verwerkingsverantwoordelijke is FlyingStars GmbH, Bulmker Straße 107, 45888 Gelsenkirchen, Duitsland. Jullie bereiken ons via [team@flyingstars.art](mailto:team@flyingstars.art). Verdere bedrijfsgegevens staan in het [colofon](/nl/impressum/).

      **Hosting.** De preview draait op Cloudflare Pages en een Cloudflare Pages Function. Cloudflare verwerkt bij een bezoek technische verbindingsgegevens, met name het IP-adres, en bij het versturen de formuliergegevens. Cloudflare is een Amerikaanse aanbieder; de standaarddienst garandeert geen uitsluitende verwerking binnen de EU. De rechtsgrond voor een veilige beschikbaarstelling is artikel 6, lid 1, onder f AVG, ons gerechtvaardigd belang bij het beheer en de bescherming van de website. De verwerkersovereenkomst, toepasselijke waarborgen voor doorgifte naar derde landen en feitelijke bewaartermijnen voor logs moeten vóór de livegang worden gecontroleerd en hier worden geconcretiseerd.

      **Jullie aanvraag.** We gebruiken jullie gegevens om de aanvraag te behandelen en te beantwoorden en een mogelijke offerte voor te bereiden. Het formulier vraagt naar de gelegenheid, plaats of postcode, datum of open datum, naam en e-mailadres. Pakket, extra’s, telefoon, bedrijf, herkomst van de aanbeveling en bericht zijn vrijwillig. De herkomst helpt ons te begrijpen hoe jullie ons vinden; deze is niet nodig voor een offerte. Stuur geen gezondheidsgegevens of andere bijzonder gevoelige informatie.

      Voor noodzakelijke precontractuele stappen op jullie verzoek kan artikel 6, lid 1, onder b AVG van toepassing zijn. Bij algemene vragen en zakelijke contactpersonen die zelf geen contractspartij worden, dient de verwerking ons gerechtvaardigd belang bij het beantwoorden van vragen en het aangaan van zakelijke contacten volgens artikel 6, lid 1, onder f AVG. De analyse van de vrijwillige herkomstinformatie vraagt om een afzonderlijke onderbouwing. Dit formulier wordt niet gebruikt voor een nieuwsbrief.

      De gegevens worden naar de Cloudflare Function gestuurd. Als verzending is ingesteld, stuurt deze ze via Brevo door naar ons aangewezen e-mailpostvak. Brevo is de beoogde verzenddienst, geen nieuwsbrieflijst. Als verzending niet is ingesteld, meldt het formulier dit; de formulierapplicatie slaat de aanvraag dan niet blijvend op en verstuurt geen e-mail. De feitelijke verzendconfiguratie is voor dit concept niet gecontroleerd.

      De applicatie houdt geen logs met berichten of IP-adressen bij en heeft geen eigen database voor aanvragen. Als verzending is ingesteld, kunnen gegevens wel bij Brevo, in het ontvangende postvak en in back-ups worden opgeslagen. We verwijderen aanvragen zodra het verwerkingsdoel vervalt, voor zover wettelijke bewaarplichten of andere toegestane gronden zich daar niet tegen verzetten. **Vóór de livegang aan te vullen:** het ontvangende postvak en de aanbieder daarvan, de contractspartij en subverwerkers van Brevo, waarborgen voor doorgifte naar derde landen en concrete verwijdertermijnen voor onder meer verzendlogs, back-ups en hostinglogs.

      **Bescherming tegen misbruik.** Het formulier gebruikt een verborgen lokveld en bij ingeschakeld JavaScript een korte tijdcontrole. Hiervoor worden geen cookies geplaatst en geen externe controlediensten in de browser geladen. De Function geeft jullie IP-adres niet door aan Brevo en ook niet als aanvullende controleparameter aan Turnstile. Een controlepad voor Turnstile is technisch voorbereid; er is geen widget in het prototype opgenomen. Activering vraagt om een afzonderlijke privacytoets en bijgewerkte informatie.

      **Bestanden en vooraf ingevulde gegevens.** Het contactformulier accepteert geen bestanden. Een logo dat in de showconfigurator is gekozen, wordt lokaal in de browser verwerkt en niet als bestand meegestuurd. Eigen tekst en de showsamenvatting kunnen bij de overstap naar de aanvraag wel in de URL staan. Daardoor bereiken ze de hostingaanbieder al bij het openen van de pagina. Nadat deze twee gegevens in het formulier zijn overgenomen, verwijdert het script ze uit de zichtbare URL. Pas bij het versturen gaan ze als onderdeel van het bericht naar de verzenddienst.

      **Media en browseropslag.** Lettertypen en geoptimaliseerde afbeeldingen worden in de websitebuild aangeboden. Video’s gebruiken in de productiebuild een eigen media-endpoint; sommige starten automatisch. Dit endpoint haalt ze op de server op uit vastgelegde bronnen van de bestaande website en het Vercel-prototype. De standaardbuild bevat geen ingesloten YouTube-spelers, kaarten of actieve analysediensten. Jullie keuze om beweging te pauzeren wordt voor de sessie in de browser opgeslagen. De preview bevat links naar Calendly, WhatsApp en sociale netwerken. Bij het openen geldt ook de privacyinformatie van de betreffende aanbieder. De definitieve mediaopslag en alle actieve diensten moeten vóór publicatie opnieuw worden gecontroleerd.

      **Optionele analyse en advertentiemeting, concept voor juridische toetsing.** Een ingestelde build biedt vrijwillig Google Analytics 4 voor bezoekersstatistieken en Google Ads om geslaagde aanvragen aan advertenties toe te schrijven. Zonder ingestelde Google-identificatoren blijven beide diensten en het toestemmingsvenster uitgeschakeld. De aanbieder is Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ierland. Google kan cookies, identificatoren, gebruiks- en verbindingsgegevens inclusief het IP-adres verwerken. Doorgifte aan Google LLC in de VS is mogelijk. Uitsluitende verwerking in de EU wordt niet gegarandeerd.

      Bij ingeschakelde Google-diensten laden we de Google-bibliotheek pas na toestemming voor het betreffende doel. De rechtsgrondslagen zijn § 25 lid 1 TDDDG voor niet-noodzakelijke opslag of toegang op jullie apparaat en artikel 6 lid 1 onder a en artikel 7 AVG voor de daaropvolgende verwerking. Analyse en advertentiemeting zijn afzonderlijk te kiezen. Gepersonaliseerde advertenties en remarketing staan in dit prototype niet aan. De website en het aanvraagformulier werken zonder toestemming. Een bezoek aan een contact- of bedankpagina telt niet als geslaagde aanvraag. Alleen een door onze mailprovider geaccepteerde aanvraag activeert met de bijbehorende toestemming een melding van een geslaagde aanvraag in Google Ads en GA4. Daarbij gebruiken we een willekeurige aanvraagreferentie; formulierinhoud en gehashte e-mailadressen worden niet doorgegeven.

      Het lokaal gebundelde open-source CookieConsent-venster bewaart jullie keuzes met tijdstip en revisie 180 dagen in lokale browseropslag, ook bij weigering. Dit dient alleen om jullie keuze te respecteren. Voor deze noodzakelijke opslag kan § 25 lid 2 nr. 2 TDDDG van toepassing zijn; de privacygrondslag en bewijsplichten moeten definitief worden getoetst. Via “Privacyinstellingen” in de footer kunnen jullie toestemming altijd wijzigen of intrekken. Bij een actieve dienst kan opnieuw laden nodig zijn. Intrekken geldt voor de toekomst en verwijdert eerder doorgestuurde gegevens niet automatisch.

      **Voor goedkeuring aanvullen:** werkelijk gebruikte diensten en doelen, Google-identificatoren, cookienamen en hun werkelijke looptijden, GA4-bewaartermijnen en gebeurtenisinstellingen, de Ads-conversieactie, accountkoppelingen, rollen en overeenkomsten en toepasselijke waarborgen voor doorgifte naar derde landen. Controleer voor gebruik de actieve DPF-vermelding van de werkelijke Amerikaanse ontvanger in het [officiële register](https://www.dataprivacyframework.gov/list). De technische blokkering en Consent Mode vervangen deze toetsing of geldige toestemming niet. Meer informatie staat in [het privacybeleid van Google](https://policies.google.com/privacy?hl=nl). Er is nog geen alternatieve statistiekdienst geïntegreerd.

      **Jullie rechten.** Onder de wettelijke voorwaarden hebben jullie recht op inzage, rectificatie, verwijdering, beperking en gegevensoverdraagbaarheid. Tegen verwerking op basis van gerechtvaardigde belangen kunnen jullie volgens artikel 21 AVG bezwaar maken. Jullie kunnen een klacht indienen bij een privacytoezichthouder, met name de [Landesbeauftragte für Datenschutz und Informationsfreiheit Nordrhein-Westfalen](https://www.ldi.nrw.de/). Een eventueel aangestelde functionaris voor gegevensbescherming en de volledige informatie volgens artikel 13 AVG moeten vóór de livegang worden toegevoegd.

      Het [privacybeleid van de bestaande FlyingStars-website](https://flyingstars.art/datenschutz/) vervangt de toetsing van deze nieuwe infrastructuur niet.
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben. Auch die EN-/NL-Fassungen brauchen eine rechtliche und sprachliche Prüfung.
