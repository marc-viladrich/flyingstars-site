  - type: textMedia
    id: warum-drohnen
    kicker: Droneshows op maat
    headline: Vuurwerk? *Dat was gisteren*
    body: |-
      Welkom in de toekomst van entertainment. Dronelichtshows zijn het alternatief voor gasten die pyrotechniek wel gezien hebben.

      Ze zijn **spectaculairder**: 3D in plaats van 2D, kilometers ver zichtbaar, nog nauwelijks bekend – aandacht gegarandeerd.

      **Emotioneler**: knallers knallen. Droneshows vertellen verhalen die enthousiast maken en raken.

      En **unieker**: met 100 tot 1000+ lichtpixels kunnen we bijna elk motief bouwen.

      Hoe ziet jullie verhaal eruit, getekend aan de hemel? Laten we het ontdekken!
    mediaSide: right
    cta:
      label: Droneshow plannen
      href: /drohnenshow-preise/
    _key: k_55390b5c7d73f75ab4f2
