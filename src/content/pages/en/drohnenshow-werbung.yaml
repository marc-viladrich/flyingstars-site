      - name: E.ON
        file: /brand/logos/kunde-eon-weiss.svg
      - name: REWE
        file: /brand/logos/kunde-rewe-weiss.svg
      - name: Bosch
        file: /brand/logos/kunde-bosch-weiss.svg
      - name: Amazon
        file: /brand/logos/kunde-amazon-weiss.svg
      - name: McKinsey
        file: /brand/logos/kunde-mckinsey-weiss.svg
      - name: Bulgari
