  - type: sustainability
    id: nachhaltigkeit
    kicker: Duurzaamheid
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom und das TÜV-Nord-Schallschutzgutachten bereithalten.
    headline: Geen knal. Geen afval. Geen rook.
    text: "Ook honden en kinderen zijn van harte welkom bij onze drone-evenementen: ze zijn afvalvrij, lokaal emissievrij en zoemen zachter dan vuurwerk. Met shows voor de Deutsche Umwelthilfe en Kein Bock auf Nazis zetten we bovendien regelmatig ecologische en sociale signalen aan de hemel."
    show: eco
    pillarsRef: sustainability-pillars
    cta:
      label: Over duurzaamheid
      href: /nachhaltigkeit/
    _key: k_001c02ae39915e989410
  - type: tempo
    id: ablauf
    kicker: Verloop
    headline: Van idee tot *applaus*
    marks:
      - value: 48 u
        label: "#1 Aanvraag"
        text: Vertel ons datum, locatie en gelegenheid. Binnen uiterlijk 48 uur geven we jullie een inschatting. Na het eerste gesprek ontvangen jullie de offerte; een bezichtiging is zelden nodig.
        _key: k_07593dae179ab85954fb
      - value: 1–2 weken
        label: "#2 Planning"
        text: Samen ontwikkelen we verhaallijn, motieven en muziek. Jullie zijn zo betrokken als jullie willen. Met toestemming van de grondeigenaren regelen wij alle vergunningen.
        _key: k_8712fd69e4210fc7f3f1
      - value: 3,5 u
        label: "#3 Showdag"
        text: We regelen veiligheid, opbouw en afbouw vanaf zo'n drieënhalf uur voor de show. Het spektakel duurt tot {{duration.outdoor.max}} minuten. Jullie genieten samen met jullie gasten.
        _key: k_002bb2a1e4204dd1d7d4
      - value: "tot {{duration.outdoor.max}} min"
        label: "Show, dan applaus"
        _key: k_3c30dd0af9bfae6075dc
