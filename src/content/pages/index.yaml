  # Anlässe nach den Zielgruppen aus Moritz' Notizen. Städte und Festivals haben noch keine eigene Seite.
  - type: occasions
    id: anlaesse
    headline: Wofür plant ihr eine Show?
    cards:
      - title: Unternehmen
        text: Logos, Produkte und Claims am Himmel, für Launches, Jubiläen und Drehs.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
          alt: Volkswagen-Logo aus Drohnen über dem Wolfgangsee, Gäste auf einer Terrasse
          width: 1920
          height: 1281
        facts:
          - Jedes Motiv gebt ihr vorab frei
          - Für Gäste, Mitarbeitende und die Kamera
        cta: { label: Drohnenshows für Marken, href: /drohnenshow-werbung/ }
      - title: Agenturen
        text: Wir fliegen für eure Kund:innen und bleiben auf Wunsch im Hintergrund.
        image:
          src: https://flyingstars-relaunch.vercel.app/media/projekte/ford.jpg
          alt: Ford-Schriftzug aus Drohnen über dem Werksgelände in Köln
          width: 1600
          height: 900
        facts:
          - NDA und Projektleitung auf Wunsch
          - Visualisierung mit dem Logo eurer Kund:innen
        cta: { label: Für Agenturen, href: "/drohnenshow-werbung/#agenturen" }
      - title: Städte & Gemeinden
        text: Stadtfeste, Jubiläen und Silvester ohne Pyrotechnik.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
          alt: Weltkugel aus Drohnen über dem Rhein bei der Extraschicht in Duisburg
          width: 2544
          height: 1493
        facts:
          - Stadtwappen, Jubiläumszahlen, eure Geschichte
          - 10 % Rabatt bei Buchung im Vorjahr
        cta: { label: Show für eure Stadt anfragen, href: "/kontakt/?anlass=stadt" }
        download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }
      - title: Festivals & Musicals
        text: Die Show als Höhepunkt, der die Geschichte eures Abends weitererzählt.
        image:
          src: https://flyingstars-relaunch.vercel.app/media/projekte/bokkenrijders.jpg
          alt: Schriftzug Bokkenrijders aus Drohnen über der Freilichtbühne in Maastricht, Publikum im Vordergrund
          width: 1600
          height: 900
        facts:
          - Jeden Abend dieselbe Show, auch 20-mal hintereinander
          - 10 % Rabatt bei Buchung im Vorjahr
        cta: { label: 600 Drohnen im Musical, href: /musikalischer-teaser-bokkenrijders/ }
      - title: Hochzeit & Privat
        text: Initialen, Herzen und euer Datum über der Feier.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/Hochzeit_cover.jpg
          alt: Zwei Blüten aus Drohnen am Abendhimmel über einer Hochzeitsfeier
          width: 1518
          height: 854
        facts:
          - Auch als Überraschung oder Heiratsantrag
          - SPARK ab 7.900 € netto
        cta: { label: Drohnenshow zur Hochzeit, href: /drohnenshow-hochzeit/ }
      - title: Indoor
        text: Für Messen, Bühnen und Hallen ab drei Metern Deckenhöhe.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
          alt: Leuchtende Drohnen in Formation vor der Bühne eines voll besetzten Saals
          width: 1200
          height: 764
        facts:
          - 20 bis 50 Drohnen, 5 bis 8 Minuten
          - Einzeln kalkuliert
        cta: { label: Indoor-Drohnenshows, href: /drohnenshow-indoor/ }

  - type: packages
    id: pakete
    compact: true
    headline: Drei Pakete mit festen Einstiegspreisen.
    text: Der Preis hängt davon ab, wie aufwendig die Bilder am Himmel sind und wie viele Drohnen fliegen.
    items:
      - { name: SPARK, label: Klassisch in 2D }
      - { name: HORIZON, label: 3D in Bewegung, badge: Am häufigsten gebucht, highlight: true }
      - { name: ODYSSEY, label: Erzählte 3D-Show }
    note: Alle Preise netto zzgl. Anfahrt
    cta: { label: Alle Leistungen und Preise, href: /drohnenshow-preise/ }

  - type: cta
    headline: Stellt eure Show *selbst* zusammen.
    text: Anlass und Paket wählen, Drohnenzahl einstellen, Vorschau ansehen. Mit eurer Auswahl fragt ihr direkt an.
    button: { label: Zum Show-Konfigurator, href: /show-konfigurator/ }

  - type: steps
    id: ablauf
    headline: Von der Anfrage bis zum Showabend.
    steps:
      - title: Anfrage
        text: Ihr schickt uns Datum, Ort und Anlass. Wir antworten innerhalb von 48 Stunden.
        duration: 48 h Antwortzeit
      - title: Standort und Angebot
        text: Wir prüfen, ob am Ort ein Showbereich von ca. 100 × 100 Metern möglich ist, und schicken euch ein Angebot.
      - title: Genehmigung
        text: Wir beantragen die Fluggenehmigung beim Luftfahrt-Bundesamt. Von euch brauchen wir nur die Zustimmung der Grundstückseigentümer:innen.
        duration: LBA · EASA
      - title: Motive mit Freigabe
        text: Erst seht ihr eine Rohanimation, dann kommt die Musik dazu, zuletzt Farben und Licht. Jeden Schritt gebt ihr frei.
      - title: Showtag
        text: Etwa drei Stunden vor der Show sperren wir die Startfläche. Unser Team aus Pilot:innen und Techniker:innen ist vor Ort.
        duration: ca. 3 h Aufbau

  - type: metrics
    id: warum
    headline: In Zahlen statt in Adjektiven.
    items:
      - label: Erfahrung
        value: 178 Shows
        text: Seit der ersten Show im August 2022, für Marken, Städte, Festivals und Paare. Stand Oktober 2026.
      - label: Größte Show
        value: 600 Drohnen
        text: Im Musical Bokkenrijders in Maastricht, im Juni 2026 an 20 Abenden.
      - label: Vorlauf
        value: 1–2 Monate
        text: Ideal für Design und Genehmigung. Alles unter 14 Tagen fliegen wir als Express.
      - label: Aus einer Hand
        value: Design · Genehmigung · Flotte
        text: Eigenes Design-Team, eigene Betriebsgenehmigung, eigene Drohnen.
      - label: Genehmigung
        value: LBA · EASA
        text: Unsere Betriebsgenehmigung des Luftfahrt-Bundesamts gilt in der ganzen EU.
      - label: Antwort
        value: 48 h
        text: So schnell melden wir uns auf jede Anfrage, per Mail, Telefon oder Videocall.

  - type: projectGrid
    id: projekte
    headline: Ein paar Nächte, die wir nicht vergessen.
    text: 30 bis 50 Shows im Jahr, von 50 bis 600 Drohnen. Eine kleine Auswahl.
    limit: 4
    cta: { label: Alle Referenzen, href: /referenzen/ }

  # Nachhaltigkeit in 2D, ohne Scrollstory und ohne naturstrom-Logo. Nur Aussagen über die Show vor Ort (EmpCo).
  - type: sustainability
    id: nachhaltigkeit
    headline: Kein Knall. Kein Rauch. Kein Müll.
    text: Was eine Drohnenshow vor Ort hinterlässt, ist die Erinnerung.
    facts:
      - { label: Lautstärke, value: leise, text: "Die Drohnen summen, laut ist nur eure Musik. Den Schallschutz hat der TÜV Nord in einem Gutachten untersucht." }
      - { label: Feinstaub vor Ort, value: "0", unit: g, text: "Keine Pyrotechnik, also kein Rauch und keine Schwermetalle über dem Publikum." }
      - { label: Müll vor Ort, value: "0", unit: kg, text: "Keine Hülsen, keine Reste. Dieselben Drohnen fliegen Show für Show." }
      - { label: Strom, value: "100", unit: "%", text: Ökostrom von naturstrom für unsere Akkus. }
    points:
      - Die Drohnen werden in der EU gebaut, Akkus, Motoren und Rotoren tauschen wir einzeln.
      - Zu den Shows fahren wir mit einem elektrischen Ford E-Transit.
    campaign: Für die Kampagne der Deutschen Umwelthilfe sind wir im November 2023 mit 150 Drohnen über dem Cantianstadion in Berlin geflogen, als Alternative zum Silvesterfeuerwerk.

  - type: comparison
    id: vergleich
    headline: Drohne, Feuerwerk oder Laser?
    text: Jede Technik hat ihre Stärken. So unterscheiden sich die drei bei den Fragen, die am häufigsten kommen.
    rowHeader: Kriterium
    columns: [Drohnenshow, Feuerwerk, Lasershow]
    rows:
      - label: Logos und Schriftzüge am Himmel
        values: ["Ja, auch in 3D", Nein, "Teilweise, nur auf Flächen oder Dunst"]
        cells:
          - { label: Ja, text: auch in 3D, tone: y }
          - { label: Nein, text: "", tone: n }
          - { label: Teilweise, text: nur auf Flächen oder Dunst, tone: p }
      - label: Lautstärke
        values: ["Leise, Musik nach Wahl", Sehr laut, Leise]
        cells:
          - { label: Leise, text: Musik nach Wahl, tone: y }
          - { label: Sehr laut, text: "", tone: n }
          - { label: Leise, text: "", tone: y }
      - label: Rauch, Feinstaub, Müll vor Ort
        values: [Keine, Viel, Dunst für sichtbare Strahlen nötig]
        cells:
          - { label: Keine, text: "", tone: y }
          - { label: Viel, text: "", tone: n }
          - { label: Dunst, text: für sichtbare Strahlen nötig, tone: p }
      - label: Brandgefahr
        values: [Keine, "Ja, Verbote bei Trockenheit", Keine]
        cells:
          - { label: Keine, text: "", tone: y }
          - { label: Ja, text: Verbote bei Trockenheit, tone: n }
          - { label: Keine, text: "", tone: y }
      - label: Wind und Wetter
        values: ["Bis Windstärke 5, kein Starkregen", Bei Sturm abgesagt, "Robust, auch drinnen"]
        cells:
          - { label: Grenze, text: "bis Windstärke 5, kein Starkregen", tone: p }
          - { label: Grenze, text: bei Sturm abgesagt, tone: p }
          - { label: Robust, text: auch drinnen, tone: y }
      - label: Sichtbar aus der Ferne
        values: [Kilometerweit, Kilometerweit, "Begrenzt, wirkt am besten aus der Nähe"]
        cells:
          - { label: Kilometerweit, text: "", tone: y }
          - { label: Kilometerweit, text: "", tone: y }
          - { label: Begrenzt, text: wirkt am besten aus der Nähe, tone: p }
    note: Entwurf · fachliche Prüfung ausstehend

  - type: team
    id: team
    headline: Die Menschen hinter dem Himmel.
    text: Ronja, Florian und Erwin führen FlyingStars gemeinsam. Ihr erreicht uns als Team, und am Showabend stehen wir selbst mit auf dem Feld.
    members:
      - name: Ronja Donsbach
        role: Geschäftsführerin
        bio: Beantwortet die meisten Anfragen, auch auf Englisch, und stimmt Design und Musik ab.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Ronja_Teamfoto.jpg", alt: Ronja Donsbach mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Florian Becker
        role: Geschäftsführer
        bio: Kümmert sich um Verwaltung, Personal und Kund:innen in Deutschland. Schreibt den Blog.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Florian_Teamfoto.jpg", alt: Florian Becker mit einer Drohne in der Hand, width: 800, height: 1000 }
      - name: Erwin Wilms
        role: Geschäftsführer
        bio: Anträge, Behörden und Luftfahrtrecht. Sorgt dafür, dass eure Show fliegen darf.
        image: { src: "https://flyingstars.art/wp-content/uploads/2024/08/Erwin_Teamfoto.jpg", alt: Erwin Wilms mit einer Drohne in der Hand, width: 800, height: 1000 }
    note: Dazu Patrick für die Technik, Alejandro für das Design und eine Crew, die jede Show mit aufbaut.
    cta: { label: Mehr über uns, href: /ueber-uns/ }

  - type: faq
    id: faq
    headline: Was ihr vor der Anfrage wissen solltet.
    cta: { label: Alle Fragen, href: /faq/ }
    openFirst: true
    limit: 4
    tags: [startseite]

  - type: contactForm
    headline: Erzählt uns von eurem Termin.
    text: Datum, Ort und Anlass reichen für eine erste Einschätzung. Was ihr noch nicht wisst, lasst ihr offen.
