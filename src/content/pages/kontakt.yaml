title: Show anfragen
description: "Erzählt FlyingStars von eurem Termin, Ort und Anlass. Wir antworten innerhalb von 48 Stunden, per Mail, Telefon, WhatsApp oder Videocall."
sections:
  - type: contactForm
    kicker: Anfrage
    headline: Erzählt uns von eurem Termin.
    text: Datum, Ort und Anlass reichen für eine erste Einschätzung. Was ihr noch nicht wisst, lasst ihr offen. Mit dem Absenden bucht ihr noch nichts.
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.

  - type: steps
    id: danach
    kicker: Ablauf
    headline: In vier Schritten zu eurer Show.
    steps:
      - title: Antwort
        text: Innerhalb von 48 Stunden antworten wir per E-Mail, mit Rückfragen oder einer ersten Einschätzung.
        duration: 48 h
      - title: Erstgespräch
        text: In einem kurzen Gespräch per Telefon oder Video klären wir Ort, Motive und Größe.
      - title: Angebot
        text: Ihr bekommt ein schriftliches Angebot. Mit der Buchung zahlt ihr 40 % an.
      - title: Planung
        text: Wir prüfen den Standort, holen die Genehmigung ein und entwerfen die Show mit euch.

