title: Privacy
description: "Privacyinformatie voor de FlyingStars-preview: eigen levering van lettertypen en beelden,
  video's op klik en geen analysetracking."
noindex: true
sections:
  - type: textMedia
    headline: Privacy in deze preview
    body: >
      Deze website levert lettertypen en voorbeeldafbeeldingen zelf. Video's starten pas als jullie erop
      klikken. De preview gebruikt geen analysetracking.


      Verzending via het formulier is nog niet ingesteld. Tot die tijd worden jullie gegevens niet opgeslagen
      of gemaild. Het formulier meldt dit na het versturen.


      De geldende privacyinformatie staat in de [privacyverklaring van de bestaande
      FlyingStars-website](/nl/datenschutz/). Voor de nieuwe website wordt de verklaring vóór publicatie
      aangevuld en gecontroleerd.
