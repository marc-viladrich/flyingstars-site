title: Onze shows
description: "FlyingStars-shows voor Bokkenrijders, NFL, Ford en PUMA, plus shows per jaar: 178 shows sinds 2022, met 50 tot 600 drones."
sections:
  - type: references
    id: referenzen
    kicker: Onze shows
    headline: Shows die we al hebben gevlogen.
    text: 178 shows sinds 2022, stand 21 oktober 2026. Hier vinden jullie een selectie met zeven uitgebreide praktijkverhalen.
    filters:
      - occasion
      - year
      - drones
    todo: Für die verbleibenden Kurzreferenzen fehlen Projektgeschichten und teilweise weitere Bilder. FlyingStars muss priorisierte Briefings und Nutzungsfreigaben liefern; freigegebene Kundenzitate liegen laut Fragebogen nicht vor.
    _key: k_6aab7fa758be0d59fffb
  - type: metrics
    id: pro-jahr
    kicker: In cijfers
    headline: Shows per *jaar*.
    items:
      - label: "2022"
        value: "8"
        text: "De eerste op 13 augustus: 50 drones voor een privéverjaardag. In november PUMA in Borussia-Park."
        _key: k_558285939749d8a5ecdc
      - label: "2023"
        value: "42"
        text: "Onder andere L’Oréal × Prada bij de Rheinturm in Düsseldorf en #Böllerciao met Deutsche Umwelthilfe in Berlijn."
        _key: k_6bd86bfa991317b66002
      - label: "2024"
        value: "45"
        text: Onder andere 50 jaar VW Golf aan de Wolfgangsee en de nieuwe Ford Explorer in Keulen.
        _key: k_971a2ffe477a6c410563
      - label: "2025"
        value: "33"
        text: Onder andere de eerste indoor-show voor Siemens op de Hannover Messe en de NFL Berlin Game.
        _key: k_6cc90756de99e77daa63
      - label: "2026"
        value: "50"
        text: Tot 21 oktober. Onder andere 20 avonden Bokkenrijders met elk 600 drones en E.ON in Hamburg.
        _key: k_ddcd9f398dfdb07dbe49
      - label: Totaal
        value: { fact: showsTotal }
        text: Voor merken, steden, festivals en stellen, in Duitsland en Europa.
        _key: k_2eb3255fbe18749fd330
    todo: FlyingStars muss die Jahreszahlen einschließlich 2026 aktualisieren oder den Stand 21.10.2026 ausdrücklich beibehalten; 178 ist keine laufende Live-Zählung.
    _key: k_f41a9c016c41af101b3b
