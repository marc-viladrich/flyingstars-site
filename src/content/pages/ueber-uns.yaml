# Über uns (30.10.2026). Reihenfolge nach Marc: zuerst die persönliche Vorstellung mit frühem CTA, danach die
# Meilensteine als ruhige Timeline. Inhalte aus Elevate, Fakten aus Fragebogen (21.10.) und Moritz' Notizen (30.10.).
# Thomas (freier Designer) wird laut Notizen nicht genannt; Bürohund Chopper darf vorkommen.
# Offen: VW Golf 350 (Fragebogen) oder 400 Drohnen (Notizen), deshalb ohne Zahl; E.ON 15.09. oder 15./16.09., deshalb „im September“.
title: Über uns
description: "FlyingStars aus dem Ruhrgebiet: Team, Geschichte und Meilensteine. 178 Shows seit 2022, eigenes Design-Team, eigene Flotte, Büro auf Zollverein."
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: hero
    kicker: Über uns
    headline: Ein Team aus dem Ruhrgebiet, das den *Nachthimmel* bespielt.
    text: Ronja, Florian und Erwin führen FlyingStars gemeinsam, mit einem kleinen Team aus dem Ruhrgebiet. Unser Büro ist im Triple Z auf Zeche Zollverein in Essen. Dort könnt ihr uns auch besuchen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: Weltkugel aus Drohnen über dem Rhein bei der Extraschicht in Duisburg
      width: 2544
      height: 1493
    cta: { label: Show anfragen, href: /kontakt/ }
    secondary: { label: Unsere Meilensteine, href: "#meilensteine" }
    todo: FlyingStars muss ein freigegebenes Team- oder Arbeitsfoto für den persönlichen Einstieg liefern; derzeit steht hier ein Showbild. Moritz muss die deutsche Endfassung und die maschinell übersetzten EN-/NL-Texte redaktionell prüfen.
    _key: k_a92f0496058ba6b4cc95

  - type: team
    id: team
    kicker: Team
    headline: Die Menschen hinter den Shows.
    text: Ihr erreicht uns als Team, und am Showabend stehen wir selbst mit auf dem Feld.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
      - personId: chopper
    note: Dazu kommen rund zehn Aushilfen, die mit uns aufbauen, absichern und wieder abbauen.
    cta: { label: Lernt uns kennen, href: /kontakt/ }
    todo: FlyingStars muss hochauflösende Porträts von Ronja, Florian und Erwin sowie Fotos von Patrick und Alejandro liefern; die vorhandenen Porträts messen nur 199 × 199 Pixel. Zusätzlich fehlen Choppers Foto und eine abgestimmte Kurzvorstellung.
    _key: k_c25a7d02d05d2423027c

  - type: textMedia
    kicker: Geschichte
    headline: Wie FlyingStars angefangen hat.
    body: |
      FlyingStars begann als Corona-Projekt. In Asien gab es damals schon viele große Drohnenshows, in Europa noch nicht. Wir wollten wissen, warum, und haben angefangen zu tüfteln. Am 1. Dezember 2021 haben wir das Gewerbe angemeldet.

      Unsere erste Show flogen wir am 13. August 2022, zu einem privaten Geburtstag mit 50 Drohnen. Im selben Jahr kamen sieben weitere dazu.

      Unser Firmensitz und unsere Postadresse sind in Gelsenkirchen.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: Kreis aus bunten Drohnen über Berlin, Zuschauer:innen filmen die Show mit dem Handy
      width: 1920
      height: 987
    mediaSide: right
    todo: FlyingStars muss ein passendes Gründungs- oder Arbeitsfoto liefern; das aktuelle Bild zeigt die spätere Böllerciao-Show, nicht die Gründung.
    _key: k_45b2deb9df767eef3032

  - type: timeline
    id: meilensteine
    kicker: Meilensteine
    # Vertikaler Zeitstrahl mit derselben Animation wie der Ablauf auf der Startseite (Runde 8, 31.10.2026)
    headline: Von 50 auf *600* Drohnen.
    text: Vom ersten Geburtstag 2022 bis zum Musical in Maastricht.
    items:
      - { when: "2021", title: Gründung, text: Am 1. Dezember melden wir FlyingStars als Gewerbe an., "_key": "k_37ee158ca8dcbd140127" }
      - { when: "2022", title: Die erste Show, text: Am 13. August fliegen 50 Drohnen zu einem privaten Geburtstag., "_key": "k_97b953eb9d5edee0fb57" }
      - { when: { project: puma-bundesliga, field: date, display: year }, title: PUMA im Borussia-Park, text: "Am {{project.puma-bundesliga.date.dayMonth}}, unsere sechste Show. {{project.puma-bundesliga.drones}} Drohnen vor dem Derby Gladbach gegen Dortmund, die Anfrage kam etwa 14 Tage vorher.", "_key": "k_4ab54f3dd19c3a475f05" }
      - { when: "2023", title: Die erste generische Betriebsgenehmigung in Deutschland, text: Im Juli erteilt uns das Luftfahrt-Bundesamt die Genehmigung., "_key": "k_b0136ad8d44517045fbc" }
      - { when: { project: loreal-prada-rheinturm, field: date, display: year }, title: L’Oréal × Prada Paradoxe, text: "Am {{project.loreal-prada-rheinturm.date.dayMonth}} {{project.loreal-prada-rheinturm.drones}} Drohnen am Rheinturm in Düsseldorf.", "_key": "k_9bbd688fb4d17b4a60fe" }
      - { when: { project: boellerciao, field: date, display: year }, title: "#Böllerciao mit der Deutschen Umwelthilfe", text: "Am {{project.boellerciao.date.dayMonth}} {{project.boellerciao.drones}} Drohnen im Berliner Cantianstadion, vor Presse, Politik und Öffentlichkeit.", "_key": "k_c356c3325b7a41fde72a" }
      - { when: "2023", title: Einzug ins Triple Z, text: Im Dezember beziehen wir unser Büro im Gründungszentrum auf Zeche Zollverein., "_key": "k_bf77e7f02052490ad926" }
      - { when: { project: vw-50-golf, field: date, display: year }, title: 50 Jahre VW Golf, text: "Am {{project.vw-50-golf.date.dayMonth}} an der Scalaria am Wolfgangsee. Lange unsere größte Show.", "_key": "k_409072bba0558fb767c1" }
      - { when: "2025", title: Die erste Indoor-Show, text: Am 28. März für Siemens auf der Hannover Messe., "_key": "k_e5a8ba1d96bf9934fc19" }
      - { when: "2025", title: Kein Bock auf Nazis, text: "Am 8. August. Seitdem fliegen wir regelmäßig Shows für Demokratie, Vielfalt und Zusammenhalt.", "_key": "k_282298482b60b577afdd" }
      - { when: { project: bokkenrijders-musical-2026, field: date, display: year }, title: Bokkenrijders in Maastricht, text: "Im Juni {{project.bokkenrijders-musical-2026.shows}} Shows mit je {{project.bokkenrijders-musical-2026.drones}} Drohnen in einem Musical.", "_key": "k_d8c56b9918b02ef95bc6" }
      - { when: "2026", title: E.ON in Hamburg, text: Im September eine Doppelshow mit 500 Drohnen über der Elbe an den Landungsbrücken., "_key": "k_45d6f7975038929f9340" }
      - { when: "2026", title: Indoor im Triple Z, text: "Im September eine Indoor-Show im Gründungszentrum, in dem auch unser Büro ist.", "_key": "k_5fbb1e614958b09eeb8c" }
    todo: FlyingStars muss den historischen LBA-Erstanspruch belegen und VW Golf mit 350/400 Drohnen sowie das E.ON-Datum 15./16.09. klären. Für E.ON und „Kein Bock auf Nazis“ fehlen zugeordnete Showbilder.
    _key: k_65625cffa99167129c8b

  # USP-Entwurf für Moritz. Quellen, Auswahl und Faktenabgleich: docs/ueber-uns-usps.md.
  # Ersetzt die bisherige Sammelliste durch Zusammenarbeit/Produktion.
  - type: landingBento
    id: zusammenarbeit
    kicker: Aus einer Hand
    headline: Eure Idee wird zur *Choreografie*.
    lead:
      icon: users
      title: Mit euch entwickelt.
      text: Wir entwickeln mit euch Storyline, Motive und Musik für euren Anlass.
    items:
      - icon: pencil-ruler
        title: Eigenes Design-Team
        text: Alejandro entwirft die Motive und Choreografien. Eure Ideen, euer Logo oder euer Stadtwappen werden zu Drohnenformationen.
        _key: k_131f77651b316dd9a22e
      - icon: thumbs-up
        title: Motive vorab freigeben
        text: Ihr seht die Entwürfe vor der Show und gebt jedes Motiv frei.
        _key: k_2327413f096b6acd85f8
      - icon: music
        title: Musik und Licht abstimmen
        text: Wir schneiden die Musik zur Animation. Danach programmieren wir Farben und Lichteffekte auf die musikalischen Akzente. Der Musikschnitt ist in jedem Paket enthalten.
        _key: k_3947e1f963bd7fd6625a
      - icon: drone
        title: Eigene Flotte
        text: Wir fliegen mit unseren eigenen Drohnen. Patrick plant ihren Einsatz und kümmert sich um die Technik für eure Show.
        _key: k_9047aa9bacd4dc446343
    todo: Moritz muss den USP-Entwurf zur Zusammenarbeit redaktionell freigeben; die sachliche Grundlage ist in docs/ueber-uns-usps.md dokumentiert.
    _key: k_f2457c3cc737e38d2649

  # Genehmigungen (Codex-Entwurf 02.11.) stehen nicht als eigene Section hier: Das Sicherheitskonzept direkt darunter nennt
  # LBA-Genehmigung, DFS, Cross-border und Grundstückszustimmung ausführlicher („Das übernehmen wir / Das braucht ihr“).

  # Textentwurf für Moritz. Quellen und Konflikte: docs/sicherheitskonzept-quellen.md.
  - type: landingSite
    id: sicherheit
    kicker: Sicherheit
    headline: Sicherheit, um die ihr euch nicht kümmern müsst.
    text: Sicherheitszonen, Flugplanung und Zuständigkeiten stimmen wir für jeden Standort ab.
    variant: outdoor
    safeguards:
      - icon: scan-line
        title: Digital begrenzter Flugbereich
        text: "Ein Geofence begrenzt den Showbereich. Verlässt eine Drohne diesen Bereich, startet automatisch ein Sicherheitsprotokoll."
        _key: k_69978ff343594b2a3f56
      - icon: shield-check
        title: Mehrfach abgesichert
        text: "Automatische und manuelle Sicherheitssysteme überwachen jeden Flug. Bei einem Ausfall kehrt die Drohne meist zurück oder landet im Sicherheitsbereich. Die Outdoor-Drohnen wiegen rund 300 g und haben keine Kameras."
        _key: k_ef68f4f356d09019ef52
      - icon: users-round
        title: Team vor Ort
        text: "Drei bis vier Personen, Pilot:innen und Techniker:innen, bauen die Technik auf und überwachen die Show."
        _key: k_3aecaaf1b44687bfc064
      - icon: wind
        title: Wetter im Blick
        text: "Wir fliegen formstabil bis Windstärke 5 und bei leichtem Nieselregen. Die Wetterlage stimmen wir idealerweise ein bis zwei Tage vorher mit euch ab."
        _key: k_fb40173475d53cde7ab3
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel; Betriebsgenehmigung und aktuelle Versicherungsbestätigung fehlen im Quellenpaket.
    safetyRef: safety-concept
    _key: k_acabd60ef12b79f89464

  # Nachhaltigkeit (Marc, 31.10.2026, Runde 8): dieselbe Scrollstory wie auf der Startseite, mit denselben Fakten, statt
  # einer schwächeren Kopie. docs/DESIGN.md sieht genau eine Scrollstory auf Über uns vor. Der Unterschied zur Startseite
  # liegt im Satz unter der Headline (Gründungsmotiv) und im Hersteller als Beleg für „Gebaut in der EU“.
  # Nur Aussagen über die Show vor Ort (EmpCo).
  - type: sustainability
    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Kein Knall. Kein Rauch. Kein Müll.
    text: Nachhaltigkeit ist der Grund, aus dem wir FlyingStars gegründet haben. Wir denken sie bei jeder Entscheidung mit.
    facts:
      - { label: Kein Knall, value: leise, text: "Die Drohnen summen, laut ist nur eure Musik. Den Schallschutz hat der TÜV Nord in einem Gutachten untersucht.", "_key": "k_18107c09a966fa79eaaa" }
      - { label: Kein Rauch, value: "0", unit: g, text: "Keine Pyrotechnik, also kein Rauch und keine Schwermetalle über dem Publikum.", "_key": "k_e9bac39bce573d233925" }
      - { label: Kein Müll, value: "0", unit: kg, text: "Keine Hülsen, keine Reste. Dieselben Drohnen fliegen Show für Show.", "_key": "k_0613df3d50475052917a" }
      - { label: Ökostrom, value: { fact: renewablePercent }, unit: "%", text: Ökostrom von naturstrom für unsere Akkus., "_key": "k_e0f84ec6b02e192701fd" }
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom, Herstellung und das TÜV-Nord-Schallschutzgutachten bereithalten.
    pillarsRef: sustainability-pillars
    _key: k_0fa41045b869c8273b40

