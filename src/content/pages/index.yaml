    id: nachhaltigkeit
    kicker: Nachhaltigkeit
    headline: Kein Knall. Kein Müll. Kein Rauch.
    text: "Bei unseren Drohnen-Veranstaltungen sind auch Hunde und Kinder herzlich willkommen: Sie sind abfallfrei, lokal emissionsfrei und surren leiser als Feuerwerke. Mit Shows für die Deutsche Umwelthilfe und Kein Bock auf Nazis setzen wir zudem regelmäßig ökologische und soziale Zeichen in den Himmel."
