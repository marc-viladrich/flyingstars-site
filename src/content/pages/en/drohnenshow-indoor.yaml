  - type: textMedia
    id: unterschied
    kicker: An alternative to the light show
    headline: "As fascinating as fireworks, as safe as lasers"
    body: "We bring the sparkle, the glamour and the amazed guests of fireworks under your roof. Without debris or smoke, and with nothing but a soft hum.\n\nYour indoor drone show is a five- to eight-minute choreography that captivates every visitor. After all, hardly any guest has ever seen one of these magical dances – let alone indoors.\n\nThat is why we design fascinating motifs, set to music, that tell your story. From 50 drones, also with bespoke figures such as your logo or your initials."
    mediaSide: right
    cta:
      label: Request a show
      href: "#anfrage"
    _key: k_c030e32b9a3f99dac46e
  - type: textMedia
    id: komplettpaket
    kicker: Complete package
    headline: Be a guest at your own event
    body: "We take care of the complete planning, execution and dismantling. You enjoy the performance.\n\n- From 20 drones, with no upper limit.\n- Synchronised with music.\n- With photo and video footage on request.\n- We take care of all permits.\n- Strict safety standards.\n- Preparation in under two weeks is possible.\n- In Germany, Europe and worldwide."
    mediaSide: right
    cta:
      label: Request a show
      href: "#anfrage"
    _key: k_261100f50aa3e8f06fcd
  - type: textMedia
    todo: "FlyingStars muss Indoor-Flugfläche, Sicherheitsfunktionen und die für Indoor geltende Haftpflichtdeckung bestätigen."
    id: sicherheit
    kicker: Safety
    headline: For a worry-free performance
    body: "We meet the strict safety requirements that apply to indoor drone shows. That is why we need a clear area of about 10 x 10 metres and a ceiling height of at least three metres. One advantage indoors: wind and weather pose no risk (of cancellation).\n\nWe also rely on redundant safety mechanisms. The rotors are physically protected and all components are CE certified. The drones fly slowly and weigh less than 200 grams.\n\nWe are certified by the German Federal Aviation Office and EU Aviation Safety. TÜV NORD also certifies that our fleet complies with noise protection standards. Should the worst happen, our liability insurance covers you for up to €1.3 million."
    mediaSide: right
    _key: k_1060f8471da9620b9d94
  - type: textMedia
    id: preise
    kicker: Prices
    headline: Full control over your show
    body: "Our indoor drone shows start at €15,000 (net) plus travel. We are happy to put together a bespoke package for you, and that is the price that stands – no surprises."
    mediaSide: right
    cta:
      label: Request a show
      href: "#anfrage"
    _key: k_2957e41a82a467bac50c
  - type: steps
    id: ablauf
    kicker: Process
    headline: An established process
    steps:
      - title: "#1 Enquiry"
        text: "Tell us the date, place and occasion, and we will get back to you with ideas within 48 hours. An initial call is the next step; an on-site visit is rarely needed."
        _key: k_bcd783da285c16316e38
      - title: "#2 Planning"
        text: We build the storyline and motifs. You are welcome to bring in your wishes. We also take care of all permits; you only provide the landowners' consent.
        _key: k_1a7a9d6124366c37cbbf
      - title: "#3 Show day"
        text: "While you look after your guests, we set up (three and a half hours), perform the show (five to eight minutes) and quietly dismantle again."
        _key: k_2a47818390caa6ae1614
    ownNumbers: true
    _key: k_cca8a7702a948ca38dce
  - type: landingSpotlight
    id: referenzen
    kicker: References
    todo: "Für Siemens Hannover Messe und Triple Z fehlen Fallstudien und eindeutig zugeordnete Showbilder. Triple Z: Moritz nennt Juni 2026, der Fragebogen September 2026."
    headline: Some of our favourite performances
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
      alt: Glowing drones in formation in front of the stage of a packed hall
      width: 1200
      height: 764
    tags: []
    entries:
      - kicker: A trade fair stand with a difference
        title: Siemens
        text: "At Hannover Messe 2025, we visualised Siemens' digital innovations."
        _key: k_7c6c021cc1a855fcde60
      - kicker: A glimpse into the future
        title: Triple Z
        text: "In June 2026, we thrilled North Rhine-Westphalia's start-up scene at the Zeche Zollverein start-up centre."
        _key: k_81843471e629d870eaa4
