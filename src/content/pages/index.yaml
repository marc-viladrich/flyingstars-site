# Startseite (31.10.2026, Marcs Feedbackrunde 6): Hero mit Showreel, Logos, Anlässe, Pakete, Konfigurator, Referenzen,
# Ablauf in Zahlen, Presse und Qualität, Nachhaltigkeit, Vergleich, Team, FAQ, Anfrage.
# Grundlage: Struktur des ersten Prototyps (Marc: „es sollte sich nicht so viel ändern“), angereichert mit
# Fragebogen (21.10.), Moritz' Notizen (30.10.) und der Designsprache-Probe. Einzige Scrollstory: der Hero (Flug).
# Texte sind Entwürfe, Moritz verantwortet die Endfassung.
title: Drohnenshows buchen – über 150 Shows seit 2022
description: "Drohnenshows für Unternehmen, Städte und große Momente: über 150 Shows seit 2022, eigene Flotte, Genehmigung inklusive. Jetzt Show anfragen."
image: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
sections:
  - type: showreelHero
    eyebrow: Drohnenshows seit 2022 · DE · AT · CH · Benelux
    headline: Wir gestalten euer Stück Himmel.
    text: Drohnenshows für Unternehmen, Städte, Festivals und Paare. Wir entwerfen die Motive, holen die Genehmigung und fliegen mit eigener Flotte.
    words: [Neu., Einzigartig., Anders., Spektakulär.]
    cta: { label: Show anfragen, href: "#anfrage" }
    secondary: { label: Pakete und Preise, href: /drohnenshow-preise/ }
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
