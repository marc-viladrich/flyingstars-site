  - type: team
    id: team
    kicker: Team
    headline: The people behind the sky.
    text: Ronja, Florian and Erwin run FlyingStars together. You reach us as a team, and on show night we're out on the field ourselves.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    note: Plus a crew of pilots and technicians who set up and fly every show on site.
    cta:
      label: More about us
      href: /ueber-uns/
    todo: FlyingStars muss hochauflösende Porträts von Ronja, Florian und Erwin sowie Fotos von Patrick und Alejandro liefern; die vorhandenen Porträts messen nur 199 × 199 Pixel.
