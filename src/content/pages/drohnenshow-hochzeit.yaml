    id: familienfreundlich
    kicker: Familienfreundlich
    headline: Kinder und *Hunde* willkommen
    text: Im Gegensatz zum Feuerwerk gibt es beim Drohnenballett keinen lauten Knall, störenden Rauch oder Abfall mit Brandgefahr. Nur ein leises Surren – und das Staunen der Gäste.
    icon: paw-print
    _key: k_59a09168d2946ce16e34

  # Versprechen als Kacheln mit Verlaufs-Icons
