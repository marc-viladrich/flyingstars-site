  - type: comparison
    id: unterschied
    kicker: An alternative to the light show
    todo: FlyingStars muss den Vergleich fachlich prüfen, insbesondere pauschale Aussagen zu Brandgefahr, Lautstärke und Umweltwirkung, und ob Feuerwerk drinnen überhaupt Vergleichsmaßstab sein soll.
    headline: As fascinating as *fireworks*, as safe as lasers
    text: |-
      We bring the sparkle, the glamour and the amazed guests of fireworks under your roof. Without debris or smoke, and with nothing but a soft hum.

      Your indoor drone show is a five- to eight-minute choreography that captivates every visitor. After all, hardly any guest has ever seen one of these magical dances – let alone indoors.

      That is why we design fascinating motifs, set to music, that tell your story. From 50 drones, also with bespoke figures such as your logo or your initials.
