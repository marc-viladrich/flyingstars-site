title: Status van jullie aanvraag
description: Status van het FlyingStars-contactformulier. Zolang verzending niet is ingesteld, bereiken jullie het team rechtstreeks per e-mail.
noindex: true
sections:
  - type: textMedia
    headline: Status van jullie aanvraag
    body: >
      In deze preview is verzending nog niet ingesteld. Er is niets verstuurd of opgeslagen.


      Mail rechtstreeks naar [{{contact.email}}](mailto:{{contact.email}}) of bel [{{contact.phone.label}}]({{contact.phone.href}}).
    todo: FlyingStars muss den tatsächlichen Versandstatus mit dem Betrieb klären; Moritz muss die reine Vorschau-Meldung bei aktivem Versand durch eine passende Rückmeldung in DE/EN/NL ersetzen.
