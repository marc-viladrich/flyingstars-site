  - type: steps
    id: ablauf
    kicker: Ablauf
    headline: In drei Schritten zur Show
    ownNumbers: true
    steps:
      - { title: "#1 Anfrage", text: "Ihr erzählt uns von Datum, Ort und Anlass. Wir melden uns innerhalb von 48 Stunden zurück, um ein Erstgespräch zu vereinbaren. Eine Begehung ist selten nötig.", "_key": "k_e01bd8edb2e65fef3485" }
      - { title: "#2 Planung", text: "Wir entwickeln die Choreo samt Motiven und Musik. Ihr seid so viel involviert, wie ihr möchtet. Mit Zustimmung der Grundstückseigentümer:innen holen wir alle Genehmigungen ein.", "_key": "k_b22b05daa48eb35fd92c" }
      - { title: "#3 Showtag", text: "Wir kümmern uns um alles: Aufbau dreieinhalb Stunden vor der Aufführung, Sicherheit, Abbau. Die Drohnen-Werbung selbst läuft für bis zu 25 Minuten.", "_key": "k_9ebfd8a7c65e0d2211e6" }
    _key: k_a7152263e0461f67ead9

