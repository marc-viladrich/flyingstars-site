  # Textentwurf für Moritz. Quellen und Konflikte: docs/sicherheitskonzept-quellen.md. Kompakt wie auf allen Seiten
  # (Marc, 17.11.2026): Karte mit Popovern, keine Zuständigkeitstabelle, darunter LBA, EASA und naturstrom.
  - type: landingSite
    id: location
    kicker: Location
    headline: Passt eure Location?
    text: Schickt uns die Adresse und die geplante Position eurer Gäste. Vor dem Angebot prüfen wir, ob und wie die Show dort möglich ist.
    variant: outdoor
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Schriftliche Nutzungsfreigaben für LBA-, EASA- und naturstrom-Logos fehlen.
    quality:
      - { title: Betriebsgenehmigung des Luftfahrt-Bundesamts, text: seit Juli 2023, icon: permit, logo: /brand/logos/quali-lba-weiss.png, cleared: true, "_key": "k_d056058898547d0bb1a9" }
      - { title: EU-weit nach EASA-Regeln, text: "Shows in der ganzen EU, auch in Österreich und den Niederlanden", icon: permit, logo: /brand/logos/quali-easa-weiss.png, cleared: true, "_key": "k_5a63e48e8e1aaad88bfe" }
      - { title: 100 % Ökostrom von naturstrom, text: für die ganze Flotte, icon: leaf, logo: /brand/logos/quali-naturstrom.svg, cleared: true, "_key": "k_0a1a774c6de0621af71d" }
    safetyRef: safety-concept
    _key: k_6e4f6206d974feea8611

  # Ablauf als Verlaufsstrahl, Zeitangaben aus Moritz' Texten; danach der Überraschungs-Abschluss aus dem Prototyp
  - type: landingFlow
    id: ablauf
    kicker: Ablauf
    headline: Wir planen, ihr *lehnt euch zurück*
    steps:
      - { title: "#1 Anfrage", text: "Wann und wo heiratet ihr? In 48 Stunden melden wir uns zurück, um uns kennenzulernen und euch ein festes Angebot zu unterbreiten. Eine Begehung eurer Location ist selten nötig.", duration: 48 h, "_key": "k_6b92c66eeb04fdf588fc" }
      - { title: "#2 Vorbereitung", text: "Ihr erzählt uns von eurer Liebesgeschichte. Wir bauen daraus eine Choreografie. Und weil die Hochzeitsplanung schon stressig genug ist, kümmern wir uns auch um Genehmigungen und Co.", "_key": "k_54439060443f507bff93" }
      - { title: "#3 Hochzeit", text: "Ab dreieinhalb Stunden vor dem Drohnentanz bereiten wir vor. Die Show selbst dauert bis zu 25 Minuten. Ihr dürft zuschauen und staunen – Auf- und Abbau sowie Sicherheit organisieren wir.", duration: "3,5 h vorher · bis 25 Min Show", "_key": "k_77816c393a12e22dfcb5" }
    _key: k_bd1dd6072c1145a15939

  - type: landingCta
    headline: Es soll eine *Überraschung* werden?
    text: Ob Heiratsantrag oder Geschenk der Familie, wir stimmen uns nur mit euch ab. Die Startfläche richten wir abseits ein und den Startzeitpunkt planen wir mit der Location.
    button: { label: Überraschung anfragen, href: "#anfrage" }
    _key: k_ae4a2fbaa25b27dc1ad0

  - type: team
    id: ueber
    kicker: Über FlyingStars
    headline: Es ist uns eine *Ehre*, eure Gäste sein zu dürfen
    text: "Normalerweise fliegen wir für Städte, Festivals und Weltkonzerne wie L’Oréal, Prada oder Spotify. Einen besonderen Platz in unserem Fotoalbum nehmen aber die Brautpaare ein, deren Hochzeit wir unvergesslich machen durften. Deshalb sind wir einer der wenigen Anbieter, die auch für private Feiern fliegen. Auf eurem Fest sorgen wir mit kleiner Mannschaft im Hintergrund dafür, dass alles reibungslos abläuft."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    cta: { label: Über uns, href: /ueber-uns/ }
    todo: FlyingStars muss ein Teamfoto liefern.
    _key: k_3ed49f154258b655d578

