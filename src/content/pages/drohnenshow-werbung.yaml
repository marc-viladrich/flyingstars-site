  # Ablauf als Verlaufsstrahl wie „Freigabe“ im Prototyp, Zeitangaben aus Moritz' Texten
  - type: landingFlow
    id: ablauf
    kicker: Ablauf
    headline: In drei Schritten zur *Show*
    steps:
      - { title: "#1 Anfrage", text: "Ihr erzählt uns von Datum, Ort und Anlass. Wir melden uns innerhalb von 48 Stunden zurück, um ein Erstgespräch zu vereinbaren. Eine Begehung ist selten nötig.", duration: 48 h, "_key": "k_e01bd8edb2e65fef3485" }
      - { title: "#2 Planung", text: "Wir entwickeln die Choreo samt Motiven und Musik. Ihr seid so viel involviert, wie ihr möchtet. Mit Zustimmung der Grundstückseigentümer:innen holen wir alle Genehmigungen ein.", duration: unter 2 Wochen möglich, "_key": "k_b22b05daa48eb35fd92c" }
      - { title: "#3 Showtag", text: "Wir kümmern uns um alles: Aufbau dreieinhalb Stunden vor der Aufführung, Sicherheit, Abbau. Die Drohnen-Werbung selbst läuft für bis zu 25 Minuten.", duration: "3,5 h Aufbau · bis 25 Min Show", "_key": "k_9ebfd8a7c65e0d2211e6" }
    _key: k_a7152263e0461f67ead9

  # Entwurf für Moritz: Standortkarte kompakt wie auf allen Seiten (Marc, 17.11.2026), Zonen erklären sich per Popover,
  # keine Zuständigkeitstabelle mehr. Darunter LBA, EASA und naturstrom. Quellen: docs/sicherheitskonzept-quellen.md.
  - type: landingSite
    id: standort
    kicker: Standort
    headline: Passt euer Standort?
    text: Schickt uns die Adresse und die geplante Position eures Publikums. Vor dem Angebot prüfen wir, ob und wie die Show dort möglich ist.
    variant: outdoor
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel. Schriftliche Nutzungsfreigaben für LBA-, EASA- und naturstrom-Logos fehlen.
    quality:
      - { title: Betriebsgenehmigung des Luftfahrt-Bundesamts, text: seit Juli 2023, icon: permit, logo: /brand/logos/quali-lba-weiss.png, cleared: true, "_key": "k_d056058898547d0bb1a9" }
      - { title: EU-weit nach EASA-Regeln, text: "Shows in der ganzen EU, auch in Österreich und den Niederlanden", icon: permit, logo: /brand/logos/quali-easa-weiss.png, cleared: true, "_key": "k_5a63e48e8e1aaad88bfe" }
      - { title: 100 % Ökostrom von naturstrom, text: für die ganze Flotte, icon: leaf, logo: /brand/logos/quali-naturstrom.svg, cleared: true, "_key": "k_0a1a774c6de0621af71d" }
    safetyRef: safety-concept
    _key: k_c4fd3256a7a568abb827

