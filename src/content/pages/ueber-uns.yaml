  - type: metrics
    id: sicherheit
    headline: So planen wir Sicherheit.
    text: Leichte Drohnen, ein abgesperrter Bereich und Systeme, die sich gegenseitig absichern.
    items:
      - label: Gewicht
        value: ca. 300 g
        text: So viel wiegt eine Showdrohne.
      - label: Sicherheitsbereich
        value: 100 × 100 m
        text: Während der Show hält sich hier niemand auf. Ein Geofence begrenzt den Flug.
      - label: Systeme
        value: Mehrfach abgesichert
        text: Automatische und manuelle Systeme überwachen jeden Flug. Fällt eine Drohne aus, fliegt sie meist zurück oder landet im Sicherheitsbereich.
      - label: Haftpflicht
        value: bis 1,3 Mio. €
        text: In jedem Paket enthalten.
      - label: Flughöhe
        value: bis 120 m
        text: So hoch fliegen wir in der Regel.
      - label: Kameras
        value: Keine
        text: Unsere Showdrohnen filmen nicht.

  - type: textMedia
    headline: Leise, ohne Rauch und ohne Müll vor Ort.
    body: |
      Nachhaltigkeit ist der Grund, aus dem wir FlyingStars gegründet haben. Wir denken sie bei jeder Entscheidung mit.

      - Vor Ort entstehen kein Feinstaub, kein Müll und kein Knall. Laut ist nur die Musik.
      - Unsere Akkus laden wir mit 100 % Ökostrom von naturstrom.
      - Die Drohnen wiegen rund 300 Gramm und werden in der EU gebaut, bei Drotek SAS in Frankreich.
      - Sie laufen mit zwei handelsüblichen AA-Akkus. Akkus, Motoren und Rotoren lassen sich einzeln tauschen.
      - Zu den Shows fahren wir mit einem elektrischen Ford E-Transit.

      Den Schallschutz unserer Shows hat der TÜV Nord in einem Gutachten untersucht. Und mit unseren Shows setzen wir regelmäßig Zeichen für Demokratie, Vielfalt und Zusammenhalt.

