title: "Duurzaamheid: droneshows van FlyingStars (vs. vuurwerk)"
description: Geen knal. Geen afval. Geen rook. ✓ Droneshows voor sociaal en ecologisch engagement. ☎︎ +49 209 88306562
noindex: false
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: hero
    kicker: Duurzaamheid
    headline: Geen knal. *Geen afval.* Geen rook.
    text: Onze droneshows laten zien dat groot spektakel ook stil, lokaal emissievrij en opgeruimd kan. En zo heten ze alle gasten van harte welkom – ook honden, kinderen en de natuur ter plaatse.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: Wereldbol van drones boven de Rijn tijdens de Extraschicht in Duisburg, publiek aan de oever
      width: 2544
      height: 1493
    _key: k_ef572ac0e4ba13d454af
  - type: sustainability
    id: alternative
    kicker: droneshows
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen, die Belege für Ökostrom und das TÜV-NORD-Schallschutzgutachten bereithalten und die Nutzung des naturstrom-Logos schriftlich freigeben lassen.
    headline: Het *alternatief* voor vuurwerk
    text: Onze droneshows mogen vaak vliegen waar vuurwerk vanwege geluidsoverlast, fijnstof of brandgevaar verboden of ongewenst is.
    facts:
      - label: Geen knal
        value: Stil
        text: Onze drones zoemen alleen zachtjes. TÜV NORD bevestigt onze geluidsbescherming. Zo kunnen ook gevoelige gasten meedoen.
        _key: k_5dfd76d168b4a97a8cff
      - label: Geen afval
        value: "0"
        unit: kg
        text: Onze drones zijn herbruikbaar. We laden ze steeds opnieuw op met 100% groene stroom van naturstrom.
        _key: k_2a3281e1e1ce468cb8ed
      - label: Geen rook
        value: "0"
        unit: g
        text: Onze drones produceren ter plaatse geen fijnstof, stikstofoxiden of zware metalen. Er komen geen open vlammen aan te pas.
        _key: k_85941100bf952a64e766
    points:
      - _key: k_4ecbfd8bacb8dad1a3e9
        value: Geluidsbescherming bevestigd door TÜV NORD
      - _key: k_8fd4b4570f848e1175a8
        value: 100% groene stroom van naturstrom
    proofImage:
      src: https://flyingstars.art/wp-content/uploads/2024/10/NATURSTROM-Logo_weiss.png
      alt: naturstrom
      width: 301
      height: 71
    _key: k_b58e8e802d7c6c5c47eb
  - type: landingSpotlight
    id: referenzen
    kicker: Referenties
    todo: FlyingStars muss ein Showfoto oder einen kurzen Loop von Kein Bock auf Nazis liefern (z. B. Open Flair 08.08.2025 oder Erfurt 02.07.2026) und die Namensnennung beider Partner freigeben.
    headline: We vliegen met *engagement*
    text: Als partner van ngo's mogen we regelmatig tekens voor democratie en milieubescherming aan de hemel zetten.
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: "Kleurrijke vuurwerkbloem van drones boven Berlijn tijdens de campagne #Böllerciao van de Deutsche Umwelthilfe, toeschouwers filmen met hun telefoon"
      width: 1920
      height: 987
    tags:
      - _key: k_189b36fdbb3bf810d7d6
        value: "#BÖLLERCIAO · Berlijn"
    entries:
      - kicker: Kein Bock e.V.
        title: Kein Bock auf Nazis
        text: Onze droneshows mobiliseren voor meer maatschappelijke samenhang.
        _key: k_e6753824ae3f10493a00
      - kicker: Deutsche Umwelthilfe
        title: "#BÖLLERCIAO"
        text: Sinds 2023 mogen we laten zien dat er geen vuurwerk nodig is om het publiek mee te slepen.
        _key: k_f7fcb999361464ffdc9c
    facts:
      - value: sinds 2025
        label: Kein Bock auf Nazis
        _key: k_e87e2228c45bc9d2a903
      - value: sinds 2023
        label: "#BÖLLERCIAO"
        _key: k_9d577b6e57e572327c0c
    _key: k_7b3ad6aa4b4e3680cb02
  - type: contactForm
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.
    kicker: Contact
    headline: Stel ons jullie vragen over *duurzaamheid*
    text: We zijn vaak het aanspreekpunt als het gaat om de sociale en ecologische aspecten van droneshows in vergelijking met vuurwerk.
    _key: k_b8cb61fd4f874a1403ea
