# Landingpage Indoor. Konzept IN-01 bis IN-10.
# Bestätigt im Fragebogen 21.10.2026: 20–50 Drohnen, 5–8 Min, mind. 3 m Deckenhöhe, ab ca. 15.000 € netto für 20 Drohnen,
# Referenzen Siemens Hannover Messe 03/2025 und Triple Z 09/2026.
# Nur von der Live-Indoor-Seite (nicht im Fragebogen bestätigt): 188 g, max. 1,5 m/s, 1–8 m Flughöhe, 0,5 m Abstand, UWB,
# CE-zertifizierte Komponenten, Ablauf 6–8 Wochen / Aufbau ab 2 h vorher / ca. 45 Min Aufbau. Vor Launch von FlyingStars bestätigen lassen.
# Inhalte aus Elevate (30.10.), übertragen auf die Designsprache.
# Runde 8 (31.10.2026, Marc: „deutlich mehr in dieses Interaktive … mehr Variation in den Layouts“): Hero mit Showreel im
# Rahmen, Raum als Schnitt mit Deckenhöhe und Checkliste, Sicherheit als Kacheln, Einsatzorte auf einem Bild, Ablauf als
# Zeitstrahl in Zahlen, Preis als Preiskarte mit Gesichtern. Bausteine: src/components/landing/.
# Runde 9: Abschluss als .promise, Zeitstrahl nur mit Zahlen, keine doppelten Kennzahlen, Icons in den Sicherheits-Kacheln.
# Kein Konfigurator-Teaser: Der Konfigurator zeigt die Outdoor-Pakete, die drinnen nicht gelten.
# Alle Texte sind Entwürfe für Moritz; neu formulierte Stellen tragen den Kommentar „Entwurf für Moritz“.
title: Indoor-Drohnenshow
navLabel: "Indoor"
description: "Indoor-Drohnenshows für Messen, Bühnen und Hallen: 20 bis 50 Drohnen, 5 bis 8 Minuten, ab 3 Meter Deckenhöhe. Individuell kalkuliert."
image: https://flyingstars.art/wp-content/uploads/2025/04/IMG_0201.jpg
sections:
  - type: landingHero
    kicker: Indoor
    headline: Drohnenshows für Messen, Bühnen und *Hallen*.
    text: Kleine Drohnen mit Rotorschutz fliegen im Raum, abgestimmt auf Musik und Licht. Jede Indoor-Show planen wir für euren Raum und kalkulieren sie einzeln.
    cta: { label: Indoor-Show anfragen, href: "#anfrage" }
    secondary: { label: Was drinnen anders ist, href: "#unterschied" }
    # Echte Indoor-Show (Siemens, Hannover Messe 03/2025), Recherche 31.10.2026 (codex-befunde/videos-je-anlass)
    video: siemensIndoor
    videoLabel: Siemens · Hannover Messe
    poster:
      src: https://flyingstars.art/wp-content/uploads/2025/04/IMG_0201.jpg
      alt: Dutzende leuchtende Drohnen in Reihen über dem Boden einer abgedunkelten Sporthalle
      width: 2560
      height: 1440
    # Entwurf für Moritz: Eckdaten aus dem Fragebogen
    facts:
      - { value: 20–50, label: Drohnen }
      - { value: 5–8 Min, label: Showdauer }
      - { value: ab 3 m, label: Deckenhöhe }

  - type: comparison
    id: unterschied
    kicker: Vergleich
    headline: Drinnen fliegt eine andere Show.
    text: Weniger und kleinere Drohnen, näher am Publikum, kürzer. Im Raum entstehen Muster und Figuren in Bewegung.
    rowHeader: Merkmal
    columns: [Indoor, Outdoor]
    rows:
      - label: Drohnen
        values: [20 bis 50, ab 100]
      - label: Dauer
        values: [5 bis 8 Minuten, in der Regel etwa 13 Minuten]
      - label: Gewicht je Drohne
        values: [188 g, ca. 300 g]
      - label: Ortung
        values: [Funkstationen im Raum (UWB), GPS]
      - label: Flughöhe
        values: [1 bis 8 m, in der Regel bis 120 m]
      - label: Platz
        values: [ab 3 m Deckenhöhe und eine freie Flugfläche, Sicherheitsbereich von ca. 100 × 100 m]
      - label: Preis
        values: ["einzeln kalkuliert, ab ca. 15.000 € netto für 20 Drohnen", "Pakete ab 7.900 € netto"]

  # Textentwurf für Moritz. Quellen und Konflikte: docs/sicherheitskonzept-quellen.md.
  - type: landingSite
    id: raum
    kicker: Voraussetzungen
    headline: Was euer Raum mitbringen muss.
    text: Grundriss, Deckenhöhe und die Position eures Publikums sind die Grundlage für unser Showkonzept.
    variant: indoor
    diagram:
      description: "Raumschnitt mit mindestens 3 m Deckenhöhe und Publikum neben der freien Flugfläche. Darunter eine Draufsicht auf ein beispielhaftes Startraster für 20 Drohnen mit Antennen an den Ecken des Fluggebiets."
      horizontalLabel: ca. 5 m
      verticalLabel: mind. 3 m
      detailLabel: 1 m Raster
      flightLabel: Flughöhe bis 8 m, passend zum Raum
      caption: "Schema, nicht maßstäblich. Startraster als Beispiel für 20 Drohnen auf ca. 5 × 5 m. Für 50 Drohnen nennt das Datenblatt ca. 7 × 7 m. Die gesamte Flugfläche und den Publikumsbereich planen wir für euren Raum."
    items:
      - title: Deckenhöhe
        value: mindestens 3 m
        text: "Die Flugbahnen passen wir an euren Raum an. Das Indoor-System fliegt bis zu 8 m hoch."
        zone: ceiling
      - title: Flugbereich
        text: "Die Start- und Flugfläche bleibt frei. Indoor nutzen wir ein eigenes Drohnensystem mit vorab berechneten Bahnen."
        zone: drones
      - title: Start- und Landefläche
        value: 1 m Startraster
        text: "Als Richtwert brauchen 20 Drohnen ca. 5 × 5 m, 50 Drohnen ca. 7 × 7 m. Der Boden muss eben sein, alle Drohnen starten auf derselben Höhe."
        zone: floor
      - title: Positionierung im Raum
        text: "Antennen stehen an den Ecken des Fluggebiets. Das UWB-System bestimmt die Positionen im Raum; Drohnen und Technik bringen wir mit."
        zone: kit
      - title: Publikumsbereich
        text: "Wir stimmen die Position eurer Gäste und die freie Flugfläche mit euch ab. Der Abstand zum Publikum wird im Showkonzept für euren Raum festgelegt."
        zone: guests
    responsibilities:
      provider:
        - "Wir planen Flugfläche, Publikumsposition und Choreografie für euren Raum. Jede Indoor-Show kalkulieren wir individuell."
        - "Wir bringen das Indoor-Drohnensystem, die Positionierungstechnik und unser Team mit."
      customer:
        - "Ihr schickt uns einen Grundriss mit Maßen und Deckenhöhe und nennt die geplante Position des Publikums."
        - "Ihr stellt eine freie Start- und Flugfläche auf ebenem Boden bereit. Einen Stromanschluss in der Nähe stimmen wir mit euch ab."
    download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }

  # Entwurf für Moritz: Sicherheit als Kacheln (Werte von der Live-Seite, siehe Kopfkommentar)
  - type: landingBento
    id: sicherheit
    kicker: Sicherheit
    headline: Sicher in der Nähe des Publikums.
    text: Indoor-Drohnen sind leichter und langsamer als unsere Outdoor-Flotte und fliegen vorab berechnete Bahnen.
    lead:
      label: Rotoren
      title: Ein Schutzrahmen um jeden *Rotor*.
      image:
        src: https://flyingstars.art/wp-content/uploads/2025/04/0L9A4365.jpg
        alt: Kleine Drohnen mit Rotorschutz leuchten blau auf einem dunklen Boden
        width: 2560
        height: 1708
    items:
      - { icon: gauge, title: "Höchstens 1,5 m/s", text: Schneller fliegen die Drohnen im Raum nicht. }
      - { icon: move-horizontal, title: "0,5 m Abstand", text: So weit bleiben zwei Drohnen mindestens auseinander. }
      - { icon: shield-check, title: Mehrfach abgesichert, text: "Redundante Sicherheitsfunktionen, eine kontrollierte Landefunktion und CE-zertifizierte Komponenten." }

  # Entwurf für Moritz: Einsatzorte als Markierungen auf dem Bild, Referenzen darunter; Inhalte wie bisher
  - type: landingSpotlight
    id: einsatzorte
    kicker: Einsatzorte
    headline: Wo Indoor-Shows passen.
    text: Markenfarben und Musik stimmen wir auf euren Auftritt ab.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/04/drohnenshow-indoor-2.jpg
      alt: Leuchtende Drohnen in Formation vor der Bühne eines voll besetzten Saals
      width: 1200
      height: 764
    tags: [Messen, Konzerte, Sportevents, Firmenfeiern, Hochzeiten in Sälen]
    entries:
      - { kicker: Hannover Messe · März 2025, title: Siemens, text: Unsere erste Indoor-Show. }
      - { kicker: Essen · September 2026, title: Triple Z, text: "Im Gründungszentrum auf Zeche Zollverein, in dem auch unser Büro ist." }

  # Entwurf für Moritz: Ablauf in Zahlen wie auf der Startseite (Werte von der Live-Seite, siehe Kopfkommentar)
  - type: tempo
    id: ablauf
    kicker: Ablauf
    headline: So läuft eine Indoor-Show ab.
    marks:
      - { value: 48 h, label: bis zu unserer Antwort, text: "Ihr erzählt uns von Raum, Anlass und Termin." }
      - { value: 6–8 Wochen, label: "Vorlauf, ideal", text: "Design und Planung im Raum. Vorab seht ihr die Show als Video oder bei einem Testflug." }
      - { value: 45 Min, label: Aufbau bis startklar, text: Wir beginnen ab zwei Stunden vor der Show. }

  # Entwurf für Moritz: Preis als Karte, Inhalte wie bisher
  - type: landingPrice
    id: preise
    kicker: Preise
    headline: Was eine Indoor-Show kostet.
    text: Indoor-Shows kalkulieren wir einzeln. Die Outdoor-Pakete gelten drinnen nicht.
    price: ab ca. 15.000 €
    unit: netto für 20 Drohnen, als Größenordnung
    groups:
      - title: Der Preis hängt ab von
        items:
          - { label: eurem Raum }
          - { label: der Drohnenzahl, value: 20–50 }
          - { label: dem Aufbau }
    cta: { label: Indoor-Angebot anfragen, href: "#anfrage" }

  - type: faq
    id: fragen
    kicker: FAQ
    headline: Fragen zu Indoor-Shows.
    cta: { label: Alle Fragen, href: /faq/ }
    tags: [indoor]

  - type: contactForm
    kicker: Anfrage
    headline: Erzählt uns von eurem Raum.
    text: Deckenhöhe, Fläche und Datum reichen für eine erste Einschätzung. Wir melden uns innerhalb von 48 Stunden.
