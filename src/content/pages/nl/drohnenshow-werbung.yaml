title: Droneshows als reclame
navLabel: Merken & reclame
description: "Droneshows voor merken en bureaus: jullie logo aan de nachthemel, elk beeld vooraf goedgekeurd. Voor lanceringen, jubilea en campagnes."
image: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
sections:
  - type: landingHero
    kicker: Merken & reclame
    headline: Jullie merk aan de *nachthemel*.
    text: We zetten jullie logo en boodschap om in drones, afgestemd op muziek en campagne. Elk beeld keuren jullie vóór de show goed.
    cta:
      label: Vraag een merkshow aan
      href: "#anfrage"
    secondary:
      label: Voor bureaus
      href: "#agenturen"
    video: ford
    videoLabel: Ford Explorer · Keulen
    poster:
      src: https://flyingstars.art/wp-content/uploads/2024/12/VW50Golf.jpg
      alt: Volkswagen-logo van drones boven de Wolfgangsee, gasten filmen vanaf een terras
      width: 1920
      height: 1281
    facts:
      - value: "178"
        label: shows sinds 2022
      - value: 48 h
        label: tot ons antwoord
      - value: 1–2 weken
        label: met express
    todo: Moritz muss die deutsche Endfassung und die maschinell übersetzten EN-/NL-Texte redaktionell prüfen.
