name: Content-Intake (deterministisch)
# Spur A: Issue Form → Content-Datei → PR. Kein LLM beteiligt.
# Trigger: Issue wird mit einem der Labels content:blogpost / content:projekt / content:faq
# eröffnet (Issue Forms setzen es automatisch; GitHub feuert dann nur `opened`, kein `labeled`)
# oder bekommt das Label nachträglich.
on:
  issues:
    types: [opened, labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
# Ein Lauf pro Issue; doppelte Label-Events warten statt zu kollidieren.
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  intake:
    if: >-
      (github.event.action == 'labeled' && startsWith(github.event.label.name, 'content:')) ||
      (github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'content:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      - name: Typ aus Label ableiten
        id: t
        env: { LABELS: '${{ join(github.event.issue.labels.*.name, '','') }}' }
        run: |
          LABEL=$(tr ',' '\n' <<< "$LABELS" | grep '^content:' | head -1)
          echo "type=${LABEL#content:}" >> "$GITHUB_OUTPUT"
      - name: Content-Datei erzeugen
        id: gen
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          FILE=$(node scripts/issue-to-content.mjs "${{ steps.t.outputs.type }}" "${{ github.event.issue.number }}" < /tmp/body.md)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
        env: { BODY: '${{ github.event.issue.body }}' }
      - name: Branch und PR
        env:
          # BOT_TOKEN = Token einer separaten Bot-Identität (GitHub App oder Fine-grained PAT).
          # Nötig, damit (a) CI auf dem PR läuft (GITHUB_TOKEN löst keine Workflows aus) und
          # (b) Marc den PR approven kann (eigene PRs kann man nicht approven).
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
          FILE: ${{ steps.gen.outputs.file }}
          N: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "content-intake[bot]"
          git config user.email "content-intake@users.noreply.github.com"
          BR="content/issue-$N"
          # Idempotent: existiert Branch oder PR schon, nur melden statt scheitern.
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            PR=$(gh pr list --head "$BR" --json url --jq '.[0].url')
            gh issue comment "$N" --body "Für dieses Issue gibt es bereits einen Branch \`$BR\`${PR:+ und einen PR: $PR}. Kein zweiter Lauf nötig."
            exit 0
          fi
          git checkout -b "$BR"
          git add "$FILE"
          git commit -m "content: $TITLE (#$N)"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "Content: $TITLE" \
            --body "Automatisch aus Issue #$N erzeugt (Spur A, deterministisch). Datei: \`$FILE\`. Status \`draft: true\`, beim Review auf \`false\` setzen oder Preview prüfen und mergen. Closes #$N" \
            --label content
      - name: Fehler ins Issue melden
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh issue comment "${{ github.event.issue.number }}" --body "Intake fehlgeschlagen. Bitte Pflichtfelder prüfen (Beschreibung 50–160 Zeichen, Text vorhanden). Details im Workflow-Log."
