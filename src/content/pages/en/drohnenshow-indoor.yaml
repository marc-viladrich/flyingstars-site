  - type: sustainability
    id: unterschied
    kicker: An alternative to the light show
    headline: As fascinating as *fireworks*, as safe as lasers
    text: |-
      We bring the sparkle, the glamour and the amazed guests of fireworks under your roof. Without debris or smoke, and with nothing but a soft hum.
  
      Your indoor drone show is a {{duration.indoor.min}}- to {{duration.indoor.max}}-minute choreography that captivates every visitor. After all, hardly any guest has ever seen one of these magical dances – let alone indoors.
  
      That is why we design fascinating motifs, set to music, that tell your story. From 50 drones, also with bespoke figures such as your logo or your initials.
    cta:
      label: Request a show
      href: "#anfrage"
    show: indoor
    _key: k_c030e32b9a3f99dac46e
