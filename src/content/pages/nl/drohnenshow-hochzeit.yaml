  - type: textMedia
    id: choreografie
    kicker: Choreografie op maat
    headline: Zo uniek als jullie lovestory
    body: "Een zwerm stralende lichtshowdrones tekent jullie initialen, liefdesverklaringen en insiders aan het firmament. Afgestemd op de muziek en op maat van jullie wensen."
    mediaSide: right
    _key: k_52056666f5076b5e0423
  - type: textMedia
    id: familienfreundlich
    kicker: Gezinsvriendelijk
    headline: Kinderen en honden welkom
    body: "Anders dan bij vuurwerk is er bij een droneballet geen harde knal, geen storende rook en geen afval met brandgevaar. Alleen een zacht gezoem – en de verwondering van de gasten."
    mediaSide: right
    _key: k_59a09168d2946ce16e34
  - type: steps
    id: vorteile
    kicker: Voordelen
    headline: Onze beloften
    steps:
      - title: Alles inbegrepen
        text: "Ontwerp, muziek, show, vergunningen: wij nemen jullie alles uit handen, alles uit één hand."
        _key: k_856e2a0f8b72501f0a1b
      - title: Internationaal
        text: "Waar jullie ook feesten, wij zijn erbij: in Duitsland, Oostenrijk, Zwitserland of wereldwijd."
        _key: k_f070569c03c9b4b11034
      - title: Veilig
        text: We zijn LBA- en EASA-gecertificeerd en zorgen voor een veiligheidszone van 100 x 100 meter.
        _key: k_85e68777aa937b3e85b1
    ownNumbers: true
    _key: k_9d2cf9c04b90b456039c
  - type: landingRefs
    id: referenzen
    kicker: Referenties
    headline: Nachten die we nooit vergeten
    projects:
      - heiratsantrag-hugenpoet
      - hochzeit-recklinghausen
    cards:
      - ref: heiratsantrag-hugenpoet
        title: Huwelijksaanzoek in Essen
        kicker: Ze zei ja!
        text: Met 220 drones mochten we onze klant Armin helpen zijn Berina voor zich te winnen. Begeleid door een violiste hulden we de hemel boven Schloss Hugenpoet in teder wit.
        _key: k_1cd45074068daabdd5a2
      - ref: hochzeit-recklinghausen
        title: Bruiloft in Recklinghausen
        kicker: Verrassing voor het bruidspaar
        text: Veronika en Felix keken hun ogen uit toen hun liefdesverhaal plotseling boven hen oplichtte. Op verzoek van de familie mochten we de choreografie in het geheim voorbereiden.
        _key: k_0df1ee61f7ea5938057b
    _key: k_6500b76af74b7dd741ca
  - type: landingTeaser
    id: preise
    kicker: Kosten
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
    headline: Stel jullie show samen
    text: "Onze droneshows beginnen bij € 7.900 (excl. btw) plus reiskosten. Met meer drones, maatwerk en extra's zoals foto's of video's van de voorstelling kunnen jullie het pakket aanpassen."
    href: /drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator
    cta: Pakketten bekijken
    loop: hochzeit
    _key: k_3f8f37b2eb211e01710f
  - type: steps
    id: ablauf
    kicker: Verloop
    headline: "Wij plannen, jullie leunen achterover"
    steps:
      - title: "#1 Aanvraag"
        text: Wanneer en waar trouwen jullie? Binnen 48 uur nemen we contact op om kennis te maken en jullie een vaste offerte te doen. Een bezoek aan jullie locatie is zelden nodig.
        _key: k_6b92c66eeb04fdf588fc
      - title: "#2 Voorbereiding"
        text: "Jullie vertellen ons jullie liefdesverhaal. Wij maken er een choreografie van. En omdat het plannen van een bruiloft al stressvol genoeg is, regelen we ook vergunningen en dergelijke."
        _key: k_54439060443f507bff93
      - title: "#3 Bruiloft"
        text: "Vanaf drieënhalf uur voor de dronedans bereiden we alles voor. De show zelf duurt tot 25 minuten. Jullie mogen kijken en genieten – opbouw, afbouw en veiligheid regelen wij."
        _key: k_77816c393a12e22dfcb5
    ownNumbers: true
    _key: k_bd1dd6072c1145a15939
  - type: team
    id: ueber
    kicker: Over FlyingStars
    todo: FlyingStars muss ein Teamfoto liefern.
    cta:
      label: Over ons
      href: /ueber-uns/
    headline: Het is ons een eer om jullie gasten te mogen zijn
    text: "Normaal gesproken vliegen we voor steden, festivals en wereldconcerns als L’Oréal, Prada of Spotify. Maar een bijzondere plek in ons fotoalbum hebben de bruidsparen van wie we de bruiloft onvergetelijk mochten maken. Daarom zijn we een van de weinige aanbieders die ook voor privéfeesten vliegen. Op jullie feest zorgen we met een kleine crew op de achtergrond dat alles soepel verloopt."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    _key: k_3ed49f154258b655d578
  - type: contactForm
    kicker: Droneshow voor de bruiloft boeken
    headline: Laten we jullie choreografie plannen
    text: "Reserveer jullie trouwdatum op tijd, stel ons jullie vragen of vertel ons over jullie showidee. We antwoorden binnen 48 uur."
    _key: k_f7f1d08aab8e84a827cd
