    headline: Een beproefd proces
    marks:
      - value: 48 u
        label: "#1 Aanvraag"
        text: Als jullie ons datum, locatie en gelegenheid doorgeven, komen we binnen 48 uur terug met ideeën. Een eerste gesprek is de volgende stap, een afspraak ter plaatse is zelden nodig.
        _key: k_bcd783da285c16316e38
      - value: < 2 weken
        label: "#2 Planning"
        text: Wij bouwen verhaallijn en motieven. Jullie wensen zijn van harte welkom. We regelen bovendien alle vergunningen, jullie leveren alleen de toestemming van de grondeigenaren.
        _key: k_1a7a9d6124366c37cbbf
      - value: 3,5 u
        label: "#3 Showdag"
        text: Terwijl jullie je om de gasten bekommeren, bouwen wij op (drieënhalf uur), voeren de show uit (vijf tot acht minuten) en breken geruisloos weer af.
        _key: k_2a47818390caa6ae1614
