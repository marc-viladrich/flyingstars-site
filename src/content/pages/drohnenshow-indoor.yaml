  # Sicherheit kompakt (Marc, 17.11.2026): links Moritz' drei Absätze, rechts nur die Indoor-Zeichnung mit Popovern an den
  # Zonen, keine Aufgaben-Tabelle; darunter LBA/EASA als Logo-Reihe; 10 × 10 m Freifläche nach Moritz am Flugbereich
  - type: landingSite
    id: sicherheit
    kicker: Sicherheit
    headline: Für eine sorglose Darbietung
    text: |-
      Wir erfüllen die strengen Sicherheitsauflagen, die für Indoor-Drohnenshows gelten. Deshalb benötigen wir eine Freifläche von etwa 10 x 10 Metern und eine Deckenhöhe von mindestens drei Metern. Ein Vorteil im Inneren: Wind und Wetter stellen kein (Absage-)Risiko dar.

      Zusätzlich setzen wir auf redundante Sicherheitsmechanismen. Die Rotoren sind physikalisch geschützt, alle Komponenten CE-zertifiziert. Die Drohnen fliegen langsam und wiegen unter 200 Gramm.

      Wir sind zertifiziert nach Luftfahrt-Bundesamt und EU Aviation Safety. Der TÜV NORD bescheinigt unserer Flotte zudem die Einhaltung des Schallschutzes. Im Fall der Fälle sichert euch unsere Haftpflicht bis 1,3 Mio. Euro ab.
    variant: indoor
    diagram:
      description: "Raumschnitt mit mindestens {{offer.indoor.ceilingMin}} m Deckenhöhe und Publikum neben der freien Flugfläche. Darunter eine Draufsicht auf ein beispielhaftes Startraster für 20 Drohnen mit Antennen an den Ecken des Fluggebiets."
      horizontalLabel: ca. 5 m
      verticalLabel: "mind. {{offer.indoor.ceilingMin}} m"
      detailLabel: 1 m Raster
      flightLabel: Flughöhe bis 8 m, passend zum Raum
      caption: "Schema, nicht maßstäblich. Startraster als Beispiel für {{offer.indoor.drones.min}} Drohnen auf ca. 5 × 5 m. Für 50 Drohnen nennt das Datenblatt ca. 7 × 7 m. Die gesamte Flugfläche und den Publikumsbereich planen wir für euren Raum."
    items:
      - title: Deckenhöhe
        value: "mindestens {{offer.indoor.ceilingMin}} m"
        text: "Die Flugbahnen passen wir an euren Raum an. Das Indoor-System fliegt bis zu 8 m hoch."
        zone: ceiling
        _key: k_b1de79da73ea068f872c
      - title: Flugbereich
        value: ca. 10 × 10 m Freifläche
        text: "Die Start- und Flugfläche bleibt frei. Indoor nutzen wir ein eigenes Drohnensystem mit vorab berechneten Bahnen."
        zone: drones
        _key: k_0bd5c94f0e07243b0cc8
      - title: Start- und Landefläche
        value: 1 m Startraster
        text: "Als Richtwert brauchen 20 Drohnen ca. 5 × 5 m, 50 Drohnen ca. 7 × 7 m. Der Boden muss eben sein, alle Drohnen starten auf derselben Höhe."
        zone: floor
        _key: k_b708426fb85bea29d91e
      - title: Positionierung im Raum
        text: "Antennen stehen an den Ecken des Fluggebiets. Das UWB-System bestimmt die Positionen im Raum; Drohnen und Technik bringen wir mit."
        zone: kit
        _key: k_4a99c3eed498d8e2ac37
      - title: Publikumsbereich
        text: "Wir stimmen die Position eurer Gäste und die freie Flugfläche mit euch ab. Der Abstand zum Publikum wird im Showkonzept für euren Raum festgelegt."
        zone: guests
        _key: k_e8a36322c9c72cbbe82f
    download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }
    quality:
      - { title: Betriebsgenehmigung des Luftfahrt-Bundesamts, text: seit Juli 2023, icon: permit, logo: /brand/logos/quali-lba-weiss.png, cleared: true, "_key": "k_d056058898547d0bb1a9" }
      - { title: EU-weit nach EASA-Regeln, text: "Shows in der ganzen EU, auch in Österreich und den Niederlanden", icon: permit, logo: /brand/logos/quali-easa-weiss.png, cleared: true, "_key": "k_5a63e48e8e1aaad88bfe" }
    todo: "FlyingStars muss Indoor-Flugfläche, Publikumsabstände, Strombedarf, Sicherheitsfunktionen und die für Indoor geltende Haftpflichtdeckung bestätigen; die Rastermaße allein bestimmen den Raumbedarf nicht."
    _key: k_1060f8471da9620b9d94

