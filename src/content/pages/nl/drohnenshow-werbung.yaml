    headline: Na 150+ shows nog altijd als de eerste keer
    text: De meeste mensen zien voor het eerst een droneshow. Het is onze taak om ze mee te slepen! Daarom verzorgen we sinds 2021 voorstellingen die lang in het hoofd en diep in het hart blijven.
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    _key: k_b75368d6c59a6a7e8123
  - type: contactForm
    kicker: Dronereclame en -marketing boeken
    headline: Vertel ons over jullie campagne
    text: Laten we brainstormen hoe jullie merk er aan de hemel uit zou kunnen zien – of leg meteen een van de vrije data in 2027 en 2028 vast.
