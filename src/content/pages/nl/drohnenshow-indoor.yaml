    secondary:
      label: In de pers
      href: "#kundinnen"
    headline: Grote spektakels – zonder compromissen
    text: "Wij geloven dat elk event een goede show verdient – of het nu binnen of buiten is. Daarom brengen we sinds 2025 de ervaring uit meer dan 150 openluchtvoorstellingen voor wereldmerken als VW, Spotify en de NFL ook naar hallen over de hele wereld."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    _key: k_3f360cd3359685940aa9
  - type: contactForm
    kicker: Indoor-droneshow boeken
    headline: We kijken uit naar jullie aanvraag
    text: Hoe kunnen we jullie verhaal met een indoor-droneshow vertellen? Reserveer een van de vrije data in 2027 en 2028 of laten we over jullie ideeën praten. We antwoorden binnen 48 uur.
    _key: k_bda39ceb090f8b699835
