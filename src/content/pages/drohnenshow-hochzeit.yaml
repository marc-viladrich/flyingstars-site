          - { label: Genehmigung, "_key": "k_8f2c8df476eed9be19a0" }
          - { label: Musikschnitt, "_key": "k_2783c106e5d6abc32f17" }
          - { label: Unser Team vor Ort, "_key": "k_0cb78b0d15ef58649c64" }
          - { label: "Haftpflicht bis 1,3 Mio. €", "_key": "k_7905bc184ed46dace247" }
        _key: k_6de6ec032d67c38d5810
      - title: Kann dazukommen
        items:
          - { label: Anfahrt ab Gelsenkirchen, value: nach Ort, "_key": "k_149ad168bfbf92228a1d" }
