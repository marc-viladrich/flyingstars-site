  - type: sustainability
    id: unterschied
    kicker: Alternatief voor de lichtshow
    headline: Fascinerend als *vuurwerk*, veilig als laser
    text: |-
      We halen de fonkeling, de glans en de verwonderde gasten van vuurwerk onder jullie dak. Zonder afval en rook, en met alleen een zacht gezoem.
  
      Jullie indoor-droneshow is een choreografie van {{duration.indoor.min}} tot {{duration.indoor.max}} minuten die de aandacht van alle bezoekers vasthoudt. Want bijna geen gast heeft al eens zo'n magische dans gezien – laat staan binnen.
  
      Daarom ontwerpen we fascinerende motieven op muziek die jullie verhaal vertellen. Vanaf 50 drones ook met eigen figuren, zoals jullie logo of jullie initialen.
    cta:
      label: Show aanvragen
      href: "#anfrage"
    show: indoor
    _key: k_c030e32b9a3f99dac46e
  - type: steps
    id: komplettpaket
    kicker: Totaalpakket
    headline: Wees *gast* op jullie eigen event
    text: Wij zorgen voor de complete planning, uitvoering en afbouw. Jullie genieten van de voorstelling.
    steps:
      - title: Vanaf 20 drones, naar boven onbeperkt.
        icon: sparkles
        _key: k_741d87d671268b7a4706
