title: Wedding drone show
navLabel: Wedding
description: "A drone show for your wedding: initials, hearts and your date in the night sky. SPARK with 100
  drones from €7,900 excluding VAT, permits included."
image: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
sections:
  - type: landingHero
    kicker: Wedding
    headline: A drone show for your wedding.
    text: Your initials, a heart and your date in the night sky. We plan the show with you, obtain the permit and
      fly on the evening of your celebration.
    cta:
      label: Enquire about a wedding show
      href: "#anfrage"
    secondary:
      label: How it works
      href: "#ablauf"
    video: showreel
    videoLabel: Showreel
    poster:
      src: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
      alt: A hand and ring made of drones in the blue evening sky above the treetops, during a proposal at Schloss
        Hugenpoet
      width: 2063
      height: 1303
    facts:
      - value: from €7,900
        label: excluding VAT with SPARK
      - value: 100 drones
        label: in the package
      - value: included
        label: Permit
  - type: landingStories
    id: referenzen
    kicker: Our work
    headline: What it looked like for other *couples*.
    items:
      - kicker: Recklinghausen · June 2024
        title: A surprise planned by the family
        text: The family contacted us four months before the wedding. The take-off area was on a neighbouring
          property, without the couple knowing. A thunderstorm meant we delayed the show that evening, then
          flew.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/Hochzeit_cover.jpg
          alt: Two flowers made of purple and blue points of light above the trees at a wedding in Recklinghausen
          width: 1518
          height: 854
        facts:
          - value: "150"
            label: Drones
          - value: 4 months
            label: booked in advance
      - kicker: Schloss Hugenpoet, Essen · September 2024
        title: „Do you want to be my Forever?“
        text: A jewellery box opened, a ring floated towards a hand, then the question appeared in the sky. The answer
          was yes.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
          alt: A hand and ring made of drones in the blue evening sky above the treetops, during a proposal at Schloss
            Hugenpoet
          width: 2063
          height: 1303
        facts:
          - value: "220"
            label: Drones
  - type: landingTeaser
    id: motive
    kicker: Motifs
    headline: What can *appear* in the sky.
    text: Hearts and rings from our catalogue, plus your initials or your date. We design your own show together
      with you.
    href: /drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator
    cta: See motifs in the configurator
    loop: hochzeit
  - type: landingPrice
    id: preise
    kicker: Prices
    headline: What a wedding show costs.
    text: SPARK is designed for weddings. All prices exclude VAT and travel.
    package: SPARK
    groups:
      - title: Included
        items:
          - label: Design of your motifs, with approval
          - label: Permit
          - label: Music editing
          - label: Our crew on site
          - label: Liability cover up to €1.3 million
      - title: Optional additions
        items:
          - label: Travel from Gelsenkirchen
            value: based on location
          - label: Express with under 14 days' notice
            value: based on scope
          - label: Raw footage filmed by camera drone
            value: 900 €
    bonus:
      value: −10 %
      text: "Early booking discount: book by the end of the year for a wedding next year."
    contact: Ronja, Florian and Erwin reply to your enquiry within 48 hours.
    cta:
      label: Enquire about a wedding show
      href: "#anfrage"
  - type: landingSite
    id: location
    kicker: Location
    headline: Is your *venue* suitable?
    text: We check the site before quoting. Send us the address and tell us where your guests will stand.
    variant: outdoor
    items:
      - title: Safety area
        value: approx. 100 × 100 m
        text: Nobody may enter during the show. Its size depends on the drone count, motifs and flight altitude.
        zone: safety
      - title: Drones in the sky
        value: up to 120 m
        text: The drones form a line across the viewing direction, so the motifs face your guests.
        zone: drones
      - title: Take-off and landing area
        text: A clear area sized to suit the drone count. It is closed off from around three hours before the show.
        zone: start
      - title: Clear views for your guests
        text: The show is oriented towards your guests. They stand outside the safety area, away from walls and trees
          that could obstruct the view.
        zone: guests
      - title: Venue consent
        text: The landowners, such as your venue, give their consent. We provide the letter they need.
    note:
      value: approx. 3 months
      text: Lead time if your venue is near an airport. The permit takes longer in that case.
    download:
      label: Technical data sheet · PDF
      href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf
  - type: tempo
    id: ablauf
    kicker: The process
    headline: Leading up to your evening.
    text: You plan the celebration. We'll get in touch when we need a decision. One to two months' notice is ideal.
    marks:
      - value: 48 h
        label: until our reply
        text: A date, venue and your idea are enough. Then a short conversation and your quote.
      - value: 3 weeks
        label: for motifs and music, minimum
        text: You see a draft with your music, give feedback and approve every motif at the end.
      - value: 3 h
        label: on site before the show
        text: Our crew secures the take-off area, flies the show and packs everything away afterwards.
    shortcut:
      value: Express in under 14 days
      label: Surcharge based on scope
  - type: landingCta
    headline: Planning a *surprise*?
    text: Whether it's a proposal or a family gift, we coordinate only with you. We set up the take-off area out
      of sight and agree the timing with the venue.
    button:
      label: Enquire about a surprise
      href: "#anfrage"
  - type: landingBento
    id: wetter
    kicker: Weather
    headline: What if the weather won't cooperate?
    lead:
      icon: shield-check
      title: A drone show uses no *pyrotechnics*.
      text: No bangs, smoke, sparks or debris on the lawn afterwards. Only your music is loud.
    items:
      - icon: wind
        title: Up to wind force 5
        text: We fly in these conditions, including light drizzle.
      - icon: calendar-sync
        title: Reschedule free of charge
        text: If bad weather is forecast, we can reschedule as long as we haven't set off yet.
      - icon: wallet
        title: 40% deposit
        text: Payable when booking. If the show is cancelled altogether, the cancellation scale in our terms applies.
  - type: faq
    id: fragen
    kicker: FAQ
    headline: Questions from couples.
    text: Brief answers here. Find more in our frequently asked questions.
    cta:
      label: All questions
      href: /faq/
    tags:
      - hochzeit
  - type: contactForm
    kicker: Enquiry
    headline: Tell us about your wedding day.
    text: A date and venue are enough to start. We'll reply within 48 hours with an initial assessment.
