    cards:
      - { ref: heiratsantrag-hugenpoet, title: Heiratsantrag in Essen, kicker: Sie hat Ja gesagt!, text: "Mit 220 Drohnen durften wir unserem Klienten Armin dabei helfen, seine Berina zu gewinnen. Begleitet von einer Violinistin hüllten wir den Himmel über dem Schloss Hugenpoet in zartes Weiß.", "_key": "k_1cd45074068daabdd5a2" }
