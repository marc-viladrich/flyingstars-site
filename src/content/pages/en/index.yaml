  - type: textMedia
    id: warum-drohnen
    kicker: Bespoke drone shows
    headline: Fireworks? *So last year*
    body: |-
      Welcome to the future of entertainment. Drone light shows are the alternative for guests who have seen enough pyrotechnics.

      They are **more spectacular**: 3D instead of 2D, visible for miles, still hardly known – attention guaranteed.

      **More emotional**: firecrackers bang. Drone shows tell stories that thrill and move.

      And **more unique**: with 100 to 1000+ points of light we can build almost any motif.

      What does your story look like drawn across the sky? Let's find out!
    mediaSide: right
    cta:
      label: Plan a drone show
      href: /drohnenshow-preise/
    _key: k_55390b5c7d73f75ab4f2
