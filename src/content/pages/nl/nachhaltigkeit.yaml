title: "Duurzaamheid: droneshows van FlyingStars (vs. vuurwerk)"
description: Geen knal. Geen afval. Geen rook. ✓ Droneshows voor sociaal en ecologisch engagement. ☎︎ {{contact.phone.international}}
noindex: false
image: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
sections:
  - type: hero
    kicker: Duurzaamheid
    headline: Geen knal. *Geen afval.* Geen rook.
    text: Onze droneshows laten zien dat groot spektakel ook stil, lokaal emissievrij en opgeruimd kan. En zo heten ze alle gasten van harte welkom – ook honden, kinderen en de natuur ter plaatse.
    image:
      src: https://flyingstars.art/wp-content/uploads/2025/10/Extraschicht_Duisburg.jpg
      alt: Wereldbol van drones boven de Rijn tijdens de Extraschicht in Duisburg, publiek aan de oever
      width: 2544
      height: 1493
    _key: k_ef572ac0e4ba13d454af
  - type: sustainability
    id: alternative
    kicker: droneshows
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen, die Belege für Ökostrom und das TÜV-NORD-Schallschutzgutachten bereithalten und die Nutzung des naturstrom-Logos schriftlich freigeben lassen.
    headline: Het *alternatief* voor vuurwerk
    text: Onze droneshows mogen vaak vliegen waar vuurwerk vanwege geluidsoverlast, fijnstof of brandgevaar verboden of ongewenst is.
    facts:
      - label: Geen knal
        value: Stil
        text: Onze drones zoemen alleen zachtjes. TÜV NORD bevestigt onze geluidsbescherming. Zo kunnen ook gevoelige gasten meedoen.
        _key: k_5dfd76d168b4a97a8cff
      - label: Geen afval
        value: "0"
        unit: kg
        text: Onze drones zijn herbruikbaar.
        _key: k_2a3281e1e1ce468cb8ed
      - label: Geen rook
        value: "0"
        unit: g
        text: Onze drones produceren ter plaatse geen fijnstof, stikstofoxiden of zware metalen. Er komen geen open vlammen aan te pas.
        _key: k_85941100bf952a64e766
      - label: Groene stroom
        value:
          fact: renewablePercent
          display: number
        unit: "%"
        text: We laden onze drones steeds opnieuw op met 100% groene stroom van naturstrom.
        logo:
          src: https://flyingstars.art/wp-content/uploads/2024/10/NATURSTROM-Logo_weiss.png
          alt: naturstrom
          width: 301
          height: 71
        _key: k_3c9e5a71f0b24d68e1a7
