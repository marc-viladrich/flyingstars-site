title: "Boek een droneshow: ruim 150 shows sinds 2022"
description: "Droneshows voor bedrijven, steden en grote momenten: ruim 150 shows sinds 2022, eigen vloot,
  vergunning inbegrepen. Vraag een show aan."
image: https://flyingstars.art/wp-content/uploads/2024/07/Prada_Cover_img.jpg
sections:
  - type: showreelHero
    eyebrow: Droneshows sinds 2022 · DE · AT · CH · Benelux
    headline: Wij geven jullie stukje hemel vorm.
    text: Droneshows voor bedrijven, steden, festivals en stellen. We ontwerpen de beelden, regelen de vergunning
      en vliegen met onze eigen vloot.
    words:
      - Nieuw.
      - Uniek.
      - Anders.
      - Spectaculair.
    cta:
      label: Vraag een show aan
      href: "#anfrage"
    secondary:
      label: Pakketten en prijzen
      href: /drohnenshow-preise/
