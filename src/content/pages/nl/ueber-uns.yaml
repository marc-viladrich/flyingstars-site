        _key: k_61cf80d1d9046e824f10
      - value: "700"
        label: drones in onze grootste show
        _key: k_1ad8788ba42c8951f048
    _key: k_b7135e5f4ccf1ef0e1c1
  - type: sustainability
    id: nachhaltigkeit
    kicker: Duurzaamheid
    headline: Feesten waarbij *iedereen* welkom is
    text: "Honden, kinderen, de natuur: grote delen van onze samenleving blijven liever weg bij vuurwerk. Wij vieren liever feesten waar we allemaal enthousiast van worden. Daarom bieden we met droneshows een alternatief voor de knallen, het afval en de rook van vuurwerk. En zetten we regelmatig tekens voor democratie en milieubescherming aan de hemel."
    gallery: willkommen
    cta:
      label: Meer over duurzaamheid
      href: /nachhaltigkeit/
    _key: k_0fa41045b869c8273b40
  - type: steps
    id: haltung
    kicker: Waar we voor staan
    headline: Deze waarden vliegen altijd mee
    steps:
      - title: Teamwork
        subtitle: Samen voor één moment
        text: Onze choreografieën ontstaan niet in je eentje, maar in de vertrouwde samenwerking binnen ons team en met jullie. Met veel klanten onderhouden we daarom al jaren nauw contact.
        icon: handshake
        _key: k_f25977eef0b3c3073f86
      - title: Nieuwsgierigheid
        subtitle: Hoe straalt jullie verhaal?
        text: "We vinden steeds nieuwe manieren om mensen te betoveren. Soms met meer spektakel: de modernste techniek, grotere dansen, meer power. Soms met creativiteit en esthetiek, om met maar een paar pixels aan de hemel een hele wereld te scheppen."
        icon: telescope
        _key: k_1705c70732105b287ad3
      - title: Grondigheid
        subtitle: Elk detail telt
        text: Zodat jullie samen met jullie gasten de sprookjesachtige sfeer kunnen opsnuiven, plannen we elke stap zorgvuldig. Dankzij de ervaring van meer dan 150 evenementen over de hele wereld zijn we op vrijwel elke situatie voorbereid.
        icon: list-checks
        _key: k_4cbe7266c56990c2d263
    surface: alt
    ownNumbers: false
    _key: k_5f577f27ee53584bc075
  - type: team
    id: team
    kicker: Ons team
    todo: FlyingStars muss Fotos von Patrick, Alejandro und Chopper liefern sowie hochauflösende Porträts der drei Geschäftsführer:innen; Nachnamen von Patrick und Alejandro fehlen in Moritz' Text.
    headline: Alles uit één hand
    text: Wie FlyingStars boekt, krijgt FlyingStars – geen externe dienstverleners. We doen alle taken intern met een goed ingespeeld team. Daarnaast helpen zo'n tien uitzendkrachten ons bij de opbouw, de afbouw en de beveiliging van onze optredens.
    members:
      - personId: florian-becker
      - personId: ronja-donsbach
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
      - personId: chopper
    memberTexts:
      - personId: florian-becker
        role: Directeur
        bio: Flo verzorgt onze interne administratie. Daarnaast schrijft hij voor onze blog.
        _key: k_b465446582054e981d9b
      - personId: ronja-donsbach
        role: Directeur
        bio: Ronja behandelt waarschijnlijk jullie aanvraag en coördineert de samenwerking binnen ons team.
        _key: k_354002e2469c5de0d5ce
      - personId: erwin-wilms
        role: Directeur
        bio: Erwin regelt aanvragen en vergunningen en begeleidt internationale projecten.
        _key: k_5fe478b35edaa77dd0a2
      - personId: patrick
        role: Techniek
        bio: Patrick stelt onze vloot samen en zorgt voor een vlekkeloos technisch verloop.
        _key: k_c27f497bc32276117ae9
      - personId: alejandro
        role: Ontwerp
        bio: Alejandro maakt van jullie verhaal een unieke choreografie in 2D en 3D.
        _key: k_9216ad57906a5ee4167a
      - personId: chopper
        role: Happiness
        bio: Chopper zorgt voor het waf-effect van jullie show en voor de goede sfeer op kantoor.
        _key: k_33354ce5e5195eb00295
    _key: k_c25a7d02d05d2423027c
  - type: timeline
    id: meilensteine
    kicker: Onze mijlpalen
    todo: "Moritz' Zahlen weichen vom Bestand ab: VW Golf 350 oder 400 Drohnen (Fragebogen 350), Showzahlen je Jahr (Bestand: 178 Shows bis 21.10.2026). Titel je Jahr sind ein Entwurf."
    headline: Van een privéverjaardag tot aan de andere kant van de *wereld*
    items:
      - when: "2021"
        title: Oprichting
        text: Onze oprichters vragen zich af waarom droneshows tot nu toe bijna alleen in Azië te zien zijn. Dus halen ze ze gewoon naar Duitsland. Op 1 december 2021 richten ze FlyingStars op.
        _key: k_6c6ce3555dadeb7f9c19
      - when: "2022"
        title: De eerste show
        text: Onze eerste droneshow vindt in augustus plaats op een privéverjaardag met 50 drones. Spannend! In hetzelfde jaar volgen er nog zeven, onder andere voor PUMA.
        _key: k_7d0e13be5f980d2587f6
      - when: "2023"
        title: 42 voorstellingen
        text: "In 2023 vliegen we al 42 voorstellingen. Onder andere voor de Deutsche Umwelthilfe, ter ondersteuning van de campagne #BÖLLERCIAO. Bovendien verhuizen we naar Triple Z in Essen."
        _key: k_53114f06e4c47ca208dc
      - when: "2024"
        title: 400 drones voor VW
        text: Met 400 drones zetten we voor VW in Oostenrijk een mijlpaal neer. We vliegen in totaal 45 shows en verfijnen onze processen.
        _key: k_73251c0c3357108c15e8
      - when: "2025"
        title: De eerste indoorshow
        text: In maart vliegen we onze eerste indoorshow voor Siemens op de Hannover Messe. Met Kein Bock auf Nazis mogen we sinds augustus 2025 regelmatig een statement maken.
        _key: k_41fdee284e0f1ec28380
      - when: "2026"
        title: Recordjaar
        text: "Recordjaar: voor een Nederlandse musical vliegen we met 600 drones twintig nachten achter elkaar! In november volgt onze grootste show tot nu toe, met 700 drones in het Caribisch gebied, meteen ook onze verste opdracht."
        _key: k_72e4446870d686464b34
    cta:
      label: Alle referenties
      href: /referenzen/
    surface: alt
    _key: k_65625cffa99167129c8b
  - type: location
    id: standort
    kicker: Locatie
    todo: FlyingStars muss ein Foto des Triple Z bzw. des Büros liefern, falls es statt der Karte stehen soll.
    headline: Thuis in *NRW*
    text: "Komen jullie een keer langs voor een kop koffie? Dan nodigen we jullie graag uit in ons kantoor. Daar zitten we in Triple Z, het oprichterscentrum op Zeche Zollverein, omringd door innovatieve start-upgeest en de industriële traditie van Noordrijn-Westfalen."
