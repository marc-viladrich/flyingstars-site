title: FlyingStars in de pers (ZDF, WDR, ntv en meer)
navLabel: Pers
description: "Misschien kennen jullie ons hiervan: we praten vaak over duurzaamheid & innovatie van droneshows ☎︎ +49 209 88306562"
sections:
  - type: press
    id: presse
    kicker: FlyingStars in de pers
    headline: Misschien kennen jullie ons *al*?
    text: Als jonge start-up uit Noordrijn-Westfalen zijn we vaak het aanspreekpunt voor de media. Meestal gaat het over onze droneshows, hun duurzaamheid vergeleken met vuurwerk of technische innovaties. Grote kans dat jullie ons al eens gezien hebben …
    cta: { label: Contact opnemen, href: "#anfrage" }
    items:
      - { id: heise, name: heise online, logo: /brand/logos/presse-heise.svg, cleared: true, title: Technische innovatie, date: "2026-01", text: "In januari 2026 ontvingen we heise online om te praten over de huidige stand en de toekomstige ontwikkeling van dronetechnologie.", "_key": "k_7afe9802c73cf1eaac21", "knock": false, "featured": false }
      - { id: ndr, name: NDR, logo: /brand/logos/presse-ndr.svg, cleared: true, title: "#BÖLLERCIAO", date: "2025-12-17", text: "Hallo Niedersachsen berichtte op 17-12-2025 over onze droneshow voor de Deutsche Umwelthilfe in Lüneburg.", "_key": "k_6b732df4e174a565ed1f", "knock": false, "featured": false }
      - { id: waz, name: WAZ, logo: /brand/logos/presse-waz.svg, cleared: true, title: Havenfeest Ruhrort, date: "2025-08-13", text: "We brengen een dronespektakel naar Duisburg. Op 13-08-2025 presenteerde de WAZ het concept en interviewde onze medeoprichter Erwin.", href: "https://www.waz.de/lokales/duisburg/article409722481/ruhrorter-hafenfest-die-geheimnisse-hinter-dem-neuen-highlight.html", linkLabel: Naar het artikel, "_key": "k_9fca4e32123469ec0311", "knock": false, "featured": false }
      - { id: ntv, name: ntv, logo: /brand/logos/presse-ntv.svg, cleared: true, knock: true, featured: true, title: FlyingStars als start-up, date: "2025-06-21", text: "In het ntv Startup Magazin mochten we ons team en onze missie voorstellen. De uitzending was op 21-06-2025.", href: "https://www.n-tv.de/mediathek/magazine/startup_news/Drohnen-verwandeln-Nachthimmel-in-Showbuehne-article25835436.html", linkLabel: Naar de reportage, "_key": "k_3f9037c3b9c946fc7bdb" }
      - { id: tagesspiegel, name: Tagesspiegel, logo: /brand/logos/presse-tagesspiegel.svg, cleared: true, title: Alternatief voor vuurwerk, date: "2023-11-27", text: "Al op 27-11-2023 berichtte de Tagesspiegel over onze droneshow voor de campagne #BÖLLERCIAO van de Deutsche Umwelthilfe.", href: "https://www.tagesspiegel.de/berlin/drohnen-statt-boller-deutsche-umwelthilfe-zeigt-alternative-zum-berliner-silvester-feuerwerk-10846906.html", linkLabel: Naar het artikel, "_key": "k_248dbccc35d6581abd74", "knock": false, "featured": false }
      - { id: zdf, name: ZDF, logo: /brand/logos/presse-zdf.svg, cleared: true, knock: true, title: Spectaculaire zwermen, date: "2023-05-21", text: "In de KiKA-quizshow „1, 2 oder 3” mochten we kinderen enthousiast maken voor droneshows. De aflevering werd uitgezonden op 21-05-2023. Helaas is ze op dit moment niet online beschikbaar.", "_key": "k_1724569aec737d2bba0d", "featured": false }
    _key: k_3203e6063dedf526e6f1
