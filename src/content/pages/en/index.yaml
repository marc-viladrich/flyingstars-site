  - type: steps
    id: darum
    kicker: Why FlyingStars
    headline: Good to know
    _key: k_92d0a7f1633ea84ff104
    steps:
      - title: All-inclusive
        text: "From design and permits to the fleet and safety: with us you get everything from a single source, from a well-rehearsed team."
        _key: k_4161b97d77cfdcb1c686
      - title: Fast
        text: "We can make shows happen within one to two weeks. As an authorised operator, we can skip many permit procedures."
        _key: k_e8d0aa1d372af5e42c97
      - title: International
        text: "We fly in Germany, Austria and Switzerland – and, thanks to comprehensive permits, quickly across the EU and worldwide too."
        _key: k_c8740dc80d6854f37ae5
    ownNumbers: true
  - type: textMedia
    id: sicherheit
    kicker: Safety
    headline: So everything flies smoothly
    _key: k_80f57143a3d7d816104c
    todo: FlyingStars muss die Website-Angabe Windstärke 5 mit den Windgrenzen der AGB abstimmen.
    body: "So that you can enjoy the performance without a worry, we work to the highest safety standards. We take care of all permits, secure the 100 x 100 metre flight area and are happy to provide stewards.\n\n- Certified by the German Federal Aviation Office (LBA) and the EU Aviation Safety Agency (EASA)\n- Liability insurance of up to €1.3 million in every package protects you in case of damage\n- Shows can go ahead in winds up to force 5 and light drizzle"
    mediaSide: right
    cta:
      label: What we need from you
      href: /faq/#planung
  - type: textMedia
    id: nachhaltigkeit
    kicker: Sustainability
    todo: Moritz und FlyingStars müssen die Umweltformulierungen vor Veröffentlichung prüfen und die Belege für Ökostrom und das TÜV-Nord-Schallschutzgutachten bereithalten.
    _key: k_001c02ae39915e989410
    headline: No bang. No litter. No smoke.
    body: "Dogs and children are very welcome at our drone events: they are waste-free, locally emission-free and hum more quietly than fireworks. With shows for Deutsche Umwelthilfe and Kein Bock auf Nazis, we also regularly send ecological and social signals into the sky.\n\n- No bang: TÜV NORD confirms the noise protection of our technology.\n- No litter: reusable drones, charged with 100% green electricity.\n- No smoke: no harmful emissions are produced on site."
    image:
      src: https://flyingstars.art/wp-content/uploads/2024/07/D_Umwelthilfe_cover_img.png
      alt: "Colourful firework blossom made of drones above Berlin for the #Böllerciao campaign by Deutsche Umwelthilfe"
      width: 1920
      height: 987
    mediaSide: right
    cta:
      label: About sustainability
      href: /ueber-uns/#nachhaltigkeit
  - type: steps
    id: ablauf
    kicker: Process
    headline: From idea to applause
    _key: k_22cad4004e6677e22092
    steps:
      - title: "#1 Enquiry"
        text: "Tell us the date, place and occasion. Within 48 hours at the latest, we give you an assessment. After the initial call you receive the quote; a site visit is rarely necessary."
        _key: k_07593dae179ab85954fb
      - title: "#2 Planning"
        text: "Together we develop the storyline, motifs and music. You are as involved as you want to be. With the landowners' consent, we obtain all permits."
        _key: k_8712fd69e4210fc7f3f1
      - title: "#3 Show day"
        text: "We organise safety, set-up and dismantling from around three and a half hours before the show. The spectacle lasts up to 25 minutes. You enjoy it with your guests."
        _key: k_002bb2a1e4204dd1d7d4
    ownNumbers: true
  - type: landingTeaser
    id: preise
    kicker: Prices
    headline: Put your show together
    text: "We make anything possible: from small events on tight budgets to big spectacles with more drones, more music and more wow. Always transparent, always at a fixed price with no surprises."
    todo: "FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan."
    _key: k_bb613fb3a85d23de53b1
    href: /drohnenshow-preise/#konfigurator
    cta: Plan your show
    loop: start
  - type: team
    id: ueber
    kicker: About FlyingStars
    headline: Shining drones for shining eyes
    text: "We want to fascinate, thrill and move people. That is why, since 2021, we have been showing that unforgettable moments can be full of magic – and quiet, clean and considerate at the same time."
    members:
      - personId: ronja-donsbach
      - personId: florian-becker
      - personId: erwin-wilms
      - personId: patrick
      - personId: alejandro
    note: "As seen on: ZDF, WDR, NTV, WAZ"
    cta:
      label: About us
      href: /ueber-uns/
    todo: FlyingStars muss ein Teamfoto bzw. hochauflösende Porträts liefern; eine Presseseite für „In der Presse“ fehlt.
    _key: k_43486c946660a912fde1
    secondary:
      label: In the press
      href: "#kundinnen"
  - type: contactForm
    kicker: Book a drone show direct from the operator
    headline: Let's plan your moment
    _key: k_101f174c707888bef85a
    todo: FlyingStars und die Datenschutzberatung müssen Versanddienst, Empfängerpostfach, Auftragsverarbeitung, Drittlandtransfers und Löschfristen festlegen und die Datenschutzhinweise freigeben.
    text: "Tell us about your ideas, ask us your question or reserve one of the available dates in 2027 and 2028. We reply within 48 hours."
