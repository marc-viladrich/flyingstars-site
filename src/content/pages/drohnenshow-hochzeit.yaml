# Landingpage Hochzeit (nicht im Menü). Konzept HZ-01 bis HZ-10, Fakten: Fragebogen 21.10.2026. Inhalte aus Elevate (30.10.).
# Runde 8 (31.10.2026, Marc: „deutlich mehr in dieses Interaktive … bei der Hochzeit insbesondere mit den Preisen und der
# Location und dem Ablauf“): Hero mit Showreel im Rahmen, Referenzen als Geschichten, Motive im Konfigurator-Teaser,
# Preis als Preiskarte, Location als Schema mit Checkliste, Ablauf als Zeitstrahl in Zahlen, Überraschung mit Gesichtern,
# Wetter als Kacheln. Bausteine: src/components/landing/.
# Runde 9 (Marc: CTAs schmal und zentriert, „ein paar Sachen sind noch ein bisschen random“): Abschlüsse als .promise,
# Wiederholungen raus (48 h stand viermal da), Express als Abkürzung am Strahl, Icons in den Wetter-Kacheln.
# Preise: src/content/show-packages.ts (SPARK 7.900 €, +900 € je 10 Drohnen bis 150), die Karte rechnet daraus.
# Referenzen: Live-Seiten „Hochzeitsüberraschung“ (Recklinghausen, 29.06.2024, 150 Drohnen) und „Heiratsantrag“
# (Schloss Hugenpoet, 10.09.2024, 220 Drohnen). Zonen der Location: Technik-Datenblatt 09/2026 (public/media/downloads).
# Offen: Größe der Startfläche (15 × 15 oder 25 × 25 m), deshalb ohne Maß.
# Alle Texte sind Entwürfe für Moritz; neu formulierte Stellen tragen den Kommentar „Entwurf für Moritz“.
title: Drohnenshow zur Hochzeit
navLabel: "Hochzeit"
description: "Eine Drohnenshow für eure Hochzeit: Initialen, Herz und Datum am Nachthimmel. SPARK mit 100 Drohnen ab 7.900 € netto, Genehmigung inklusive."
image: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
sections:
  - type: landingHero
    kicker: Hochzeit
    headline: Eine Drohnenshow für eure Hochzeit.
    text: Eure Initialen, ein Herz und euer Datum am Nachthimmel. Wir planen die Show mit euch, holen die Genehmigung ein und fliegen am Abend eurer Feier.
    cta: { label: Hochzeitsshow anfragen, href: "#anfrage" }
    secondary: { label: So läuft es ab, href: "#ablauf" }
    video: showreel
    videoLabel: Showreel
    poster:
      src: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
      alt: Hand mit Ring aus Drohnen am blauen Abendhimmel über Baumkronen, bei einem Heiratsantrag am Schloss Hugenpoet
      width: 2063
      height: 1303
    # Entwurf für Moritz: Eckdaten unter dem Satz (Werte aus show-packages.ts und dem Fragebogen)
    facts:
      - { value: ab 7.900 €, label: netto mit SPARK }
      - { value: 100 Drohnen, label: im Paket }
      - { value: inklusive, label: Genehmigung }

  # Entwurf für Moritz: Referenzen als zwei Geschichten statt Fließtext, Inhalte wie bisher
  - type: landingStories
    id: referenzen
    kicker: Referenzen
    headline: So sah das bei anderen *Paaren* aus.
    items:
      - kicker: Recklinghausen · Juni 2024
        title: Eine Überraschung, die die Familie geplant hat
        text: Die Familie kam vier Monate vor der Hochzeit auf uns zu. Die Startfläche lag auf einem Nachbargrundstück, ohne dass das Brautpaar davon wusste. Wegen eines Gewitters haben wir am Abend verschoben und dann geflogen.
        image:
          src: https://flyingstars.art/wp-content/uploads/2024/12/Hochzeit_cover.jpg
          alt: Zwei Blüten aus violetten und blauen Lichtpunkten am Abendhimmel über Bäumen, bei einer Hochzeit in Recklinghausen
          width: 1518
          height: 854
        facts:
          - { value: "150", label: Drohnen }
          - { value: 4 Monate, label: vorher angefragt }
      - kicker: Schloss Hugenpoet, Essen · September 2024
        title: "„Do you want to be my Forever?“"
        text: Eine Schmuckschatulle öffnete sich, ein Ring schwebte an eine Hand, danach stand die Frage am Himmel. Die Antwort war Ja.
        image:
          src: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
          alt: Hand mit Ring aus Drohnen am blauen Abendhimmel über Baumkronen, bei einem Heiratsantrag am Schloss Hugenpoet
          width: 2063
          height: 1303
        facts:
          - { value: "220", label: Drohnen }

  # Motive: Konfigurator-Teaser statt Text-Banner (Marc, 31.10.2026: „damit man unterschiedliche Motive sieht“)
  - type: landingTeaser
    id: motive
    kicker: Motive
    headline: Was am Himmel *stehen* kann.
    text: Herzen und Ringe aus unserem Katalog, dazu eure Initialen oder euer Datum. Eure eigene Show entwerfen wir mit euch.
    href: "/drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator"
    cta: Motive im Konfigurator ansehen
    loop: hochzeit

  # Entwurf für Moritz: Preis als Karte. Inhalte wie bisher; „Kontakt“-Satz neu.
  - type: landingPrice
    id: preise
    kicker: Preise
    headline: Was eine Hochzeitsshow kostet.
    text: Für Hochzeiten ist SPARK gedacht. Alle Preise netto zuzüglich Anfahrt.
    package: SPARK
    groups:
      - title: Enthalten
        items:
          - { label: Design eurer Motive mit Freigabe }
          - { label: Genehmigung }
          - { label: Musikschnitt }
          - { label: Unser Team vor Ort }
          - { label: "Haftpflicht bis 1,3 Mio. €" }
      - title: Kann dazukommen
        items:
          - { label: Anfahrt ab Gelsenkirchen, value: nach Ort }
          - { label: Express unter 14 Tagen Vorlauf, value: nach Aufwand }
          - { label: Rohaufnahmen mit Kameradrohne, value: 900 € }
    bonus: { value: "−10 %", text: "Frühbucherrabatt: Bucht ihr bis zum Jahresende für eine Hochzeit im nächsten Jahr." }
    closing:
      headline: Euer Datum steht schon?
      text: Ronja, Florian und Erwin beantworten eure Anfrage innerhalb von 48 Stunden.
      button: { label: Hochzeitsshow anfragen, href: "#anfrage" }

  # Textentwurf für Moritz. Quellen und Konflikte: docs/sicherheitskonzept-quellen.md.
  - type: landingSite
    id: location
    kicker: Location
    headline: Passt eure Location?
    text: Schickt uns die Adresse und die geplante Position eurer Gäste. Vor dem Angebot prüfen wir, ob und wie die Show dort möglich ist.
    variant: outdoor
    diagram:
      description: "Draufsicht mit äußerem und innerem Sicherheitsbereich, Flugbereich, Start- und Landebereich sowie Publikum außerhalb. Die Drohnenlinie liegt quer zur Blickrichtung."
      horizontalLabel: ca. 100 m
      verticalLabel: ca. 100 m
      detailLabel: ca. 60 m
      flightLabel: In der Regel bis 120 m Flughöhe
      caption: "Beispiel nach dem Technik-Datenblatt, nicht maßstäblich. Alle Zonen und Abstände berechnen wir für euren Standort. Die 60 m beziehen sich auf die Drohnenlinie in diesem Beispiel."
    items:
      - title: Äußerer Sicherheitsbereich
        value: ca. 100 × 100 m
        text: "Er umfasst auch die inneren Bereiche. Während der Show bleibt er frei von Unbeteiligten, für etwa 15 Minuten. Die Größe hängt von Drohnenzahl, Motiven und Flughöhe ab."
        zone: safety
      - title: Innerer Sicherheitsbereich
        text: "Der operative Sicherheitsbereich umgibt den Flugbereich. Seine Grenzen legen wir mit der Flugplanung fest."
        zone: operative
      - title: Flugbereich
        value: bis 120 m hoch
        text: "Hier fliegen die Drohnen die Motive. Von oben bilden sie eine Linie quer zur Blickrichtung, damit eure Gäste die Motive frontal sehen."
        zone: drones
      - title: Start- und Landebereich
        value: ca. 3 h vor der Show gesperrt
        text: "Ab unserer Ankunft bauen wir auf einer freien, ebenen Fläche das Drohnenraster, Antennenstative und die Kontrollstation auf. Die benötigte Fläche hängt von der Drohnenzahl ab."
        zone: start
      - title: Publikumsbereich
        text: "Eure Gäste stehen außerhalb des äußeren Sicherheitsbereichs und brauchen freie Sicht auf die Show. Ihre Position planen wir mit euch, mit Abstand zu Hauswänden und Bäumen."
        zone: guests
    responsibilities:
      provider:
        - "Wir prüfen den Standort vor dem Angebot, zeichnen die Zonen ein und erstellen Sicherheitskonzept und Flugplanung."
        - "Wir haben eine generische Betriebsgenehmigung des LBA und übernehmen weitere luftrechtliche Anträge, etwa bei der DFS. Für andere EU-Länder beantragen wir zusätzlich Cross-border-Bestätigungen."
        - "In Flughafen-Kontrollzonen holen wir die Verkehrsfreigabe ein. Die Abstimmung zu Bundeswasserstraßen übernehmen wir ebenfalls."
        - "Ein Schreiben für die Zustimmung der Grundstückseigentümer:innen bekommt ihr von uns. Bei Naturschutzgebieten hilft eine erste Anfrage durch den Betreiber vor Ort; Antrag und Flugplanung übernehmen wir."
      customer:
        - "Ihr stellt die benötigten Flächen bereit und holt die Zustimmung aller Grundstückseigentümer:innen im gesamten äußeren Sicherheitsbereich ein. Bei öffentlichen Flächen stimmt die Stadt oder Gemeinde zu. Auch Gebäude dürfen nur mit Zustimmung der Eigentümer:innen überflogen werden."
        - "Ihr sichert den Sicherheitsbereich während der Show, sofern wir nichts anderes vereinbaren. Meist reicht Flatterband; an belebten Orten braucht es ein bis zwei Ordner:innen, über Wasser eine Person im Boot."
        - "Ihr haltet die ebene Startfläche ab unserer Ankunft gesperrt und nennt uns Hindernisse im Flugbereich und im Sichtfeld, möglichst mit Höhen."
        - "Ihr benennt eine erreichbare Ansprechperson für den Showtag und stimmt Showzeit und Beschallung mit uns ab. Den Musikschnitt liefern wir; für kleine Gruppen können wir eine große Box stellen."
    planning:
      title: Genehmigungen brauchen Vorlauf
      text: "Plant idealerweise ein bis zwei Monate ein, bei aufwendigen Genehmigungen etwa in Flughafennähe eher drei Monate. Express ist je nach Standort in ein bis zwei Wochen möglich, mit Aufpreis nach Aufwand. Das sind Planungsrichtwerte; die nötigen Freigaben prüfen wir für euren Ort."
    note: { value: "bis 1,3 Mio. €", text: "Drohnen-Haftpflicht in jedem Outdoor-Paket. Dafür braucht ihr keine zusätzliche Versicherung. Wir fliegen in der speziellen Kategorie nach den europäischen Vorgaben. Die Betriebsgenehmigung erteilt das LBA." }
    download: { label: Technik-Datenblatt · PDF, href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf }

  # Entwurf für Moritz: Ablauf in Zahlen wie auf der Startseite. Quellen: Fragebogen 21.10. (48 h, mind. 3 Wochen Design,
  # 1–2 Monate ideal, ca. 3 h Aufbau, ca. 3 Monate bei Flughafennähe).
  - type: tempo
    id: ablauf
    kicker: Ablauf
    headline: Ihr feiert, wir kümmern uns um den Rest.
    text: Ihr kümmert euch um die Feier, wir melden uns, wenn wir eine Entscheidung brauchen. Ideal sind ein bis zwei Monate Vorlauf.
    marks:
      - { value: 48 h, label: bis zu unserer Antwort, text: "Datum, Location und eure Idee reichen. Danach ein kurzes Gespräch und euer Angebot." }
      - { value: 3 Wochen, label: "für Motive und Musik, mindestens", text: "Ihr seht einen Entwurf mit eurer Musik, gebt Feedback und am Ende jedes Motiv frei." }
      - { value: 3 h, label: vor der Show vor Ort, text: "Unser Team sperrt die Startfläche, fliegt die Show und baut danach wieder ab." }
    # Express als Abkürzung über dem Strahl wie auf der Startseite (Fragebogen: unter 14 Tagen, Aufpreis nach Aufwand)
    shortcut: { value: Express unter 14 Tagen, label: Aufpreis nach Aufwand }

  - type: landingCta
    headline: Es soll eine *Überraschung* werden?
    text: Ob Heiratsantrag oder Geschenk der Familie, wir stimmen uns nur mit euch ab. Die Startfläche richten wir abseits ein und den Startzeitpunkt planen wir mit der Location.
    button: { label: Überraschung anfragen, href: "#anfrage" }

  # Entwurf für Moritz: Wetter als Kacheln, Inhalte wie bisher
  - type: landingBento
    id: wetter
    kicker: Wetter
    headline: Und wenn das Wetter nicht mitspielt?
    lead:
      icon: shield-check
      title: Eine Drohnenshow ist keine *Pyrotechnik*.
      text: Kein Knall, kein Rauch, keine Funken und nichts, was danach auf dem Rasen liegt. Laut ist nur eure Musik.
    items:
      - { icon: wind, title: Bis Windstärke 5, text: "So lange fliegen wir, auch bei leichtem Nieselregen." }
      - { icon: calendar-sync, title: Kostenlos verschieben, text: "Ist schlechtes Wetter absehbar, verschieben wir, solange wir noch nicht losgefahren sind." }
      - { icon: wallet, title: 40 % Anzahlung, text: "Zahlt ihr bei der Buchung an. Fällt die Show ganz aus, gilt die Staffel aus unseren AGB." }

  - type: faq
    id: fragen
    kicker: FAQ
    headline: Fragen von Paaren.
    text: Kurz beantwortet. Weitere Antworten findet ihr in den häufigen Fragen.
    cta: { label: Alle Fragen, href: /faq/ }
    tags: [hochzeit]

  - type: contactForm
    kicker: Anfrage
    headline: Erzählt uns von eurem Hochzeitstag.
    text: Datum und Location reichen für den Anfang. Wir melden uns innerhalb von 48 Stunden mit einer ersten Einschätzung.
