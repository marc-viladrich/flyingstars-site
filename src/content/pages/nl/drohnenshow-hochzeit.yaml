sections:
  - type: landingHero
    kicker: Bruiloft
    headline: Een droneshow voor jullie bruiloft.
    text: Jullie initialen, een hart en jullie datum aan de nachthemel. We plannen de show samen, regelen de vergunning en vliegen op de avond van jullie feest.
    cta:
      label: Vraag een bruiloftshow aan
      href: "#anfrage"
    secondary:
      label: Zo werkt het
      href: "#ablauf"
    video: showreel
    videoLabel: Showreel
    poster:
      src: https://flyingstars.art/wp-content/uploads/2025/07/Heiratsantrag_Headerbild.jpg
      alt: Een hand met ring van drones aan de blauwe avondhemel boven boomtoppen, bij een aanzoek op Schloss Hugenpoet
      width: 2063
      height: 1303
    facts:
      - value: vanaf € 7.900
        label: exclusief btw met SPARK
      - value: 100 drones
        label: in het pakket
      - value: inbegrepen
        label: Vergunning
    todo: Moritz muss die deutsche Endfassung und die maschinell übersetzten EN-/NL-Texte redaktionell prüfen.
  - type: landingRefs
    id: referenzen
    kicker: Onze shows
    headline: Zo zag het eruit bij andere *stellen*.
    projects:
      - hochzeit-recklinghausen
      - heiratsantrag-hugenpoet
  - type: landingTeaser
    id: motive
    kicker: Beelden
    headline: Wat er aan de hemel kan *staan*.
    text: Harten en ringen uit onze catalogus, met jullie initialen of datum. Jullie eigen show ontwerpen we samen.
    href: /drohnenshow-preise/?anlass=hochzeit&paket=SPARK#konfigurator
    cta: Bekijk beelden in de configurator
    loop: hochzeit
    todo: FlyingStars muss die Motive, Drohnenzahlen und Freischaltstufen anhand von docs/show-motive-inventar.md fachlich bestätigen. Die Vorschau ist kein Flugplan.
  - type: landingPrice
    id: preise
    kicker: Prijzen
    headline: Wat een bruiloftshow kost.
    text: Voor bruiloften is SPARK bedoeld. Alle prijzen zijn exclusief btw en reiskosten.
    package: SPARK
    groups:
      - title: Inbegrepen
        items:
          - label: Ontwerp van jullie beelden, met goedkeuring
          - label: Vergunning
          - label: Muziekmontage
          - label: Ons team ter plaatse
          - label: Aansprakelijkheidsdekking tot € 1,3 miljoen
      - title: Mogelijke extra's
        items:
          - label: Reiskosten vanuit Gelsenkirchen
            value: afhankelijk van locatie
          - label: Express bij minder dan 14 dagen voorbereiding
            value: naar werkzaamheden
          - label: Ruwe opnamen met cameradrone
            value: 900 €
    bonus:
      value: −10 %
      text: "Vroegboekkorting: boek vóór het einde van het jaar voor een bruiloft volgend jaar."
    closing:
      headline: Staat jullie datum al vast?
      text: Ronja, Florian en Erwin beantwoorden jullie aanvraag binnen 48 uur.
      button:
        label: Vraag een bruiloftshow aan
        href: "#anfrage"
    todo: FlyingStars muss die Paketgrenzen, Aufpreise und Leistungen für den Relaunch bestätigen; die endgültige Preisstruktur für 2027 ist noch offen.
  - type: landingSite
    id: location
    kicker: Location
    headline: Is jullie locatie geschikt?
    text: Stuur ons het adres en de geplande positie van jullie gasten. Voordat we een offerte maken, beoordelen we of en hoe een show daar mogelijk is.
    variant: outdoor
    diagram:
      description: Bovenaanzicht met de buitenste en binnenste veiligheidszone, het vlieggebied, de start- en landingszone en het publiek daarbuiten. De rij drones staat dwars op de kijkrichting.
      horizontalLabel: ca. 100 m
      verticalLabel: ca. 100 m
      detailLabel: ca. 60 m
      flightLabel: Meestal tot 120 m vlieghoogte
      caption: Voorbeeld op basis van het technische gegevensblad, niet op schaal. We berekenen alle zones en afstanden voor jullie locatie. De 60 m heeft betrekking op de rij drones in dit voorbeeld.
    items:
      - title: Buitenste veiligheidszone
        value: ca. 100 × 100 m
        text: Deze omvat ook de binnenste zones. Tijdens de show blijft dit gebied ongeveer 15 minuten vrij van niet-betrokken personen. De grootte hangt af van het aantal drones, de motieven en de vlieghoogte.
        zone: safety
      - title: Binnenste veiligheidszone
        text: De operationele veiligheidszone ligt rondom het vlieggebied. We bepalen de grenzen bij de vluchtplanning.
        zone: operative
      - title: Vlieggebied
        value: tot 120 m hoog
        text: Hier vliegen de drones de motieven. Van bovenaf vormen ze een rij dwars op de kijkrichting, zodat jullie gasten de motieven van voren zien.
        zone: drones
      - title: Start- en landingszone
        value: ca. 3 uur voor de show afgesloten
        text: Vanaf onze aankomst bouwen we de droneopstelling, antennestatieven en het controlestation op een vrije, vlakke plek op. De benodigde oppervlakte hangt af van het aantal drones.
        zone: start
      - title: Publiekszone
        text: Jullie gasten staan buiten de buitenste veiligheidszone en hebben vrij zicht op de show nodig. We plannen hun positie samen met jullie, op afstand van gevels en bomen.
        zone: guests
    responsibilities:
      provider:
        - We beoordelen de locatie vóór de offerte, tekenen de zones in en maken het veiligheidsconcept en de vluchtplanning.
        - We hebben een generieke exploitatievergunning van het LBA en verzorgen verdere luchtvaartaanvragen, bijvoorbeeld bij DFS. Voor andere EU-landen vragen we ook grensoverschrijdende bevestigingen aan.
        - In controlezones van luchthavens vragen we de verkeersklaring aan. Ook de afstemming over federale waterwegen nemen we op ons.
        - Jullie krijgen van ons een brief om toestemming van de grondeigenaren te vragen. Bij natuurgebieden helpt een eerste aanvraag door de lokale beheerder; wij verzorgen de formele aanvraag en de vluchtplanning.
      customer:
        - Jullie stellen de benodigde terreinen beschikbaar en vragen toestemming aan alle grondeigenaren binnen de volledige buitenste veiligheidszone. Voor openbare grond geeft de stad of gemeente toestemming. Ook voor het overvliegen van gebouwen is toestemming van de eigenaren nodig.
        - Jullie beveiligen de veiligheidszone tijdens de show, tenzij we iets anders afspreken. Meestal volstaat afzetlint; op drukke locaties zijn één tot twee stewards nodig, boven water een persoon in een boot.
        - Jullie houden de vlakke startlocatie vanaf onze aankomst afgesloten en melden obstakels in het vlieggebied en de zichtlijn, liefst met hoogtes.
        - Jullie wijzen een bereikbare contactpersoon aan voor de showdag en stemmen de showtijd en het geluid met ons af. Wij leveren de muziekmontage; voor kleine groepen kunnen we een grote luidspreker meenemen.
    planning:
      title: Vergunningen vragen voorbereidingstijd
      text: Plan bij voorkeur één tot twee maanden in, bij complexe vergunningen zoals nabij luchthavens eerder drie maanden. Afhankelijk van de locatie is express binnen één tot twee weken mogelijk, met een toeslag op basis van de werkzaamheden. Dit zijn richtlijnen voor de planning; we beoordelen welke toestemmingen voor jullie locatie nodig zijn.
    note:
      value: tot € 1,3 miljoen
      text: Drone-aansprakelijkheidsverzekering in elk outdoorpakket. Jullie hebben hiervoor geen extra verzekering nodig. We vliegen in de specifieke categorie volgens de Europese voorschriften. Het LBA verleent de exploitatievergunning.
    download:
      label: Technisch gegevensblad · PDF
      href: /media/downloads/FlyingStars-Technik-Datenblatt.pdf
    todo: FlyingStars muss die Startflächen je Drohnenzahl und die standortabhängigen Abstände bestätigen; 15 × 15 und 25 × 25 Meter widersprechen sich in den Quellen. Die Zeichnung bleibt ein Beispiel.
  - type: tempo
    id: ablauf
    kicker: Verloop
    headline: Jullie vieren, wij regelen de rest.
    text: Jullie regelen het feest. Wij melden ons als we een beslissing nodig hebben. Eén tot twee maanden voorbereiding is ideaal.
    marks:
      - value: 48 h
        label: tot ons antwoord
        text: Datum, locatie en jullie idee zijn genoeg. Daarna volgen een kort gesprek en jullie offerte.
      - value: 3 weken
        label: voor beelden en muziek, minimaal
        text: Jullie zien een ontwerp met de muziek, geven feedback en keuren uiteindelijk elk beeld goed.
      - value: 3 h
        label: voor de show ter plaatse
        text: Ons team zet de startzone af, vliegt de show en bouwt daarna weer af.
    shortcut:
      value: Express binnen 14 dagen
      label: Toeslag naar werkzaamheden
  - type: landingCta
    headline: Wordt het een *verrassing*?
    text: Of het nu een aanzoek of een cadeau van de familie is, we stemmen alleen met jullie af. De startzone richten we uit het zicht in en de timing regelen we met de locatie.
    button:
      label: Vraag een verrassingsshow aan
      href: "#anfrage"
  - type: landingBento
    id: wetter
    kicker: Weer
    headline: En als het weer niet meewerkt?
    lead:
      icon: shield-check
      title: Een droneshow gebruikt geen *pyrotechniek*.
      text: Geen knallen, rook, vonken of resten op het gras achteraf. Alleen jullie muziek is luid.
    items:
      - icon: wind
        title: Tot windkracht 5
        text: Tot die grens vliegen we, ook bij lichte motregen.
      - icon: calendar-sync
        title: Gratis verplaatsen
        text: Is slecht weer voorzien, dan kunnen we verplaatsen zolang we nog niet onderweg zijn.
      - icon: wallet
        title: 40% aanbetaling
        text: Die betalen jullie bij de boeking. Gaat de show helemaal niet door, dan geldt de annuleringsregeling uit onze voorwaarden.
    todo: FlyingStars muss die Website-Angabe Windstärke 5 mit den Windgrenzen der AGB abstimmen und die aktuelle Ausfall-/Verschiebungsstaffel samt verlinkbarer AGB-Fassung liefern.
  - type: faq
    id: fragen
    kicker: FAQ
    headline: Vragen van stellen.
    text: Kort beantwoord. Meer antwoorden staan bij de veelgestelde vragen.
    cta:
      label: Alle vragen
      href: /faq/
    tags:
      - hochzeit
  - type: contactForm
    kicker: Aanvraag
    headline: Vertel ons over jullie trouwdag.
    text: Datum en locatie zijn genoeg voor het begin. We reageren binnen 48 uur met een eerste inschatting.
