<!doctype html>
<html lang="de">
<meta charset="utf-8">
<!-- Kennzahlen aus der Fallstudie bei 618d93e. Der Test lädt die lokale Originalschrift. -->
<style>
  body { margin: 0; }
  .c-numbers {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 0;
    padding: 6rem 4vw;
  }
  .c-num { display: grid; gap: 0.625rem; align-content: start; padding-right: 1.5rem; }
  .c-num + .c-num { padding-left: clamp(1.125rem, 3vw, 2.5rem); border-left: 1px solid; }
  .c-num dd {
    margin: 0;
    font: 700 clamp(4.5rem, 10vw, 10.5rem)/0.9 'Space Grotesk';
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
  }
  .c-num dt { order: 2; max-width: 26ch; }
</style>
<main>
  <dl class="c-numbers">
    <div class="c-num"><dd>600</dd><dt>Drohnen, unsere bisher größte Einzelshow</dt></div>
    <div class="c-num"><dd>12.000</dd><dt>Drohnen in einem Monat</dt></div>
    <div class="c-num"><dd>20</dd><dt>Shows im Juni 2026, je 600 Drohnen</dt></div>
  </dl>
</main>
